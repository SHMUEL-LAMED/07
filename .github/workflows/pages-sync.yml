# בודק שדף הקו המקורי, קווי המפעל ודעת תורה נבנו מ-src/dash.html.
name: סנכרון דף הניהול
on:
  pull_request:
    paths: ['src/dash.html', 'index.html', 'docs/index.html', 'docs/source/**', 'docs/daattorah/index.html', 'docs/line/**', 'live/daat/**', 'scripts/sync-pages.sh']
  push:
    branches: [main]
    paths: ['src/dash.html', 'index.html', 'docs/index.html', 'docs/source/**', 'docs/daattorah/index.html', 'docs/line/**', 'live/daat/**', 'scripts/sync-pages.sh']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: בנייה מחדש והשוואה
        run: |
          sh scripts/sync-pages.sh
          git diff --exit-code --stat -- index.html docs/index.html docs/source/index.html docs/line/index.html docs/daattorah/index.html live/daat/ || { echo "::error::העותקים של דף הניהול לא מעודכנים. הריצו scripts/sync-pages.sh ודחפו."; exit 1; }
