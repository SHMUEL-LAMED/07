name: סקרים וכתבות — שלוחה 1
on:
  workflow_dispatch:
    inputs:
      eretz_latest:
        description: 'ארץ נהדרת — מקור ואחריו ניסיון טשטוש, לדרייב בלבד'
        type: boolean
        default: false
      blur_existing:
        description: 'טשטוש והחלפת חמשת קטעי ארץ נהדרת בדרייב'
        type: boolean
        default: false
      video_email:
        description: 'שליחת כתבות חדשות בווידאו למייל מהשרת'
        type: boolean
        default: false
      blur_check_only:
        description: 'בדיקת זיהוי וטשטוש בלבד, בלי העלאה'
        type: boolean
        default: false
      repair_archive:
        description: 'פריסת תיקון ההשלמה לדרייב לפני ההרצה'
        type: boolean
        default: false
      video_mail_check_only:
        description: 'בדיקת חיבור הדואר בלבד, בלי שליחה'
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'
    - cron: '37 * * * *'
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths: ['election-news/**', '.github/workflows/election-news.yml']
  pull_request:
    paths: ['election-news/**', '.github/workflows/election-news.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('election-news-pr-{0}', github.ref) || inputs.blur_existing && 'drive-blur-maintenance' || (github.event.schedule == '37 * * * *' || github.event.schedule == '7 * * * *' || inputs.video_email || inputs.video_mail_check_only || inputs.blur_check_only || inputs.repair_archive || (github.event_name == 'push' && contains(github.event.head_commit.message, '[video-now]')) || inputs.eretz_latest || (github.event_name == 'push' && contains(github.event.head_commit.message, '[eretz-now]'))) && 'election-news-video-mail' || 'election-news-collector' }}
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[video-now]') }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s election-news -p 'test_*.py'
      - run: node --test election-news/*.test.mjs
  collect:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.schedule != '37 * * * *' && github.event.schedule != '7 * * * *' && !inputs.video_email && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[video-now]')) && !inputs.eretz_latest && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[eretz-now]')) && !inputs.blur_existing && !inputs.video_mail_check_only && !inputs.blur_check_only && !inputs.repair_archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'yt-dlp[default]==2026.10.21'
      - name: מטמון כלי אודיו
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/election-audio-tools
          key: election-audio-tools-${{ runner.os }}-${{ runner.arch }}-v1
      - name: כלי אודיו
        timeout-minutes: 7
        run: |
          tool_dir="$RUNNER_TEMP/election-audio-tools"
          if [ -x "$tool_dir/ffmpeg" ] && [ -x "$tool_dir/ffprobe" ]; then
            export PATH="$tool_dir:$PATH"
            echo "$tool_dir" >> "$GITHUB_PATH"
          fi
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if ! timeout 150 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg; then
              mkdir -p "$tool_dir"
              curl --fail --location --retry 1 --connect-timeout 10 --max-time 90 \
                https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
                -o "$RUNNER_TEMP/election-ffmpeg.tar.xz"
              tar -xJf "$RUNNER_TEMP/election-ffmpeg.tar.xz" --strip-components=2 \
                -C "$tool_dir" --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
              export PATH="$tool_dir:$PATH"
              echo "$tool_dir" >> "$GITHUB_PATH"
            fi
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: איסוף קובצי המקור והעלאה מאומתת לשלוחה
        run: >-
          python election-news/collector.py
          --endpoint https://election-news-ivr.smwlyqswkwt232.workers.dev
          --max-files 16 --deadline-seconds 540
  video-mail:
    needs: test
    if: github.ref == 'refs/heads/main' && !inputs.blur_existing && (github.event.schedule == '37 * * * *' || github.event.schedule == '7 * * * *' || inputs.video_email || inputs.video_mail_check_only || inputs.blur_check_only || inputs.repair_archive || (github.event_name == 'push' && contains(github.event.head_commit.message, '[video-now]')) || inputs.eretz_latest || (github.event_name == 'push' && contains(github.event.head_commit.message, '[eretz-now]')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'yt-dlp[default]==2026.10.21'
      - name: פריסת תיקון ארכיון דרייב
        if: inputs.repair_archive || (github.event_name == 'push' && contains(github.event.head_commit.message, '[video-now]'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/deploy-news-archive.py
      - name: החזרת גשר הווידאו אם נמחק בפריסה אחרת של שרת הדואר
        if: ${{ !inputs.repair_archive && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[video-now]')) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://yemot-mail.smwlyqswkwt232.workers.dev/news-video/state || true)
          echo "bridge_state_http $code"
          # 404 means the routes are gone; any other answer leaves the live worker untouched.
          if [ "$code" = "404" ]; then python scripts/deploy-news-archive.py; fi
      - name: כלי טשטוש וידאו
        run: python -m pip install 'opencv-python-headless==4.10.0.84'
      - name: כלי וידאו
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            for attempt in 1 2 3; do
              if timeout 300 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg; then
                break
              fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              timeout 120 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update || true
              sleep 5
            done
          fi
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null

      - name: ארץ נהדרת — הפרק האחרון לדרייב, מקור ואחריו טשטוש
        if: github.event.schedule == '7 * * * *' || inputs.eretz_latest || (github.event_name == 'push' && contains(github.event.head_commit.message, '[eretz-now]'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ '${{ inputs.eretz_latest }}' = 'true' ]; then python scripts/deploy-news-archive.py; fi
          python election-news/eretz.py --endpoint https://yemot-mail.smwlyqswkwt232.workers.dev
      - name: העלאת כתבות בשמות מקוריים לדרייב וטשטוש לאחר העלאה
        if: github.event.schedule != '7 * * * *' && !inputs.eretz_latest && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[eretz-now]'))
        env:
          BLUR_CHECK_ONLY: ${{ inputs.blur_check_only }}
          BLUR_WOMEN: '0'
          POST_BLUR: '1'
          CHECK_ONLY: ${{ inputs.video_mail_check_only }}
        run: |
          args=()
          if [ "$BLUR_CHECK_ONLY" = "true" ]; then args+=(--check-blur); fi
          if [ "$CHECK_ONLY" = "true" ]; then args+=(--check-only); fi
          python election-news/video_mail.py \
            --endpoint https://election-news-ivr.smwlyqswkwt232.workers.dev \
            --mail-endpoint https://yemot-mail.smwlyqswkwt232.workers.dev \
            "${args[@]}"

  deploy-drive-blur:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.blur_existing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: הכנת עיבוד הקטעים הקיימים
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/deploy-news-archive.py
  blur-existing:
    needs: deploy-drive-blur
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        file:
          - 1rDhBSHYbgYhX43oApu7XW9Q2Zb2fGqYn
          - 15kq6-aPWIJE4rYoLQ5GgDBEPDUtZACQT
          - 1Y15dd7yvUerMTQprpvSMmUl64lBksg3O
          - 1Owz-STPGGUEAqbmtUR522TlpympTx2PT
          - 1sV_kL2chdt5UUM6qILTWHOYvAQGFrKNq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'opencv-python-headless==4.10.0.84'
      - name: כלי וידאו
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            for attempt in 1 2 3; do
              if timeout 300 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg; then
                break
              fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              timeout 120 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update || true
              sleep 5
            done
          fi
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null

      - name: טשטוש והחלפה בדרייב
        env:
          DRIVE_VIDEO_ID: ${{ matrix.file }}
        run: python election-news/blur_drive.py --endpoint https://yemot-mail.smwlyqswkwt232.workers.dev --file-id "$DRIVE_VIDEO_ID"
