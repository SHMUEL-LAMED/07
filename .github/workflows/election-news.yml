name: סקרים וכתבות — שלוחה 1
on:
  workflow_dispatch:
    inputs:
      video_email:
        description: 'שליחת כתבות חדשות בווידאו למייל מהשרת'
        type: boolean
        default: false
      video_mail_check_only:
        description: 'בדיקת חיבור הדואר בלבד, בלי שליחה'
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths: ['election-news/**', '.github/workflows/election-news.yml']
  pull_request:
    paths: ['election-news/**', '.github/workflows/election-news.yml']
permissions:
  contents: read
concurrency:
  group: election-news-collector
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s election-news -p 'test_*.py'
      - run: node --test election-news/*.test.mjs
  collect:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.schedule != '37 * * * *' && !inputs.video_email
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'yt-dlp[default]==2026.10.21'
      - name: מטמון כלי אודיו
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/election-audio-tools
          key: election-audio-tools-${{ runner.os }}-${{ runner.arch }}-v1
      - name: כלי אודיו
        timeout-minutes: 7
        run: |
          tool_dir="$RUNNER_TEMP/election-audio-tools"
          if [ -x "$tool_dir/ffmpeg" ] && [ -x "$tool_dir/ffprobe" ]; then
            export PATH="$tool_dir:$PATH"
            echo "$tool_dir" >> "$GITHUB_PATH"
          fi
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if ! timeout 150 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg; then
              mkdir -p "$tool_dir"
              curl --fail --location --retry 1 --connect-timeout 10 --max-time 90 \
                https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
                -o "$RUNNER_TEMP/election-ffmpeg.tar.xz"
              tar -xJf "$RUNNER_TEMP/election-ffmpeg.tar.xz" --strip-components=2 \
                -C "$tool_dir" --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
              export PATH="$tool_dir:$PATH"
              echo "$tool_dir" >> "$GITHUB_PATH"
            fi
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: איסוף קובצי המקור והעלאה מאומתת לשלוחה
        run: >-
          python election-news/collector.py
          --endpoint https://election-news-ivr.smwlyqswkwt232.workers.dev
          --max-files 16 --deadline-seconds 540
  video-mail:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event.schedule == '37 * * * *' || inputs.video_email)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'yt-dlp[default]==2026.10.21'
      - name: כלי וידאו
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 180 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
      - name: וידאו מקורי ושליחה שעתית למייל
        env:
          CHECK_ONLY: ${{ inputs.video_mail_check_only }}
        run: |
          args=()
          if [ "$CHECK_ONLY" = "true" ]; then args+=(--check-only); fi
          python election-news/video_mail.py \
            --endpoint https://election-news-ivr.smwlyqswkwt232.workers.dev \
            --mail-endpoint https://yemot-mail.smwlyqswkwt232.workers.dev \
            "${args[@]}"
