name: Check admin bridge
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test bridge
        run: |
          set -e
          BASE="https://07-admin-bridge-production.up.railway.app"
          echo "health:"
          curl -fsS "$BASE/health"
          echo
          echo "preflight:"
          curl -i -sS -X OPTIONS "$BASE/admin/api/session"             -H 'Origin: https://shmuel-lamed.github.io'             -H 'Access-Control-Request-Method: POST'
          echo
          echo "session wrong-pass (should be 401 JSON, not fetch/network failure):"
          curl -i -sS -X POST "$BASE/admin/api/session"             -H 'Origin: https://shmuel-lamed.github.io'             --data '{"password":"__bridge_test_wrong__"}'
