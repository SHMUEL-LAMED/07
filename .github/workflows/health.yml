# בדיקת בריאות לפני פריסה: משווה את הקוד בריפו (main) לגרסה החיה של yemot-ai ומתריע אם יש בחיה שינוי שלא בריפו.
# רץ כל יום, ואפשר להריץ ידנית לפני פריסה (Actions ← בדיקת בריאות). לא משנה כלום ב-Cloudflare – קריאה בלבד.
name: בדיקת בריאות
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: השרת עונה
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://yemot-ai.smwlyqswkwt232.workers.dev/admin/api/config)
          echo "admin/api/config: $code"; [ "$code" = 200 ] || { echo "::error::השרת החי לא עונה ($code)"; exit 1; }
      - name: בנייה של הקוד בריפו
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/build
      - name: השוואה לגרסה החיה
        # נכשל (ושולח התראה) אם בחיה יש קוד שלא נמצא באף גרסה בריפו. אם החיה רק מאחורי הריפו (שינויים שעוד לא נפרסו) – הודעה בלבד.
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::warning::חסרים הסודות CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID – מדלגים על ההשוואה"; exit 0; }
          curl -sS --fail-with-body -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/yemot-ai/content/v2" -D /tmp/h.txt -o /tmp/live.bin || { echo "::error::הורדת הגרסה החיה נכשלה"; head -c 500 /tmp/live.bin 2>/dev/null; exit 1; }
          python3 - <<'PY'
          import email, re
          h = open('/tmp/h.txt', encoding='latin-1').read(); raw = open('/tmp/live.bin', 'rb').read()
          ct = re.search(r'(?im)^content-type:\s*(.+)$', h); ct = ct.group(1).strip() if ct else ''
          live = raw
          if 'multipart' in ct:
              msg = email.message_from_bytes(b'Content-Type: ' + ct.encode() + b'\r\n\r\n' + raw)
              for part in msg.walk():
                  name = part.get_param('name', header='content-disposition') or part.get_filename() or ''
                  if name.endswith('.js'): live = part.get_payload(decode=True); break
          open('/tmp/live.js', 'wb').write(live)
          PY
          # מנרמלים הערות ורווחים שהבנייה של wrangler עשויה לשנות בין גרסאות
          cat > /tmp/same.py <<'PY'
          import sys, difflib
          norm = lambda p: [l.strip() for l in open(p, 'rb').read().decode('utf-8', 'replace').split('\n') if l.strip() and not l.strip().startswith('//') and '__name(' not in l]
          a, b = norm(sys.argv[1]), norm(sys.argv[2])
          if a == b: raise SystemExit(0)
          if len(sys.argv) > 3:
              d = [l for l in difflib.unified_diff(a, b, 'live', 'repo', lineterm='', n=0) if not l.startswith(('---', '+++', '@@'))]
              only_live = [l[1:] for l in d if l.startswith('-')]
              print(f'הבדלים: {len(only_live)} שורות רק בחיה, {sum(1 for l in d if l.startswith("+"))} שורות רק בריפו')
              for l in only_live[:40]: print('  חיה:', l[:200])
          raise SystemExit(1)
          PY
          if python3 /tmp/same.py /tmp/live.js /tmp/build/worker.js; then echo "החיה זהה לריפו"; exit 0; fi
          python3 /tmp/same.py /tmp/live.js /tmp/build/worker.js show || true
          for C in $(git log --format=%H -n 30 -- src wrangler.toml); do
            rm -rf /tmp/wt /tmp/b; git worktree prune
            git worktree add --detach -q /tmp/wt "$C" || continue
            if (cd /tmp/wt && npx --yes wrangler@4 deploy --dry-run --outdir /tmp/b >/dev/null 2>&1) && python3 /tmp/same.py /tmp/live.js /tmp/b/worker.js; then
              echo "::notice::החיה זהה לגרסה $C בריפו – בריפו יש שינויים שעוד לא נפרסו"; exit 0
            fi
            git worktree remove --force /tmp/wt
          done
          echo "::error::בגרסה החיה יש קוד שלא נמצא באף גרסה בריפו (30 האחרונות). לעדכן את הריפו לפני פריסה, אחרת הפריסה תדרוס אותו"; exit 1
