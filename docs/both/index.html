<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול הקווים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap">
<style>
:root{--bg:#f6f4ef;--card:#fffefb;--fg:#14161d;--muted:#8b8e97;--line:#e9e5db;--acc:#3646c9;--gold:#a8844a;--glass:rgba(255,254,251,.82);--good:#16865a;--sh:0 6px 16px -10px rgba(20,22,29,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#0c0d11;--card:#14161c;--fg:#f3f1ec;--muted:#80828b;--line:#24272f;--acc:#8c9cff;--gold:#d6b27a;--glass:rgba(20,22,28,.82);--good:#3ccf8e;--sh:0 8px 20px -12px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{position:relative;z-index:2;display:flex;align-items:center;gap:16px;padding:0 20px;height:64px;background:var(--glass);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 55%,transparent),transparent)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,color-mix(in srgb,var(--acc) 70%,#fff),var(--acc) 55%,color-mix(in srgb,var(--acc) 80%,#000));box-shadow:0 8px 18px -8px var(--acc),inset 0 1px 0 rgba(255,255,255,.35)}
.logo svg{width:20px;height:20px}
.brand h1{margin:0;font:900 19px/1.1 "Frank Ruhl Libre",Heebo,Georgia,serif;letter-spacing:-.3px;white-space:nowrap}
.brand small{display:block;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.5px;margin-top:2px}
.tabs{position:relative;display:flex;gap:4px;margin-inline-start:auto;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.tabs .pill{position:absolute;top:4px;bottom:4px;border-radius:10px;background:var(--card);box-shadow:var(--sh),0 0 0 1px var(--line);transition:inset-inline-start .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1)}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;gap:9px;border:0;background:none;color:var(--muted);padding:7px 16px;border-radius:10px;font:600 14px Heebo,system-ui,sans-serif;cursor:pointer;white-space:nowrap;transition:color .2s}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs button i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s,box-shadow .2s}
.tabs button[aria-selected="true"] i{background:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.tabs small{color:var(--muted);font-weight:500;font-size:12px;direction:ltr;font-variant-numeric:tabular-nums}
.tabs button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 35%,transparent);outline-offset:2px}
main{position:relative;height:calc(100% - 64px)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);animation:fade .35s ease both}
iframe[hidden]{display:none}
@keyframes fade{from{opacity:0}}
@media (max-width:640px){header{padding:0 12px;gap:10px;height:58px}main{height:calc(100% - 58px)}.brand h1{font-size:16px}.brand small{display:none}.tabs small{display:none}.tabs button{padding:7px 12px}}
@media (max-width:380px){.brand div{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="7" y="2" width="18" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><rect x="10" y="5" width="12" height="7" rx="1" fill="currentColor"/><g fill="currentColor"><circle cx="11" cy="16" r="1.25"/><circle cx="16" cy="16" r="1.25"/><circle cx="21" cy="16" r="1.25"/><circle cx="11" cy="20" r="1.25"/><circle cx="16" cy="20" r="1.25"/><circle cx="21" cy="20" r="1.25"/><circle cx="11" cy="24" r="1.25"/><circle cx="16" cy="24" r="1.25"/><circle cx="21" cy="24" r="1.25"/></g></svg></span><div><h1>ניהול הקווים</h1><small>מרחב ניהול משותף</small></div></div>
  <nav class="tabs" role="tablist" aria-label="בחירת קו">
    <span class="pill" aria-hidden="true"></span>
    <button role="tab" data-k="shim" aria-selected="false"><i></i>שימחס<small>073-351-2880</small></button>
    <button role="tab" data-k="daat" aria-selected="false"><i></i>דעת תורה<small>079-494-7582</small></button>
  </nav>
</header>
<main>
  <iframe id="f-shim" title="ניהול שימחס" hidden></iframe>
  <iframe id="f-daat" title="ניהול דעת תורה" hidden></iframe>
</main>
<script>
const SRC = { shim: "../", daat: "../daattorah/" };
function show(k) {
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", b.dataset.k === k);
  for (const key of Object.keys(SRC)) {
    const f = document.getElementById("f-" + key);
    if (key === k && !f.src) f.src = SRC[key] + "?v=" + Date.now(); // תמיד גרסה טרייה, בלי עותק ישן מהמטמון
    f.hidden = key !== k;
  }
  placePill();
  try { localStorage.setItem("bothTab", k); } catch (e) {}
  if (location.hash !== "#" + k) history.replaceState(null, "", "#" + k);
}
function placePill() {
  const b = document.querySelector('.tabs button[aria-selected="true"]'), p = document.querySelector(".tabs .pill"), nav = b && b.parentElement.getBoundingClientRect(), r = b && b.getBoundingClientRect();
  if (!b) return;
  p.style.width = r.width + "px"; p.style.insetInlineStart = (getComputedStyle(b.parentElement).direction === "rtl" ? nav.right - r.right : r.left - nav.left) + "px";
}
addEventListener("resize", placePill);
if (document.fonts) document.fonts.ready.then(placePill);
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => show(b.dataset.k)));
let first = location.hash.slice(1);
if (!SRC[first]) { try { first = localStorage.getItem("bothTab"); } catch (e) {} }
show(SRC[first] ? first : "shim");
</script>
</body>
</html>
