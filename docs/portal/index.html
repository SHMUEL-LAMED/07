ground:#fff;border:1px solid #e5e9f2;border-radius:22px;box-shadow:0 12px 30px #18284d0a}.empty-state h2{margin:0 0 8px;font-size:25px}.empty-state p{color:#737d92}.client-form select{width:100%}.client-form select[multiple]{min-height:155px}.client button{font-size:13px}.owner-tools .btn{white-space:nowrap}@media(max-width:760px){body:not(.logged-out) header{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;padding:10px 12px}.profile-area{grid-column:1;grid-row:1}.brand{grid-column:2;grid-row:1;min-width:0;text-align:left}.brand small{display:none}.line-tabs{grid-column:1/-1;grid-row:2;max-width:100%;padding:4px 0}.line-tab{padding:8px 10px;font-size:13px}.line-tab small{font-size:10px}.profile-button{padding:8px 10px}.line-workspace,.line-workspace iframe{min-height:calc(100vh - 115px);height:calc(100vh - 115px)}.owner-area{margin:18px auto;padding:0 14px 30px}.owner-tools{align-items:flex-start;flex-direction:column}.owner-tools .actions{width:100%}.owner-tools .actions>*{flex:1;text-align:center}}

<header id="topbar"><div class="profile-area"><button id="profileButton" class="profile-button" aria-expanded="false" aria-label="גישה לפרופיל"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span>הפרופיל שלי</span></button><section id="profileMenu" class="profile-menu hidden"></section></div><nav id="lineTabs" class="line-tabs" aria-label="בחירת קו"></nav><div class="brand"><h1>מרכז הקווים</h1><small>האזור האישי</small></div></header>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
"use strict";
const API="https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/admin-netfree/portal";
const CONFIG="https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/admin-netfree/config";
const LINES_API="https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/admin-netfree-lines/";
const LEGACY_LINES=[
  {slug:"shimchas",name:"שימחס",line:"073-351-2880",url:"/07/source/",api:"https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/admin-netfree/",enabled:true,assignable:false},
  {slug:"daat",name:"דעת תורה",line:"079-494-7582",url:"/07/daattorah/",api:"https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/admin-netfree-daat/",enabled:true,assignable:false}
];
const app=document.querySelector("#app"),lineTabs=document.querySelector("#lineTabs"),profileButton=document.querySelector("#profileButton"),profileMenu=document.querySelector("#profileMenu");
let token=sessionStorage.getItem("portalToken")||"",identity=null,googleCredential=sessionStorage.getItem("portalGoogle")||"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function request(url,body){const r=await fetch(url,{method:body?"POST":"GET",headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});const d=await r.json().catch(()=>({error:"תשובה לא תקינה מהשרת"}));if(!r.ok)throw Error(d.error||"שגיאה "+r.status);return d}
async function call(action="me",body){return request(API+"?action="+encodeURIComponent(action)+"&token="+encodeURIComponent(token),body)}
function login(message="כניסה למערכת ניהול הקווים"){
  document.body.classList.add("logged-out");
  app.innerHTML="<div id=\"gbtn\"></div><p id=\"loginError\" class=\"error\">"+(message!=="כניסה למערכת ניהול הקווים"?esc(message):"")+"</p>";
  request(CONFIG).then(config=>{
    if(!config.google)throw Error("כניסה בגוגל עדיין לא הוגדרה בשרת.");
    const timer=setInterval(()=>{if(!window.google?.accounts?.id)return;clearInterval(timer);
      google.accounts.id.initialize({client_id:config.google,callback:async credential=>{
        try{const result=await request(API+"?action=login",{google:credential.credential});token=result.token;googleCredential=credential.credential;sessionStorage.setItem("portalToken",token);sessionStorage.setItem("portalGoogle",googleCredential);await load()}
        catch(e){document.querySelector("#loginError").textContent=e.message}
      }});
      google.accounts.id.renderButton(document.querySelector("#gbtn"),{theme:"outline",size:"large",locale:"he",text:"signin_with",shape:"pill",width:Math.min(320,Math.max(220,window.innerWidth-64))});
    },100);
    setTimeout(()=>clearInterval(timer),15000);
  }).catch(e=>{const p=document.querySelector("#loginError");if(p)p.textContent=e.message});
}
function handoffUrl(line){const u=new URL(line.url,location.href);u.hash="g="+encodeURIComponent(googleCredential);return u.href}
function enterLine(line){location.href=handoffUrl(line)}
function renderLine(line){return `<article class="line"><span class="line-kicker">הקו שלי</span><h3>${esc(line.name)}</h3><p class="muted">מספר קו: ${esc(line.line||"לא הוגדר")}</p>${line.enabled===false?'<span class="line-status">הקו מושהה</span>':''}<div class="actions"><button data-enter="${esc(line.slug)}">ניהול הקו והמנהלים</button></div></article>`}
function accountPanel(data){return `<h2>הפרופיל והחשבון</h2><p>מחובר באמצעות Google</p><b class="profile-email" dir="ltr">${esc(data.email)}</b><p class="muted">${data.isOwner?'לבעלים יש גישה לכל הקווים במערכת.':`יש לך גישה ל־${(data.lines||[]).length} קווים.`}</p><button class="secondary" id="profileLogout">יציאה מהחשבון</button>`}
function renderClients(clients,lines){return `<section class="card"><h2>גישה למשתמשים</h2><p class="muted">בחר חשבון Google והקווים שהוא יראה באזור האישי שלו.</p><div class="client-form"><label>חשבון Google<input id="email" type="email" autocomplete="email" placeholder="name@gmail.com"></label><label>קווים לשיוך<select id="lines" multiple>${lines.filter(l=>l.assignable!==false).map(l=>`<option value="${esc(l.slug)}">${esc(l.name)} · ${esc(l.line)}</option>`).join("")}</select></label></div><p class="muted">לניהול מנהלים בכל קו, היכנס לכרטיס הקו המתאים.</p><button id="approve">שמירת גישה לקווים</button><h3>חשבונות עם גישה</h3>${clients.length?clients.map(c=>`<div class="client"><b dir="ltr">${esc(c.email)}</b> · ${(c.lines||[]).length} קווים ${c.blocked?'<span class="line-status">גישה מושהית</span>':''}<div class="actions"><button class="secondary" data-block="${esc(c.email)}" data-state="${c.blocked?'off':'on'}">${c.blocked?'החזר גישה':'השהה גישה'}</button><button class="danger" data-revoke="${esc(c.email)}">הסר גישה</button></div></div>`).join(""):'<p class="muted">אין עדיין חשבונות נוספים.</p>'}</section>`}
function ownerPanel(data){return `<section class="owner-panel"><section class="card"><div class="owner-tools"><div><h2>ניהול השירות</h2><p>כאן נמצאים כל הקווים במערכת. מתוך ניהול כל קו אפשר להוסיף מנהלים והרשאות.</p></div><div class="actions"><a class="btn" id="addLine" href="/07/source/">הוספת קו</a><button class="secondary" id="refreshStats">רענון נתונים</button></div></div><div id="aggregate" class="stats"><div class="stat">טוען נתונים…</div></div></section>${renderClients(data.clients||[],data.lines||[])}</section>`}
const LINE_SLUG_OK=s=>/^[a-z0-9-]+$/.test(s);
async function lineData(line){
  const base=line.api||LINES_API+encodeURIComponent(line.slug)+"/";
  const session=await request(base+"session",{google:googleCredential});
  const q=name=>request(base+name+(name.includes("?")?"&":"?")+"token="+encodeURIComponent(session.token));
  const [ov,he,st]=await Promise.allSettled([q("overview"),q("health"),q("stats")]);
  if(ov.status!=="fulfilled")throw ov.reason;
  return {line,ov:ov.value,he:he.status==="fulfilled"?he.value:null,st:st.status==="fulfilled"?st.value:null};
}
const sum7=a=>Array.isArray(a)?a.slice(-7).reduce((n,x)=>n+(+x||0),0):null;
function healthOf(h,line){
  if(line.enabled===false)return['off','מושהה'];
  if(!h)return['warn','לא ידוע'];
  const p=[];if(h.cronAgo!=null&&h.cronAgo>300)p.push("המשימות לא רצו "+Math.round(h.cronAgo/60)+" דק׳");
  if((h.errors||[]).length)p.push((h.errors||[]).length+" שגיאות ביומן");
  if((h.bg||[]).length>5)p.push("תור רקע "+h.bg.length);
  return p.length?['warn',p.join(" · ")]:['ok','תקין'+(h.testMode?' · מצב בדיקה':'')];
}
async function lineStats(lines){const area=document.querySelector("#aggregate");if(!area)return;
 area.innerHTML='<div class="stat">טוען נתונים מכל הקווים…</div>';
 try{
  if(!googleCredential)throw Error("יש להתחבר מחדש ל-Google כדי לרענן נתוני קווים.");
  const settled=await Promise.allSettled(lines.map(l=>l.enabled===false?Promise.resolve({line:l,off:true}):lineData(l)));
  const rows=settled.map((x,i)=>x.status==="fulfilled"?x.value:{line:lines[i],err:String(x.reason&&x.reason.message||"לא ענה")});
  const ok=rows.filter(r=>r.ov);
  const tot=f=>ok.reduce((n,r)=>n+(f(r)||0),0);
  const pend=r=>(r.ov.pending||[]).reduce((a,p)=>a+(+p.n||0),0)+(+r.ov.joins||0);
  area.innerHTML=`<div class="stat"><b>${tot(r=>(r.ov.online||[]).length)}</b>מחוברים עכשיו</div><div class="stat"><b>${tot(pend)}</b>ממתינות לאישור</div><div class="stat"><b>${tot(r=>+r.ov.members?.active)}</b>חברים פעילים</div><div class="stat"><b>${tot(r=>sum7(r.st?.calls))}</b>שיחות השבוע</div><div class="stat"><b>${tot(r=>sum7(r.st?.msgs))}</b>הודעות השבוע</div><div class="stat"><b>${ok.length}/${rows.length}</b>קווים שענו</div>
  <div class="lines-table-wrap"><table class="lines-table"><thead><tr><th>קו</th><th>מחוברים</th><th>ממתינות</th><th>חברים</th><th>שיחות השבוע</th><th>הודעות השבוע</th><th>בריאות</th><th></th></tr></thead><tbody>${rows.map(r=>{const l=r.line,[hc,ht]=r.err?['warn',r.err]:healthOf(r.he,l);const factory=!l.legacy&&!LEGACY_LINES.some(x=>x.slug===l.slug)&&LINE_SLUG_OK(l.slug);
   return `<tr><td><b>${esc(l.name)}</b><small>${esc(l.line||"")}${l.manager?' · <span dir="ltr">'+esc(l.manager)+'</span>':''}</small></td><td>${r.ov?(r.ov.online||[]).length:'—'}</td><td>${r.ov?pend(r):'—'}</td><td>${r.ov?`${+r.ov.members?.active||0}/${+r.ov.members?.total||0}`:'—'}</td><td>${r.st?sum7(r.st.calls):'—'}</td><td>${r.st?sum7(r.st.msgs):'—'}</td><td><span class="health ${hc}">${esc(ht)}</span></td><td class="row-actions"><button class="secondary" data-go="${esc(l.slug)}">כניסה</button>${factory?(l.enabled===false?`<button data-resume="${esc(l.slug)}">החזרה לפעולה</button>`:`<button class="danger" data-suspend="${esc(l.slug)}">השהיה</button>`):''}</td></tr>`}).join("")}</tbody></table></div>`;
  area.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const t=lineTabs.querySelector(`[data-slug="${CSS.escape(b.dataset.go)}"]`);const l=lines.find(x=>x.slug===b.dataset.go);if(l&&t)showLine(l,t)});
  area.querySelectorAll("[data-suspend]").forEach(b=>b.onclick=async()=>{const slug=b.dataset.suspend,c=prompt(`להשהות את הקו "${slug}"?\nמתקשרים ישמעו "הקו מושהה זמנית", והמשימות לא ירוצו. הנתונים וההגדרות נשמרים ואפשר להחזיר.\nלאישור הקלידו את השם הקצר:`);if(!c)return;b.disabled=true;try{await call("suspend",{slug,confirm:c.trim()});await load()}catch(e){alert(e.message);b.disabled=false}});
  area.querySelectorAll("[data-resume]").forEach(b=>b.onclick=async()=>{if(!confirm("להחזיר את הקו לפעולה?"))return;b.disabled=true;try{await call("resume",{slug:b.dataset.resume});await load()}catch(e){alert(e.message);b.disabled=false}});
 }catch(e){area.innerHTML=`<p class="error">לא ניתן לטעון נתונים מכל הקווים: ${esc(e.message)}</p><p class="muted">התחבר מחדש ל-Google ונסה שוב.</p>`}}
function activateTab(button){lineTabs.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b===button)))}
function showLine(line,button){activateTab(button);try{sessionStorage.setItem("portalActiveLine:"+identity.email,line.slug);sessionStorage.setItem("portalActiveView:"+identity.email,"line")}catch{}app.innerHTML=`<div class="line-workspace"><iframe title="ניהול ${esc(line.name)}" src="${esc(handoffUrl(line))}" allow="clipboard-read; clipboard-write"></iframe></div>`}
function showOwner(button){activateTab(button);if(!identity.isOwner){app.innerHTML=`<section class="empty-state"><h2>אין לך גישה למרכז כל הקווים</h2><p>המרכז פתוח רק לבעל השירות. אפשר לעבור לקווים שלך בלשוניות למעלה.</p></section>`;return}try{sessionStorage.removeItem("portalActiveLine:"+identity.email);sessionStorage.setItem("portalActiveView:"+identity.email,"service")}catch{}app.innerHTML=`<div class="owner-area">${ownerPanel(identity)}</div>`;const add=document.querySelector("#addLine");if(add){add.href=handoffUrl({url:"/07/source/"});add.target="_blank";add.rel="noopener"}document.querySelector("#approve")?.addEventListener("click",async()=>{const email=document.querySelector("#email").value.trim().toLowerCase(),selected=[...document.querySelector("#lines").selectedOptions].map(o=>o.value);try{await call("access",{email,approved:true});await call("assign",{email,lines:selected});await load()}catch(e){alert(e.message)}});document.querySelectorAll("[data-block]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await call("access",{email:b.dataset.block,blocked:b.dataset.state==="on"});await load()}catch(e){alert(e.message);b.disabled=false}});document.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{if(!confirm("להסיר את החשבון ואת שיוכי הקווים שלו?"))return;b.disabled=true;try{await call("access",{email:b.dataset.revoke,approved:false});await load()}catch(e){alert(e.message);b.disabled=false}});document.querySelector("#refreshStats")?.addEventListener("click",()=>lineStats(identity.lines||[]));lineStats(identity.lines||[])}
async function logout(){try{await call("logout",{})}catch{}sessionStorage.removeItem("portalToken");sessionStorage.removeItem("portalGoogle");location.reload()}
async function load(){try{
  identity=await call();document.body.classList.remove("logged-out");app.classList.remove("card");
  const dynamicLines=(identity.lines||[]).map(l=>{const L=LEGACY_LINES.find(x=>x.slug===l.slug);return L?{...L,...l,url:L.url,api:L.api,assignable:false}:l}),lines=identity.isOwner?[...LEGACY_LINES.filter(old=>!dynamicLines.some(line=>line.slug===old.slug)),...dynamicLines]:dynamicLines;
  identity.lines=lines;
  profileMenu.innerHTML=accountPanel(identity);profileMenu.querySelector("#profileLogout").addEventListener("click",logout);profileButton.onclick=()=>{const open=profileMenu.classList.toggle("hidden");profileButton.setAttribute("aria-expanded",String(!open))};document.addEventListener("click",e=>{if(!e.target.closest(".profile-area")){profileMenu.classList.add("hidden");profileButton.setAttribute("aria-expanded","false")}});
  lineTabs.innerHTML=lines.map(l=>`<button class="line-tab" type="button" role="tab" aria-selected="false" data-tab="line" data-slug="${esc(l.slug)}"><span>${esc(l.name)}</span><small>${esc(l.line||"")}</small></button>`).join("")+'<button class="line-tab service-tab" type="button" role="tab" aria-selected="false" data-tab="service">כל הקווים</button>';
  lineTabs.querySelectorAll('[data-tab="line"]').forEach(button=>button.addEventListener("click",()=>{const l=lines.find(x=>x.slug===button.dataset.slug);if(l)showLine(l,button)}));
  const serviceButton=lineTabs.querySelector('[data-tab="service"]');if(serviceButton)serviceButton.addEventListener("click",()=>showOwner(serviceButton));
  const saved=sessionStorage.getItem("portalActiveLine:"+identity.email),first=lines.find(l=>l.slug===saved)||lines[0],savedView=sessionStorage.getItem("portalActiveView:"+identity.email);
  if(identity.isOwner&&serviceButton&&savedView==="service")showOwner(serviceButton);else if(first){const b=lineTabs.querySelector(`[data-slug="${CSS.escape(first.slug)}"]`);showLine(first,b)}else if(serviceButton&&identity.isOwner)showOwner(serviceButton);else app.innerHTML='<section class="empty-state"><h2>אין עדיין קווים משויכים</h2><p>פנה לבעלים כדי לקבל גישה לקו.</p></section>';
 }catch(e){token="";sessionStorage.removeItem("portalToken");if(e.message.includes("הגישה לשירות הושעתה")){document.body.classList.add("logged-out");profileMenu.innerHTML="";app.innerHTML=`<p class="error">הגישה לשירות הושעתה. פנה לבעל השירות.</p>`}else login(e.message)}}
if(token)load();else login();
</script>
