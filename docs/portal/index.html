:root{font-family:Heebo,Arial,sans-serif;color:#151923;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}header{min-height:68px;background:#fff;border-bottom:1px solid #e4e7ee;display:flex;align-items:center;justify-content:space-between;padding:12px max(20px,calc((100% - 1100px)/2));gap:14px}h1{font-size:20px;margin:0}main{max-width:1050px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #e4e7ee;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 24px #00000008}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.line{padding:18px;border:1px solid #e4e7ee;border-radius:14px;background:white}.line h3{margin:0 0 8px}.line p{margin:5px 0 14px}.toolbar,.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}button,.btn{border:0;border-radius:10px;background:#3646c9;color:white;padding:10px 16px;font:600 14px Heebo;text-decoration:none;cursor:pointer;display:inline-block}button.secondary,.btn.secondary{background:#edf0ff;color:#2738ad}button.danger{background:#fff0ef;color:#a3261f}button:disabled{opacity:.6;cursor:wait}input,select{font:inherit;padding:10px;border:1px solid #ccd1dc;border-radius:9px;min-width:0}select[multiple]{min-height:130px}.muted{color:#747987}.error{color:#b42318}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:13px;border-radius:12px;background:#f5f6fa}.stat b{display:block;font-size:22px}.client{padding:12px 0;border-bottom:1px solid #eceef3}.client:last-child{border:0}.line-status{font-size:12px;color:#7a3e08;background:#fff4de;padding:3px 8px;border-radius:999px}.hidden{display:none!important}body.logged-out{background:#fff}body.logged-out header{display:none}body.logged-out main{max-width:none;min-height:100vh;margin:0;padding:24px;display:grid;place-items:center}body.logged-out #app{width:min(340px,100%);margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}body.logged-out #gbtn{disp card{padding:22px 24px;margin:0;border-color:#e5e9f2;border-radius:18px;box-shadow:0 7px 20px #18284d0a}.card h2{margin:0 0 8px;font-size:21px}.card p{line-height:1.65}.account-panel{display:flex;align-items:center;justify-content:space-between;gap:20px}.account-panel p{margin:4px 0}.owner-panel{display:grid;gap:16px}.owner-tools{display:flex;align-items:center;justify-content:space-between;gap:20px}.owner-tools p{margin:3px 0;color:#69738a}.client-form{display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1.5fr);gap:14px;align-items:end}.client-form label{display:grid;gap:7px;font-weight:600}.client-form input{width:100%}.stat{border:1px solid #e8ebf2;background:#f8f9fc}.stats{margin-top:12px}.client{padding:16px 0}.client .actions{margin-top:10px}@media(max-width:680px){body:not(.logged-out) main{margin:18px auto;padding:0 14px 32px}body:not(.logged-out) header{padding:10px 14px}.hero{align-items:flex-start;flex-direction:column;padding:24px;border-radius:20px}.hero h2{font-size:25px}.hero .btn{width:100%;text-align:center}.section-head h2{font-size:19px}.grid{grid-template-columns:1fr}.account-panel,.owner-tools{align-items:stretch;flex-direction:column}.client-form{grid-template-columns:1fr}.account-panel button{width:100%}}
.brand{min-width:145px}.brand h1{font-size:17px}.brand small{display:block;color:#8a91a3;font-size:11px;margin-top:2px}.profile-area{position:relative;flex:none}.profile-button{display:inline-flex;align-items:center;gap:9px;background:#fff;color:#25304a;border:1px solid #e2e6ef;padding:9px 13px;border-radius:13px;box-shadow:0 4px 12px #18284d08}.profile-button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.profile-menu{position:absolute;top:calc(100% + 10px);inset-inline-start:0;z-index:20;width:min(310px,calc(100vw - 28px));padding:20px;background:#fff;border:1px solid #e4e7ee;border-radius:17px;box-shadow:0 18px 44px #18284d20}.profile-menu h2{font-size:18px;margin:0 0 6px}.profile-menu p{margin:8px 0}.profile-email{display:block;direction:ltr;text-align:right;overflow-wrap:anywhere}.line-tabs{display:flex;align-items:center;gap:7px;min-width:0;flex:1;overflow-x:auto;padding:3px;scrollbar-width:thin}.line-tab{display:inline-flex;align-items:center;gap:9px;flex:none;border:1px solid transparent;border-radius:12px;background:transparent;color:#6d7588;padding:9px 13px;white-space:nowrap}.line-tab:hover{background:#f6f7fb;color:#202a42}.line-tab[aria-selected=true]{background:#fff;border-color:#e5e8ef;color:#19233b;box-shadow:0 3px 12px #18284d0a}.line-tab small{direction:ltr;color:#9399a8;font-size:11px;font-weight:500}.service-tab{color:#3143b7;background:#eff1ff}.service-tab[aria-selected=true]{background:#3646c9;color:white}.service-tab[aria-selected=true] small{color:#e3e7ff}body:not(.logged-out) main{max-width:none;margin:0;padding:0}.line-workspace{width:100%;min-height:calc(100vh - 74px);background:#f4f6fb}.line-workspace iframe{display:block;width:100%;height:calc(100vh - 74px);border:0;background:#f4f6fb}.owner-area{max-width:1180px;margin:30px auto;padding:0 22px 45px}.owner-panel{display:grid;gap:18px}.empty-state{max-width:680px;margin:14vh auto;text-align:center;padding:42px 26px;background:#fff;border:1px solid #e5e9f2;border-radius:22px;box-shadow:0 12px 30px #18284d0a}.empty-state h2{margin:0 0 8px;font-size:25px}.empty-state p{color:#737d92}.client-form select{width:100%}.client-form select[multiple]{min-height:155px}.client button{font-size:13px}.owner-tools .btn{white-space:nowrap}@media(max-width:760px){body:not(.logged-out) header{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;padding:10px 12px}.profile-area{grid-column:1;grid-row:1}.brand{grid-column:2;grid-row:1;min-width:0;text-align:left}.brand small{display:none}.line-tabs{grid-column:1/-1;grid-row:2;max-width:100%;padding:4px 0}.line-tab{padding:8px 10px;font-size:13px}.line-tab small{font-size:10px}.profile-button{padding:8px 10px}.line-workspace,.line-workspace iframe{min-height:calc(100vh - 115px);height:calc(100vh - 115px)}.owner-area{margin:18px auto;padding:0 14px 30px}.owner-tools{align-items:flex-start;flex-direction:column}.owner-tools .actions{width:100%}.owner-tools .actions>*{flex:1;text-align:center}}
</style>
<body class="logged-out">
<header id="topbar"><div class="profile-area"><button id="profileButton" class="profile-button" aria-expanded="false" aria-label="גישה לפרופיל"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span>הפרופיל שלי</span></button><section id="profileMenu" class="profile-menu hidden"></section></div><nav id="lineTabs" class="line-tabs" aria-label="בחירת קו"></nav><div class="brand"><h1>מרכז הקווים</h1><small>האזור האישי</small></div></header>
<main><div id="app" class="card">טוען…</div></main>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
"use strict";
const API="https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/admin-netfree/portal";
const CONFIG="https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/admin-netfree/config";
const LINES_API="https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/admin-netfree-lines/";
const app=document.querySelector("#app"),lineTabs=document.querySelector("#lineTabs"),profileButton=document.querySelector("#profileButton"),profileMenu=document.querySelector("#profileMenu");
let token=sessionStorage.getItem("portalToken")||"",identity=null,googleCredential=sessionStorage.getItem("portalGoogle")||"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function request(url,body){const r=await fetch(url,{method:body?"POST":"GET",headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});const d=await r.json().catch(()=>({error:"תשובה לא תקינה מהשרת"}));if(!r.ok)throw Error(d.error||"שגיאה "+r.status);return d}
async function call(action="me",body){return request(API+"?action="+encodeURIComponent(action)+"&token="+encodeURIComponent(token),body)}
function login(message="כניסה למערכת ניהול הקווים"){
  document.body.classList.add("logged-out");
  app.innerHTML="<div id=\"gbtn\"></div><p id=\"loginError\" class=\"error\">"+(message!=="כניסה למערכת ניהול הקווים"?esc(message):"")+"</p>";
  request(CONFIG).then(config=>{
    if(!config.google)throw Error("כניסה בגוגל עדיין לא הוגדרה בשרת.");
    const timer=setInterval(()=>{if(!window.google?.accounts?.id)return;clearInterval(timer);
      google.accounts.id.initialize({client_id:config.google,callback:async credential=>{
        try{const result=await request(API+"?action=login",{google:credential.credential});token=result.token;googleCredential=credential.credential;sessionStorage.setItem("portalToken",token);sessionStorage.setItem("portalGoogle",googleCredential);await load()}
        catch(e){document.querySelector("#loginError").textContent=e.message}
      }});
      google.accounts.id.renderButton(document.querySelector("#gbtn"),{theme:"outline",size:"large",locale:"he",text:"signin_with"});
    },100);
    setTimeout(()=>clearInterval(timer),15000);
  }).catch(e=>{const p=document.querySelector("#loginError");if(p)p.textContent=e.message});
}
function handoffUrl(line){const u=new URL(line.url,location.href);u.hash="g="+encodeURIComponent(googleCredential);return u.href}
function enterLine(line){location.href=handoffUrl(line)}
function renderLine(line){return `<article class="line"><span class="line-kicker">הקו שלי</span><h3>${esc(line.name)}</h3><p class="muted">מספר קו: ${esc(line.line||"לא הוגדר")}</p>${line.enabled===false?'<span class="line-status">הקו מושהה</span>':''}<div class="actions"><button data-enter="${esc(line.slug)}">ניהול הקו והמנהלים</button></div></article>`}
function accountPanel(data){return `<h2>הפרופיל והחשבון</h2><p>מחובר באמצעות Google</p><b class="profile-email" dir="ltr">${esc(data.email)}</b><p class="muted">${data.isOwner?'לבעלים יש גישה לכל הקווים במערכת.':`יש לך גישה ל־${(data.lines||[]).length} קווים.`}</p><button class="secondary" id="profileLogout">יציאה מהחשבון</button>`}
function renderClients(clients,lines){return `<section class="card"><h2>גישה למשתמשים</h2><p class="muted">בחר חשבון Google והקווים שהוא יראה באזור האישי שלו.</p><div class="client-form"><label>חשבון Google<input id="email" type="email" autocomplete="email" placeholder="name@gmail.com"></label><label>קווים לשיוך<select id="lines" multiple>${lines.map(l=>`<option value="${esc(l.slug)}">${esc(l.name)} · ${esc(l.line)}</option>`).join("")}</select></label></div><p class="muted">לניהול מנהלים בכל קו, היכנס לכרטיס הקו המתאים.</p><button id="approve">שמירת גישה לקווים</button><h3>חשבונות עם גישה</h3>${clients.length?clients.map(c=>`<div class="client"><b dir="ltr">${esc(c.email)}</b> · ${(c.lines||[]).length} קווים ${c.blocked?'<span class="line-status">גישה מושהית</span>':''}<div class="actions"><button class="secondary" data-block="${esc(c.email)}" data-state="${c.blocked?'off':'on'}">${c.blocked?'החזר גישה':'השהה גישה'}</button><button class="danger" data-revoke="${esc(c.email)}">הסר גישה</button></div></div>`).join(""):'<p class="muted">אין עדיין חשבונות נוספים.</p>'}</section>`}
function ownerPanel(data){return `<section class="owner-panel"><section class="card"><div class="owner-tools"><div><h2>ניהול השירות</h2><p>כאן נמצאים כל הקווים במערכת. מתוך ניהול כל קו אפשר להוסיף מנהלים והרשאות.</p></div><div class="actions"><a class="btn" id="addLine" href="/07/source/">הוספת קו</a><button class="secondary" id="refreshStats">רענון נתונים</button></div></div><div id="aggregate" class="stats"><div class="stat">טוען נתונים…</div></div></section>${renderClients(data.clients||[],data.lines||[])}</section>`}
async function lineStats(lines){const area=document.querySelector("#aggregate");if(!area)return;try{
  if(!googleCredential)throw Error("יש להתחבר מחדש ל-Google כדי לרענן נתוני קווים.");
  const settled=await Promise.allSettled(lines.filter(l=>l.enabled!==false).map(async line=>{
    const base=LINES_API+encodeURIComponent(line.slug)+"/";
    const session=await request(base+"session",{google:googleCredential});
    const summary=await request(base+"overview?token="+encodeURIComponent(session.token));
    return {line,summary};
  }));
  const results=settled.filter(x=>x.status==="fulfilled").map(x=>x.value),failed=settled.length-results.length;
  const online=results.reduce((n,x)=>n+(x.summary.online||[]).length,0),pending=results.reduce((n,x)=>n+(x.summary.pending||[]).reduce((a,p)=>a+(+p.n||0),0)+(+x.summary.joins||0),0),members=results.reduce((n,x)=>n+(+x.summary.members?.active||0),0);
  area.innerHTML=`<div class="stat"><b>${online}</b>מתקשרים כעת</div><div class="stat"><b>${pending}</b>הודעות ובקשות ממתינות</div><div class="stat"><b>${members}</b>חברים פעילים</div><div class="stat"><b>${results.length}/${settled.length}</b>קווים שנענו</div>`+(results.map(x=>`<div class="stat"><b>${(x.summary.online||[]).length}</b>${esc(x.line.name)} · מתקשרים כעת</div>`).join(""))+(failed?`<p class="error">${failed} קווים לא החזירו נתונים. בדוק שהקו פעיל ושהחשבון מורשה בו.</p>`:'');
 }catch(e){area.innerHTML=`<p class="error">לא ניתן לטעון נתונים מכל הקווים: ${esc(e.message)}</p><p class="muted">התחבר מחדש ל-Google ונסה שוב.</p>`}}
function activateTab(button){lineTabs.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b===button)))}
function showLine(line,button){activateTab(button);try{sessionStorage.setItem("portalActiveLine:"+identity.email,line.slug);sessionStorage.setItem("portalActiveView:"+identity.email,"line")}catch{}app.innerHTML=`<div class="line-workspace"><iframe title="ניהול ${esc(line.name)}" src="${esc(handoffUrl(line))}" allow="clipboard-read; clipboard-write"></iframe></div>`}
function showOwner(button){activateTab(button);try{sessionStorage.removeItem("portalActiveLine:"+identity.email);sessionStorage.setItem("portalActiveView:"+identity.email,"service")}catch{}app.innerHTML=`<div class="owner-area">${ownerPanel(identity)}</div>`;const add=document.querySelector("#addLine");if(add){add.href=handoffUrl({url:"/07/source/"});add.target="_blank";add.rel="noopener"}document.querySelector("#approve")?.addEventListener("click",async()=>{const email=document.querySelector("#email").value.trim().toLowerCase(),selected=[...document.querySelector("#lines").selectedOptions].map(o=>o.value);try{await call("access",{email,approved:true});await call("assign",{email,lines:selected});await load()}catch(e){alert(e.message)}});document.querySelectorAll("[data-block]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await call("access",{email:b.dataset.block,blocked:b.dataset.state==="on"});await load()}catch(e){alert(e.message);b.disabled=false}});document.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{if(!confirm("להסיר את החשבון ואת שיוכי הקווים שלו?"))return;b.disabled=true;try{await call("access",{email:b.dataset.revoke,approved:false});await load()}catch(e){alert(e.message);b.disabled=false}});document.querySelector("#refreshStats")?.addEventListener("click",()=>lineStats(identity.lines||[]));lineStats(identity.lines||[])}
async function logout(){try{await call("logout",{})}catch{}sessionStorage.removeItem("portalToken");sessionStorage.removeItem("portalGoogle");location.reload()}
async function load(){try{
  identity=await call();document.body.classList.remove("logged-out");app.classList.remove("card");
  const lines=identity.lines||[];
  profileMenu.innerHTML=accountPanel(identity);profileMenu.querySelector("#profileLogout").addEventListener("click",logout);profileButton.onclick=()=>{const open=profileMenu.classList.toggle("hidden");profileButton.setAttribute("aria-expanded",String(!open))};document.addEventListener("click",e=>{if(!e.target.closest(".profile-area")){profileMenu.classList.add("hidden");profileButton.setAttribute("aria-expanded","false")}});
  lineTabs.innerHTML=lines.map(l=>`<button class="line-tab" type="button" role="tab" aria-selected="false" data-tab="line" data-slug="${esc(l.slug)}"><span>${esc(l.name)}</span><small>${esc(l.line||"")}</small></button>`).join("")+(identity.isOwner?'<button class="line-tab service-tab" type="button" role="tab" aria-selected="false" data-tab="service">ניהול השירות</button>':'');
  lineTabs.querySelectorAll('[data-tab="line"]').forEach(button=>button.addEventListener("click",()=>{const l=lines.find(x=>x.slug===button.dataset.slug);if(l)showLine(l,button)}));
  const serviceButton=lineTabs.querySelector('[data-tab="service"]');if(serviceButton)serviceButton.addEventListener("click",()=>showOwner(serviceButton));
  const saved=sessionStorage.getItem("portalActiveLine:"+identity.email),first=lines.find(l=>l.slug===saved)||lines[0],savedView=sessionStorage.getItem("portalActiveView:"+identity.email);
  if(identity.isOwner&&serviceButton&&savedView==="service")showOwner(serviceButton);else if(first){const b=lineTabs.querySelector(`[data-slug="${CSS.escape(first.slug)}"]`);showLine(first,b)}else if(serviceButton)showOwner(serviceButton);else app.innerHTML='<section class="empty-state"><h2>אין עדיין קווים משויכים</h2><p>פנה לבעלים כדי לקבל גישה לקו.</p></section>';
 }catch(e){token="";sessionStorage.removeItem("portalToken");if(e.message.includes("הגישה לשירות הושעתה")){document.body.classList.add("logged-out");profileMenu.innerHTML="";app.innerHTML=`<p class="error">הגישה לשירות הושעתה. פנה לבעל השירות.</p>`}else login(e.message)}}
if(token)load();else login();
</script>
</html>
