<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>מרכז הקווים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* אותם צבעים, גופן ופינות כמו בדף הניהול של כל קו – כדי שהכול ייראה כמערכת אחת */
:root{color-scheme:light;
--bg:#f3f5f9;--bg2:#e9edf4;--card:#fff;--ink:#101828;--ink2:#475467;--mut:#7d8598;--line:#e4e7ee;
--acc:#2f5fd1;--acc2:#1e46a8;--accbg:#e8eefc;--good:#15803d;--goodbg:#e7f7ed;--warn:#92400e;--warnbg:#fff4de;--bad:#dc2626;--badbg:#fdeaea;
--ring:rgba(47,95,209,.18);--sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--sh2:0 16px 40px rgba(16,24,40,.16);
--r:16px;--r2:12px;--side:268px}
:root[data-theme=dark]{color-scheme:dark;--bg:#0e1117;--bg2:#161b24;--card:#171c26;--ink:#f2f4f8;--ink2:#b6bdcc;--mut:#7f889b;--line:#262d3a;
--acc:#5b8def;--acc2:#8fb3f6;--accbg:#172443;--good:#4ade80;--goodbg:#132a1c;--warn:#fbbf24;--warnbg:#2f2410;--bad:#f06565;--badbg:#3a1a1a;
--ring:rgba(91,141,239,.28);--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 16px 40px rgba(0,0,0,.55)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0e1117;--bg2:#161b24;--card:#171c26;--ink:#f2f4f8;--ink2:#b6bdcc;--mut:#7f889b;--line:#262d3a;
--acc:#5b8def;--acc2:#8fb3f6;--accbg:#172443;--good:#4ade80;--goodbg:#132a1c;--warn:#fbbf24;--warnbg:#2f2410;--bad:#f06565;--badbg:#3a1a1a;
--ring:rgba(91,141,239,.28);--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 16px 40px rgba(0,0,0,.55)}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}a{color:var(--acc)}
.hidden{display:none!important}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- כפתורים, שדות, תגיות ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:11px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;text-decoration:none;white-space:nowrap;transition:background .15s,box-shadow .15s}
.btn:hover{background:var(--acc2)}.btn:focus-visible,.field:focus-visible,.nav a:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ring)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}.btn.ghost:hover{background:var(--bg2)}
.btn.soft{background:var(--accbg);color:var(--acc)}.btn.soft:hover{filter:brightness(.97)}
.btn.danger{background:var(--badbg);color:var(--bad)}.btn.danger:hover{filter:brightness(.96)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}.btn:disabled{opacity:.55;cursor:default}
.field{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;transition:box-shadow .15s,border-color .15s}
.field:focus{border-color:var(--acc)}label.lbl{display:grid;gap:6px;font-weight:600;font-size:14px}label.lbl small{font-weight:400;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--goodbg);color:var(--good)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.acc{background:var(--accbg);color:var(--acc)}
.mut{color:var(--mut)}.small{font-size:13px}.ltr{direction:ltr;unicode-bidi:isolate}.num{font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-weight:600}

/* ---- מבנה: סרגל צד + אזור עבודה ---- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--card);border-inline-end:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 14px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#5b8def,var(--acc) 55%,#1e3a8a);box-shadow:0 6px 16px rgba(47,95,209,.35)}
.logo svg{width:21px;height:21px}.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.3px}.brand small{display:block;color:var(--mut);font-size:12px}
.picker{margin:4px 14px 10px;position:relative}
.picker-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:13px;cursor:pointer;text-align:start}
.picker-btn:hover{border-color:var(--acc)}.picker-btn .dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}.picker-btn .dot.off{background:var(--mut)}
.picker-btn span{flex:1;min-width:0}.picker-btn b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.picker-btn small{display:block;color:var(--mut);font-size:12px}
.pop{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);padding:8px;z-index:40}
.pop .field{margin-bottom:6px}.pop-list{max-height:320px;overflow:auto;display:grid;gap:2px}
.pop-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:start}
.pop-item:hover,.pop-item.on{background:var(--accbg)}.pop-item span{flex:1}.pop-item small{color:var(--mut);font-size:12px}
.pop-sep{height:1px;background:var(--line);margin:6px 4px}
.nav{padding:4px 12px;display:grid;gap:2px}.nav-h{font-size:11.5px;font-weight:700;color:var(--mut);padding:12px 10px 4px;letter-spacing:.3px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;color:var(--ink2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--bg2);color:var(--ink)}.nav a.on{background:var(--accbg);color:var(--acc);font-weight:700}
.ndot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;margin-inline:5px}.ndot.off{background:var(--mut)}
.nav a .cnt{margin-inline-start:auto;font-size:12px;color:var(--mut)}
.side-scroll{flex:1;overflow-y:auto;padding-bottom:10px}
.me{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accbg);color:var(--acc);font-weight:800;flex:none}
.me div{flex:1;min-width:0}.me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;color:var(--ink2);display:grid;place-items:center}.icon-btn:hover{background:var(--bg2);color:var(--ink)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px;margin:0;font-weight:800;white-space:nowrap}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline-start:auto;padding:2px}.quick::-webkit-scrollbar{display:none}
.qtab{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap;font-size:13.5px;font-weight:600;color:var(--ink2)}
.qtab:hover{border-color:var(--acc);color:var(--ink)}.qtab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.qtab i{width:7px;height:7px;border-radius:50%;background:var(--good)}.qtab i.off{background:var(--mut)}.qtab.on i{background:#fff}
.burger{display:none}
.content{padding:24px;max-width:1240px;width:100%;margin:0 auto;flex:1}
.content.full{max-width:none;padding:0;display:flex;flex-direction:column}

/* ---- כרטיסים, מדדים, טבלאות ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card+.card,.grid+.card,.card+.grid{margin-top:16px}
.card h2{margin:0 0 4px;font-size:17px}.card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}.card-head>div{flex:1;min-width:200px}.card-head p{margin:0;color:var(--mut);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.kpi span{color:var(--mut);font-size:13px}
.kpi.skel b{width:50px;height:28px;border-radius:8px;background:var(--bg2);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2)}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
.t th{text-align:start;font-weight:600;color:var(--mut);font-size:12.5px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.t tr:last-child td{border-bottom:0}.t tbody tr:hover{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.t td b{display:block}.t td small{display:block;color:var(--mut);font-size:12px}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.t .acts{flex-wrap:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 6px 3px 10px;border-radius:99px;background:var(--accbg);color:var(--acc);font-size:12.5px;font-weight:600}
.chip button{border:0;background:none;color:inherit;cursor:pointer;padding:0 3px;border-radius:50%;line-height:1;font-size:15px}.chip button:hover{background:rgba(0,0,0,.08)}
.chip-add{border:1px dashed var(--line);background:none;border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--mut);cursor:pointer}
.empty{text-align:center;padding:48px 20px;color:var(--mut)}.empty h2{color:var(--ink);margin:0 0 6px;font-size:19px}
.empty .big{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0 auto 14px;background:var(--accbg);color:var(--acc)}.empty .big svg{width:26px;height:26px}
.lines-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,transform .15s}
.lc:hover{border-color:var(--acc);transform:translateY(-1px)}.lc-h{display:flex;align-items:center;gap:10px}.lc-h b{flex:1;font-size:16px}
.lc-m{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.lc-m div{background:var(--bg);border-radius:10px;padding:8px 4px}.lc-m b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.lc-m span{font-size:11.5px;color:var(--mut)}

/* ---- אשף קו חדש ---- */
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}.steps span{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:var(--bg2);color:var(--mut);font-size:13px;font-weight:600}
.steps span.on{background:var(--acc);color:#fff}.steps span.ok{background:var(--goodbg);color:var(--good)}
.form{display:grid;gap:14px;max-width:640px}.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;background:var(--bg);border-radius:12px;padding:12px 14px}.kv b{color:var(--mut);font-weight:600}
.secret{display:flex;gap:8px;align-items:center;background:var(--warnbg);border-radius:12px;padding:12px 14px}.secret code{flex:1;font-size:16px;font-weight:700;direction:ltr;text-align:start}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warnbg);color:var(--warn);font-size:14px;margin-bottom:14px}.banner.info{background:var(--accbg);color:var(--acc)}
pre.ini{margin:0;max-width:340px;max-height:140px;overflow:auto;font-size:12px;background:var(--bg);border-radius:8px;padding:6px 8px;direction:ltr;text-align:left;white-space:pre-wrap}

/* ---- קו בתוך המרכז ---- */
.frame-bar{display:flex;align-items:center;gap:10px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--card)}
.frame-bar b{font-size:15px}.frame-bar .sp{flex:1}
.frame{flex:1;width:100%;border:0;min-height:calc(100vh - 120px);background:var(--bg)}

/* ---- חלון קופץ, הודעה קצרה ---- */
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;z-index:60;padding:16px}
.modal .card{width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:var(--sh2)}
.checks{display:grid;gap:6px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.checks label{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer}.checks label:hover{background:var(--bg)}
#toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:70;box-shadow:var(--sh2)}
#toast.bad{background:var(--bad);color:#fff}

/* ---- מסך כניסה ---- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,var(--card) 0%,var(--bg) 60%)}
.login-box{width:min(400px,100%);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 28px;box-shadow:var(--sh2)}
.login-box .logo{width:56px;height:56px;border-radius:16px;margin:0 auto 14px}.login-box .logo svg{width:28px;height:28px}
.login-box h1{margin:0 0 6px;font-size:23px}.login-box p{margin:0 0 22px;color:var(--mut)}#gbtn{display:flex;justify-content:center;min-height:44px}

/* ---- נייד ---- */
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:min(300px,86vw);transform:translateX(100%);transition:transform .22s;box-shadow:var(--sh2)}
  :root[dir=rtl] .side{transform:translateX(100%)}.shell.open .side{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:25}
  .burger{display:grid}.topbar{padding:10px 14px}.content{padding:16px}.frame-bar{padding:10px 14px}
  .fgrid{grid-template-columns:1fr}.quick{max-width:60vw}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="hidden"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
"use strict";
// ===== כתובות =====
const SB="https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/";
const API=SB+"admin-netfree/portal",CONFIG=SB+"admin-netfree/config",LINES_API=SB+"admin-netfree-lines/";
const LEGACY_LINES=[
  {slug:"shimchas",name:"שימחס",line:"073-351-2880",url:"/07/source/",api:SB+"admin-netfree/",enabled:true,legacy:true},
  {slug:"daat",name:"דעת תורה",line:"079-494-7582",url:"/07/daattorah/",api:SB+"admin-netfree-daat/",enabled:true,legacy:true}
];
const SOURCE=LEGACY_LINES[0]; // מפעל הקווים רץ בקו המקור

// ===== מצב =====
const S={token:"",google:"",me:null,lines:[],view:"",slug:"",data:null,dataAt:0,fx:{token:"",check:null,created:null,plan:null,status:null},pickerOpen:false};
try{S.token=sessionStorage.getItem("portalToken")||"";S.google=sessionStorage.getItem("portalGoogle")||""}catch{}
const $=s=>document.querySelector(s),root=$("#root");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const I={
  logo:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',lines:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 14h3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  chev:'<path d="M7 10l5 5 5-5"/>',out:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>'
};
const ico=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]||""}</svg>`;
function toast(m,bad){const t=$("#toast");t.textContent=m;t.className=bad?"bad":"";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="hidden",3600)}
try{const th=localStorage.getItem("portalTheme");if(th)document.documentElement.dataset.theme=th}catch{}

// ===== תקשורת =====
async function request(url,body){const r=await fetch(url,{method:body?"POST":"GET",headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});const d=await r.json().catch(()=>({error:"תשובה לא תקינה מהשרת"}));if(!r.ok)throw Error(d.error||"שגיאה "+r.status);return d}
const call=(action="me",body)=>request(API+"?action="+encodeURIComponent(action)+"&token="+encodeURIComponent(S.token),body);
const googleExp=()=>{try{return JSON.parse(atob(S.google.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).exp*1000}catch{return 0}};
const googleOk=()=>!!S.google&&googleExp()>Date.now()+30000;
const baseOf=l=>l.api||LINES_API+encodeURIComponent(l.slug)+"/";
const lineSessions={};
async function lineToken(l){const b=baseOf(l);if(lineSessions[b])return lineSessions[b];if(!googleOk())throw Error("החיבור לגוגל פג – יש לרענן אותו");return lineSessions[b]=(await request(b+"session",{google:S.google})).token}
async function lineApi(l,name,body){const t=await lineToken(l);return request(baseOf(l)+name+(name.includes("?")?"&":"?")+"token="+encodeURIComponent(t),body)}
const handoffUrl=l=>{const u=new URL(l.url||"/07/line/?l="+encodeURIComponent(l.slug),location.href);if(S.google)u.hash="g="+encodeURIComponent(S.google);return u.href};
const isFactory=l=>!l.legacy&&!LEGACY_LINES.some(x=>x.slug===l.slug);

// ===== כניסה בגוגל =====
function renderGoogle(el,onCred){request(CONFIG).then(cfg=>{if(!cfg.google)throw Error("כניסה בגוגל עדיין לא הוגדרה בשרת.");
  const tm=setInterval(()=>{if(!window.google?.accounts?.id)return;clearInterval(tm);
    google.accounts.id.initialize({client_id:cfg.google,callback:r=>onCred(r.credential)});
    google.accounts.id.renderButton(el,{theme:"outline",size:"large",locale:"he",text:"signin_with",shape:"pill",width:Math.min(300,Math.max(220,innerWidth-80))})},100);
  setTimeout(()=>clearInterval(tm),15000)}).catch(e=>toast(e.message,true))}
function showLogin(msg=""){
  root.innerHTML=`<div class="login"><div class="login-box"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I.logo}</svg></div>
  <h1>מרכז הקווים</h1><p>כניסה עם חשבון הגוגל שלך. רואים רק את הקווים שיש לך גישה אליהם.</p><div id="gbtn"></div><p class="err" id="lerr" style="margin:14px 0 0">${esc(msg)}</p></div></div>`;
  renderGoogle($("#gbtn"),async cred=>{try{const r=await request(API+"?action=login",{google:cred});S.token=r.token;setGoogle(cred);try{sessionStorage.setItem("portalToken",S.token)}catch{}await load()}catch(e){$("#lerr").textContent=e.message}});
}
function setGoogle(c){S.google=c;for(const k in lineSessions)delete lineSessions[k];try{sessionStorage.setItem("portalGoogle",c)}catch{}}
function refreshGoogle(){modal(`<h2>חידוש החיבור לגוגל</h2><p class="mut">החיבור לגוגל תקף לשעה. כדי להמשיך לעבוד עם הקווים, יש להתחבר שוב.</p><div id="gbtn2" style="display:flex;justify-content:center;margin-top:12px"></div>`);
  renderGoogle($("#gbtn2"),cred=>{setGoogle(cred);closeModal();toast("החיבור חודש");route()})}
async function logout(){try{await call("logout",{})}catch{}try{sessionStorage.removeItem("portalToken");sessionStorage.removeItem("portalGoogle")}catch{}location.hash="";location.reload()}

// ===== טעינה =====
async function load(){
  try{S.me=await call()}catch(e){S.token="";try{sessionStorage.removeItem("portalToken")}catch{}return showLogin(/נדרשת כניסה|החיבור פג/.test(e.message)?"":e.message)}
  const dyn=(S.me.lines||[]).map(l=>{const L=LEGACY_LINES.find(x=>x.slug===l.slug);return L?{...L,...l,url:L.url,api:L.api,legacy:true}:l});
  S.lines=S.me.isOwner?[...LEGACY_LINES.filter(o=>!dyn.some(l=>l.slug===o.slug)),...dyn]:dyn;
  shell();
  if(!location.hash){let last="";try{last=sessionStorage.getItem("portalView:"+S.me.email)||""}catch{}
    location.replace("#"+(last||(S.me.isOwner?"overview":S.lines[0]?"line="+S.lines[0].slug:"all")))}
  route();
}

function toggleSide(open){const sh=$("#shell");sh.classList.toggle("open",open);let sc=$(".scrim");if(open&&!sc){sc=document.createElement("div");sc.className="scrim";sc.onclick=()=>toggleSide(false);sh.append(sc)}else if(!open&&sc)sc.remove()}
function togglePicker(open=!S.pickerOpen){S.pickerOpen=open;const p=$("#pop");if(!p)return;p.classList.toggle("hidden",!open);if(!open)return;
  p.innerHTML=`<input class="field" id="pickQ" placeholder="חיפוש קו…" autocomplete="off"><div class="pop-list" id="pickL"></div>`;
  const draw=q=>{q=q.trim();const L=S.lines.filter(l=>!q||l.name.includes(q)||String(l.line||"").replace(/\D/g,"").includes(q.replace(/\D/g,"")||"\u0000"));
    $("#pickL").innerHTML=L.map(l=>`<button class="pop-item${S.slug===l.slug?" on":""}" data-slug="${esc(l.slug)}"><i class="ndot${l.enabled===false?" off":""}"></i><span>${esc(l.name)}</span><small class="ltr">${esc(l.line||"")}</small></button>`).join("")+(L.length?"":'<p class="mut small" style="padding:6px 10px">לא נמצא</p>')+
    `<div class="pop-sep"></div><button class="pop-item" data-all="1">${ico("grid")}<span>כל הקווים</span></button>`};
  draw("");$("#pickQ").oninput=e=>draw(e.target.value);$("#pickQ").focus();
  $("#pickL").onclick=e=>{const b=e.target.closest(".pop-item");if(!b)return;togglePicker(false);toggleSide(false);location.hash=b.dataset.all?"all":"line="+b.dataset.slug};
}

// ===== ניתוב =====
addEventListener("hashchange",()=>S.me&&route());
function route(){
  const h=decodeURIComponent(location.hash.slice(1)),[v,arg]=h.split("=");
  S.view=v||"overview";S.slug=v==="line"?arg:"";
  try{sessionStorage.setItem("portalView:"+S.me.email,h)}catch{}
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===S.view&&(S.view!=="line"||a.dataset.slug===S.slug)));
  document.querySelectorAll(".qtab").forEach(b=>b.classList.toggle("on",b.dataset.slug===S.slug));
  const cur=S.lines.find(l=>l.slug===S.slug);
  $("#pickName").textContent=cur?cur.name:S.view==="all"?"כל הקווים":"בחירת קו";$("#pickSub").textContent=cur?cur.line||"":S.lines.length+" קווים";$("#pickDot").className="dot"+(cur&&cur.enabled===false?" off":"");
  const V=$("#view");V.className="content";
  const owner=S.me.isOwner,need=["new","accounts"];
  if(!owner&&(need.includes(S.view)||S.view==="all"))return noAccess(V);
  const T={overview:"סקירה",lines:"קווים",new:"קו חדש",accounts:"חשבונות",all:"כל הקווים"};
  $("#title").textContent=cur?cur.name:T[S.view]||"";
  if(S.view==="line"){if(!cur)return V.innerHTML=empty("lines","הקו לא נמצא","אין לך גישה לקו הזה, או שהוא הוסר.");return lineView(V,cur)}
  if(S.view==="new")return newLineView(V);
  if(S.view==="accounts")return accountsView(V);
  if(S.view==="lines")return linesView(V);
  if(S.view==="all")return overviewView(V,true);
  return overviewView(V);
}
const empty=(ic,h,p,act="")=>`<div class="card empty"><div class="big">${ico(ic)}</div><h2>${esc(h)}</h2><p>${esc(p)}</p>${act}</div>`;
function noAccess(V){$("#title").textContent="כל הקווים";V.innerHTML=empty("lock","אין לך גישה למרכז כל הקווים","המרכז פתוח רק לבעל השירות. אפשר לעבור לקווים שלך מהרשימה בצד או מהלשוניות למעלה.",S.lines[0]?`<a class="btn" href="#line=${encodeURIComponent(S.lines[0].slug)}" style="margin-top:14px">מעבר ל${esc(S.lines[0].name)}</a>`:"")}

// ===== נתונים מכל הקווים =====
const sum7=a=>Array.isArray(a)?a.slice(-7).reduce((n,x)=>n+(+x||0),0):null;
const pendOf=ov=>(ov.pending||[]).reduce((a,p)=>a+(+p.n||0),0)+(+ov.joins||0);
function healthOf(h,l){if(l.enabled===false)return["","מושהה"];if(!h)return["warn","לא ידוע"];const p=[];
  if(h.cronAgo!=null&&h.cronAgo>300)p.push("המשימות לא רצו "+Math.round(h.cronAgo/60)+" דק׳");if((h.errors||[]).length)p.push(h.errors.length+" שגיאות");if((h.bg||[]).length>5)p.push("תור רקע "+h.bg.length);
  return p.length?["warn",p.join(" · ")]:["ok","תקין"+(h.testMode?" · בדיקה":"")]}
async function fetchAll(force){
  if(!force&&S.data&&Date.now()-S.dataAt<60000)return S.data;
  if(!googleOk())throw Error("google");
  const rows=await Promise.all(S.lines.map(async l=>{if(l.enabled===false)return{l,off:true};
    try{const [ov,he,st]=await Promise.allSettled([lineApi(l,"overview"),lineApi(l,"health"),lineApi(l,"stats")]);
      if(ov.status!=="fulfilled")throw ov.reason;return{l,ov:ov.value,he:he.status==="fulfilled"?he.value:null,st:st.status==="fulfilled"?st.value:null}}
    catch(e){return{l,err:String(e.message||"לא ענה")}}}));
  S.data=rows;S.dataAt=Date.now();return rows;
}
function kpis(rows){const ok=rows.filter(r=>r.ov),tot=f=>ok.reduce((n,r)=>n+(f(r)||0),0);
  return `<div class="kpis"><div class="kpi"><b>${tot(r=>(r.ov.online||[]).length)}</b><span>מחוברים עכשיו</span></div><div class="kpi"><b>${tot(r=>pendOf(r.ov))}</b><span>ממתינות לאישור</span></div><div class="kpi"><b>${tot(r=>+r.ov.members?.active)}</b><span>חברים פעילים</span></div><div class="kpi"><b>${tot(r=>sum7(r.st?.calls))}</b><span>שיחות השבוע</span></div><div class="kpi"><b>${tot(r=>sum7(r.st?.msgs))}</b><span>הודעות השבוע</span></div><div class="kpi"><b>${ok.length}/${rows.length}</b><span>קווים שענו</span></div></div>`}
const skel=()=>`<div class="kpis">${"<div class='kpi skel'><b></b><span>טוען…</span></div>".repeat(6)}</div>`;
const googleBanner=()=>`<div class="banner info">${ico("refresh")}<div style="flex:1">כדי לראות נתונים מהקווים צריך לחדש את החיבור לגוגל (הוא תקף לשעה).</div><button class="btn sm" id="reG">חידוש</button></div>`;
async function overviewView(V,allMode){
  const own=S.me.isOwner;
  V.innerHTML=`<div class="card-head"><div><h2 style="margin:0;font-size:21px">${own?"שלום, בעל השירות":"שלום"}</h2><p>${own?"תמונת מצב של כל הקווים במערכת.":"הקווים שיש לך גישה אליהם."}</p></div>
   <button class="btn ghost" id="rf">${ico("refresh")}רענון</button>${own?`<a class="btn" href="#new">${ico("plus")}קו חדש</a>`:""}</div><div id="ovBody">${skel()}</div>`;
  $("#rf").onclick=()=>overviewDraw(true);overviewDraw(false);
}
async function overviewDraw(force){const B=$("#ovBody");if(!B)return;
  if(!S.lines.length){B.innerHTML=empty("lines","אין עדיין קווים",S.me.isOwner?"אפשר לבנות קו ראשון במפעל הקווים.":"פנה לבעל השירות כדי לקבל גישה לקו.",S.me.isOwner?'<a class="btn" href="#new" style="margin-top:14px">בניית קו</a>':"");return}
  if(force)B.innerHTML=skel();

function cards(rows){return `<div class="lines-cards">${rows.map(r=>{const l=r.l,[hc,ht]=r.err?["warn","לא ענה"]:r.ov||r.off?healthOf(r.he,l):["","—"];

// ===== חשבונות =====
async function syncLegacyManagers(email,slugs){
  for(const line of LEGACY_LINES){
    const data=await lineApi(line,"emails"),present=(data.managers||[]).some(m=>(typeof m==="string"?m:m.e)===email),wanted=slugs.includes(line.slug);
    if(present!==wanted)await lineApi(line,"emails",{email,op:wanted?"add":"remove",role:"admin"});
  }
}
const lineName=s=>(S.lines.find(l=>l.slug===s)||{name:s}).name;
async function saveAccess(email,slugs){if(!googleOk()){refreshGoogle();throw Error("יש לחדש את החיבור לגוגל ולנסות שוב")}
  await call("access",{email,approved:true});await syncLegacyManagers(email,slugs);await call("assign",{email,lines:slugs})}

    return `<tr data-email="${esc(c.email)}"><td><b class="ltr">${esc(c.email)}</b></td><td><div class="chips">${(c.lines||[]).map(s=>`<span class="chip">${esc(lineName(s))}<button data-rm="${esc(s)}" title="הסרה מהקו" aria-label="הסרה מהקו">×</button></span>`).join("")||'<span class="mut small">אין קווים</span>'}
     ${free.length?`<select class="chip-add" data-add aria-label="הוספת קו"><option value="">+ הוספת קו</option>${free.map(l=>`<option value="${esc(l.slug)}">${esc(l.name)}</option>`).join("")}</select>`:""}</div></td>
     <td>${c.blocked?'<span class="pill bad">מושהה</span>':'<span class="pill ok">פעיל</span>'}</td><td><div class="acts"><button class="btn sm ghost" data-block="${c.blocked?"off":"on"}">${c.blocked?"החזרת גישה":"השהיית גישה"}</button><button class="btn sm danger" data-revoke>הסרה</button></div></td></tr>`}).join("")}</tbody></table></div>`
    :empty("users","אין עדיין חשבונות","הוסף חשבון גוגל ובחר אילו קווים הוא יראה.")}</div>`;
  $("#newAcc").onclick=()=>accountModal();
  const busy=async(el,fn)=>{el.disabled=true;try{await fn();toast("נשמר");await load()}catch(e){toast(e.message,true);el.disabled=false}};
  V.querySelectorAll("tr[data-email]").forEach(tr=>{const email=tr.dataset.email,c=cl.find(x=>x.email===email),cur=c.lines||[];
    tr.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{if(confirm(`להסיר את ${email} מהקו "${lineName(b.dataset.rm)}"?`))busy(b,()=>saveAccess(email,cur.filter(s=>s!==b.dataset.rm)))});
    const add=tr.querySelector("[data-add]");if(add)add.onchange=()=>{if(add.value)busy(add,()=>saveAccess(email,[...cur,add.value]))};
    tr.querySelector("[data-block]").onclick=e=>{const on=e.currentTarget.dataset.block==="on";busy(e.currentTarget,async()=>{if(!googleOk()){refreshGoogle();throw Error("יש לחדש את החיבור לגוגל")}await syncLegacyManagers(email,on?[]:cur);await call("access",{email,blocked:on})})};
    tr.querySelector("[data-revoke]").onclick=e=>{if(confirm(`להסיר את ${email} ואת כל הקווים שלו?`))busy(e.currentTarget,async()=>{if(!googleOk()){refreshGoogle();throw Error("יש לחדש את החיבור לגוגל")}await syncLegacyManagers(email,[]);await call("access",{email,approved:false})})};
  });
}
function accountModal(){
  modal(`<h2>חשבון חדש</h2><p class="mut small">החשבון יוכל להיכנס עם גוגל ויראה רק את הקווים שתסמן.</p><form class="form" id="accF" style="margin-top:12px">
   <label class="lbl">מייל גוגל<input class="field ltr" name="email" type="email" required placeholder="name@gmail.com" autocomplete="off"></label>
   <div class="lbl">קווים<div class="checks">${S.lines.map(l=>`<label><input type="checkbox" name="l" value="${esc(l.slug)}">${esc(l.name)} <span class="mut small ltr">${esc(l.line||"")}</span></label>`).join("")}</div></div>
   <div class="acts" style="justify-content:flex-start"><button class="btn">שמירה</button><button type="button" class="btn ghost" data-close>ביטול</button></div></form>`);
  $("#accF").onsubmit=async e=>{e.preventDefault();const f=e.target,email=f.email.value.trim().toLowerCase(),slugs=[...f.querySelectorAll("[name=l]:checked")].map(i=>i.value),b=f.querySelector("button");
    b.disabled=true;try{await saveAccess(email,slugs);closeModal();toast("החשבון נוסף");await load()}catch(er){toast(er.message,true);b.disabled=false}};
}
function modal(html){closeModal();const m=document.createElement("div");m.className="modal";m.id="modal";m.innerHTML=`<div class="card">${html}</div>`;m.onclick=e=>{if(e.target===m||e.target.closest("[data-close]"))closeModal()};document.body.append(m);setTimeout(()=>m.querySelector("input")?.focus(),50)}
function closeModal(){$("#modal")?.remove()}
addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();togglePicker(false);toggleSide(false)}});

// ===== קו חדש (מפעל הקווים בקו המקור) =====
const fxApi=body=>lineApi(SOURCE,"factory",body);
async function newLineView(V){
  const fx=S.fx,st=fx.created?3:fx.check?2:1;
  V.innerHTML=`<div class="card"><div class="card-head"><div><h2>קו חדש</h2><p>מכניסים טוקן של מערכת בימות המשיח, ונבנה קו חכם עם כל ה-AI ודף ניהול משלו. הקו נבנה במצב בדיקה.</p></div></div>
   <div class="steps">${["טוקן ימות","פרטי הקו","הקו נבנה"].map((t,i)=>`<span class="${i+1<st?"ok":i+1===st?"on":""}">${i+1}. ${t}</span>`).join("")}</div><div id="fxBody"><p class="mut">טוען…</p></div></div>`;
  if(!googleOk()){$("#fxBody").innerHTML=googleBanner();$("#reG").onclick=refreshGoogle;return}
  try{fx.status=fx.status||await fxApi()}catch(e){$("#fxBody").innerHTML=`<p class="err">${esc(e.message)}</p>`;return}
  const B=$("#fxBody"),ready=fx.status.ready;
  const setup=ready?"":`<div class="banner"><div><b>המפעל עוד לא מחובר ל-Cloudflare.</b> צריך להגדיר בקו המקור (yemot-ai ← Settings ← Variables and Secrets) את הסוד <code>CF_FACTORY_TOKEN</code> ואת המשתנה <code>CF_ACCOUNT_ID</code>. בינתיים אפשר לבדוק טוקנים.</div></div>`;
  if(st===1){B.innerHTML=setup+`<form class="form" id="fxCheck"><label class="lbl">טוקן של מערכת בימות המשיח<small>למשל 0791234567:1234 או טוקן API. הבדיקה רק קוראת מימות, והטוקן לא נשמר בדפדפן.</small><input class="field ltr" name="t" type="password" required autocomplete="off" value="${esc(fx.token)}"></label><div><button class="btn">בדיקת הטוקן</button></div></form>`;
    $("#fxCheck").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;fx.token=e.target.t.value.trim();try{fx.check=await fxApi({op:"check",ymToken:fx.token});toast("הטוקן תקין");newLineView(V)}catch(er){toast(er.message,true);b.disabled=false}}}
  else if(st===2){const c=fx.check;
    B.innerHTML=setup+`<div class="kv" style="margin-bottom:16px">${Object.entries(c.session||{}).map(([k,v])=>`<b>${esc(k)}</b><span>${esc(v)}</span>`).join("")}<b>תיקיות</b><span>${esc((c.folders||[]).join(", ")||"אין")}</span></div>
    <form class="form" id="fxCreate"><div class="fgrid"><label class="lbl">שם הקו<input class="field" name="name" required maxlength="40" placeholder="למשל: קו החברים"></label>
     <label class="lbl">שם קצר באנגלית<small>לכתובת: yemot-line-…</small><input class="field ltr" name="slug" required pattern="[a-z0-9][a-z0-9-]{1,18}[a-z0-9]" placeholder="chaverim"></label>
     <label class="lbl">מספר הקו<input class="field ltr" name="linePhone" value="${esc(c.linePhone||"")}" required pattern="0[0-9]{8,9}"></label>
     <label class="lbl">טלפון מנהל הקו<small>לא חובה – מנהל בפקודות הקוליות</small><input class="field ltr" name="ownerPhone" pattern="0[0-9]{8,9}"></label></div>
     <label class="lbl">מייל גוגל של מנהל הקו<small>לא חובה – יקבל גישה לקו הזה בלבד, ויוכל להוסיף מנהלים בעצמו</small><input class="field ltr" name="ownerEmail" type="email" placeholder="name@gmail.com"></label>
     <div class="acts" style="justify-content:flex-start"><button class="btn" ${ready?"":"disabled"}>בניית הקו</button><button type="button" class="btn ghost" id="fxBack">חזרה</button></div></form>`;
    $("#fxBack").onclick=()=>{fx.check=null;newLineView(V)};
    $("#fxCreate").onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));
      if(!confirm(`לבנות קו חדש "${v.name}" (${v.linePhone}) בשם yemot-line-${v.slug}?\nייווצר שרת חדש ב-Cloudflare עם מפתחות ה-AI של קו המקור.`))return;
      const b=e.target.querySelector("button");b.disabled=true;toast("בונה את הקו… זה יכול לקחת חצי דקה");
      try{fx.created=await fxApi({op:"create",ymToken:fx.token,...v});fx.status=null;S.data=null;await load()}catch(er){toast(er.message,true);b.disabled=false}}}
  else{const r=fx.created,l=r.line;
    B.innerHTML=`<div class="banner info"><div><b>הקו "${esc(l.name)}" נבנה.</b> ${esc(r.note||"")}</div></div>
     <ol class="small" style="margin:0 0 14px;padding-inline-start:20px">${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
     <p style="margin:0 0 6px;font-weight:600">סיסמת דף הניהול של הקו (מוצגת פעם אחת – לשמור עכשיו):</p><div class="secret"><code id="pw">${esc(r.adminPass)}</code><button class="btn sm ghost" id="cp">העתקה</button></div>
     <div class="acts" style="justify-content:flex-start;margin-top:16px"><a class="btn soft" href="#line=${encodeURIComponent(l.slug)}">כניסה לקו</a><button class="btn" id="fxIvr">השלב הבא: חיבור השלוחות ←</button><button class="btn ghost" id="fxAgain">קו נוסף</button></div>`;
    $("#cp").onclick=()=>{navigator.clipboard?.writeText(r.adminPass).then(()=>toast("הועתק"))};
    $("#fxIvr").onclick=e=>ivrStart(l.slug,e.currentTarget,fx.token);
    $("#fxAgain").onclick=()=>{if(confirm("לעבור לקו נוסף? הסיסמה של הקו הזה לא תוצג שוב.")){S.fx={token:"",check:null,created:null,plan:null,status:null};newLineView(V)}};
  }
}
// חיבור השלוחות: תמיד עם הטוקן של אותו קו (השרת גם בודק את זה)
async function ivrStart(slug,btn,known){
  const token=known||prompt(`הטוקן של המערכת בימות של הקו "${slug}" (לא נשמר):`);if(!token)return;
  btn.disabled=true;toast("קורא את מבנה השלוחות…");
  try{const p=await fxApi({op:"ivr_plan",slug,ymToken:token.trim()});ivrModal({...p,token:token.trim()})}catch(e){toast(e.message,true)}finally{btn.disabled=false}
}
function ivrModal(p){
  modal(`<h2>חיבור השלוחות של "${esc(p.slug)}"</h2><p class="mut small">${p.count} קובצי ext.ini מקו המקור, אחרי החלפת הכתובת ומפתח ההרצה. מה שקיים היום נשמר בגיבוי לפני הכתיבה. קבצי שמע לא מועתקים.</p>
   ${p.truncated?'<div class="banner"><div><b>זו רק חלק מהשלוחות.</b> אחרי הכתיבה אפשר ללחוץ שוב על "חיבור שלוחות" כדי להמשיך.</div></div>':""}
   <form id="ivrF"><div class="tw" style="max-height:46vh;overflow:auto"><table class="t" style="min-width:560px"><thead><tr><th></th><th>שלוחה</th><th>מצב</th><th>אחרי</th></tr></thead><tbody>
   ${p.plan.map(x=>`<tr><td><input type="checkbox" name="p" value="${esc(x.path)}" ${x.same?"disabled":x.unknown?"":"checked"}></td><td class="ltr">${esc(x.path)}</td><td>${x.same?'<span class="pill ok">זהה</span>':x.unknown?'<span class="pill warn">לא נקרא</span>':x.before?'<span class="pill warn">יוחלף</span>':'<span class="pill acc">חדש</span>'}${(x.warn||[]).map(w=>`<div class="small" style="color:var(--warn)">${esc(w)}</div>`).join("")}</td><td><pre class="ini">${esc(x.after)}</pre></td></tr>`).join("")}</tbody></table></div>
   <div class="acts" style="justify-content:flex-start;margin-top:14px"><input class="field ltr" name="confirm" required placeholder="להקליד את השם הקצר לאישור" style="max-width:240px"><button class="btn">כתיבת השלוחות שנבחרו</button><button type="button" class="btn ghost" data-close>סגירה</button></div></form>`);
  $("#modal .card").style.width="min(860px,100%)";
  $("#ivrF").onsubmit=async e=>{e.preventDefault();const f=e.target,paths=[...f.querySelectorAll("[name=p]:checked")].map(i=>i.value);if(!paths.length)return toast("לא נבחרו שלוחות",true);
    if(!confirm(`לכתוב ${paths.length} קובצי שלוחות למערכת של "${p.slug}"?`))return;const b=f.querySelector("button");b.disabled=true;
    try{const r=await fxApi({op:"ivr_apply",slug:p.slug,ymToken:p.token,paths,confirm:f.confirm.value.trim()});closeModal();
      toast(r.ok?`נכתבו ${r.done.length} שלוחות`:`נכתבו ${r.done.length}, נכשלו ${r.failed.length}${(r.skipped||[]).length?`, ${r.skipped.length} ממתינות לסבב נוסף`:""}`,!r.ok);
      if((r.failed||[]).length)alert("לא נכתבו:\n"+r.failed.join("\n"))}catch(er){toast(er.message,true);b.disabled=false}};
}

// ===== הפעלה =====
if(S.token)load();else showLogin();
</script>
