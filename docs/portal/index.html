<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>מרכז הקווים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:Heebo,Arial,sans-serif;color:#151923;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}header{min-height:68px;background:#fff;border-bottom:1px solid #e4e7ee;display:flex;align-items:center;justify-content:space-between;padding:12px max(20px,calc((100% - 1100px)/2));gap:14px}h1{font-size:20px;margin:0}main{max-width:1050px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #e4e7ee;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 24px #00000008}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.line{padding:18px;border:1px solid #e4e7ee;border-radius:14px;background:white}.line h3{margin:0 0 8px}.line p{margin:5px 0 14px}.toolbar,.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}button,.btn{border:0;border-radius:10px;background:#3646c9;color:white;padding:10px 16px;font:600 14px Heebo;text-decoration:none;cursor:pointer;display:inline-block}button.secondary,.btn.secondary{background:#edf0ff;color:#2738ad}button.danger{background:#fff0ef;color:#a3261f}button:disabled{opacity:.6;cursor:wait}input,select{font:inherit;padding:10px;border:1px solid #ccd1dc;border-radius:9px;min-width:0}select[multiple]{min-height:130px}.muted{color:#747987}.error{color:#b42318}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:13px;border-radius:12px;background:#f5f6fa}.stat b{display:block;font-size:22px}.client{padding:12px 0;border-bottom:1px solid #eceef3}.client:last-child{border:0}.line-status{font-size:12px;color:#7a3e08;background:#fff4de;padding:3px 8px;border-radius:999px}.hidden{display:none!important}body.logged-out{background:#fff}body.logged-out header{display:none}body.logged-out main{max-width:none;min-height:100vh;margin:0;padding:24px;display:grid;place-items:center}body.logged-out #app{width:min(340px,100%);margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}body.logged-out #gbtn{display:flex;justify-content:center}body.logged-out #loginError{text-align:center;margin:12px 0 0}
body:not(.logged-out){min-height:100vh;background:#f3f5fb;color:#18223a}body:not(.logged-out) header{position:sticky;top:0;z-index:5;min-height:70px;padding:12px max(20px,calc((100% - 1180px)/2));background:#ffffffed;backdrop-filter:blur(14px);box-shadow:0 2px 14px #15213a0a}body:not(.logged-out) h1{font-size:18px;letter-spacing:-.3px}body:not(.logged-out) main{max-width:1180px;margin:30px auto;padding:0 22px 48px}body:not(.logged-out) #app{display:grid;gap:22px;background:transparent;border:0;border-radius:0;padding:0;margin:0;box-shadow:none}.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px 34px;border-radius:24px;background:linear-gradient(120deg,#17244b,#3549b5 68%,#586be0);color:#fff;box-shadow:0 18px 44px #273f9d24}.hero-copy{min-width:0}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.7px;color:#cbd3ff}.hero h2{font-size:30px;line-height:1.2;margin:6px 0 8px;letter-spacing:-.7px}.hero p{margin:0;color:#e0e5ff}.hero .btn{background:#fff;color:#293b98;padding:12px 18px;white-space:nowrap}.section{display:grid;gap:14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-head h2{margin:0;font-size:22px;letter-spacing:-.4px}.count{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 9px;border-radius:999px;background:#e8ecff;color:#3446bd;font-weight:800}.grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.line{position:relative;display:flex;flex-direction:column;min-height:190px;padding:21px;border-color:#e5e9f2;border-radius:18px;box-shadow:0 7px 20px #18284d0a;transition:transform .15s,box-shadow .15s}.line:hover{transform:translateY(-2px);box-shadow:0 14px 28px #18284d15}.line h3{font-size:19px;letter-spacing:-.3px;margin:5px 0}.line-kicker{font-size:12px;font-weight:700;color:#747d94}.line p{margin:0 0 18px}.line .actions{margin-top:auto}.line button{width:100%;padding:11px 14px}.line-status{align-self:flex-start;margin-top:7px}.card{padding:22px 24px;margin:0;border-color:#e5e9f2;border-radius:18px;box-shadow:0 7px 20px #18284d0a}.card h2{margin:0 0 8px;font-size:21px}.card p{line-height:1.65}.account-panel{display:flex;align-items:center;justify-content:space-between;gap:20px}.account-panel p{margin:4px 0}.owner-panel{display:grid;gap:16px}.owner-tools{display:flex;align-items:center;justify-content:space-between;gap:20px}.owner-tools p{margin:3px 0;color:#69738a}.client-form{display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1.5fr);gap:14px;align-items:end}.client-form label{display:grid;gap:7px;font-weight:600}.client-form input{width:100%}.stat{border:1px solid #e8ebf2;background:#f8f9fc}.stats{margin-top:12px}.client{padding:16px 0}.client .actions{margin-top:10px}@media(max-width:680px){body:not(.logged-out) main{margin:18px auto;padding:0 14px 32px}body:not(.logged-out) header{padding:10px 14px}.hero{align-items:flex-start;flex-direction:column;padding:24px;border-radius:20px}.hero h2{font-size:25px}.hero .btn{width:100%;text-align:center}.section-head h2{font-size:19px}.grid{grid-template-columns:1fr}.account-panel,.owner-tools{align-items:stretch;flex-direction:column}.client-form{grid-template-columns:1fr}.account-panel button{width:100%}}
</style>
<body class="logged-out">
<header id="topbar"><h1>האזור האישי</h1><div class="toolbar"><span id="user" class="muted"></span><button id="logout" class="secondary hidden">יציאה</button></div></header>
<main><div id="app" class="card">טוען…</div></main>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
"use strict";
const API="https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/admin-netfree/portal";
const CONFIG="https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/admin-netfree/config";
const LINES_API="https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/admin-netfree-lines/";
const app=document.querySelector("#app"),user=document.querySelector("#user"),logout=document.querySelector("#logout");
let token=sessionStorage.getItem("portalToken")||"",identity=null,googleCredential=sessionStorage.getItem("portalGoogle")||"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function request(url,body){const r=await fetch(url,{method:body?"POST":"GET",headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});const d=await r.json().catch(()=>({error:"תשובה לא תקינה מהשרת"}));if(!r.ok)throw Error(d.error||"שגיאה "+r.status);return d}
async function call(action="me",body){return request(API+"?action="+encodeURIComponent(action)+"&token="+encodeURIComponent(token),body)}
function login(message="כניסה למערכת ניהול הקווים"){
  document.body.classList.add("logged-out");
  app.innerHTML="<div id=\"gbtn\"></div><p id=\"loginError\" class=\"error\">"+(message!=="כניסה למערכת ניהול הקווים"?esc(message):"")+"</p>";
  request(CONFIG).then(config=>{
    if(!config.google)throw Error("כניסה בגוגל עדיין לא הוגדרה בשרת.");
    const timer=setInterval(()=>{if(!window.google?.accounts?.id)return;clearInterval(timer);
      google.accounts.id.initialize({client_id:config.google,callback:async credential=>{
        try{const result=await request(API+"?action=login",{google:credential.credential});token=result.token;googleCredential=credential.credential;sessionStorage.setItem("portalToken",token);sessionStorage.setItem("portalGoogle",googleCredential);await load()}
        catch(e){document.querySelector("#loginError").textContent=e.message}
      }});
      google.accounts.id.renderButton(document.querySelector("#gbtn"),{theme:"outline",size:"large",locale:"he",text:"signin_with"});
    },100);
    setTimeout(()=>clearInterval(timer),15000);
  }).catch(e=>{const p=document.querySelector("#loginError");if(p)p.textContent=e.message});
}
function handoffUrl(line){const u=new URL(line.url,location.href);u.hash="g="+encodeURIComponent(googleCredential);return u.href}
function enterLine(line){location.href=handoffUrl(line)}
function renderLine(line){return `<article class="line"><span class="line-kicker">הקו שלי</span><h3>${esc(line.name)}</h3><p class="muted">מספר קו: ${esc(line.line||"לא הוגדר")}</p>${line.enabled===false?'<span class="line-status">הקו מושהה</span>':''}<div class="actions"><button data-enter="${esc(line.slug)}">ניהול הקו והמנהלים</button></div></article>`}
function accountPanel(data){return `<section class="card account-panel"><div><h2>הגדרות חשבון</h2><p>חשבון Google: <b dir="ltr">${esc(data.email)}</b></p><p class="muted">הקווים באזור האישי נקבעים לפי ההרשאות שהוגדרו לחשבון.</p></div><button class="secondary" id="accountLogout">יציאה מהחשבון</button></section>`}
function renderClients(clients,lines){return `<section class="card"><h2>גישה למשתמשים</h2><p class="muted">בחר חשבון Google והקווים שהוא יראה באזור האישי שלו.</p><div class="client-form"><label>חשבון Google<input id="email" type="email" autocomplete="email" placeholder="name@gmail.com"></label><label>קווים לשיוך<select id="lines" multiple>${lines.map(l=>`<option value="${esc(l.slug)}">${esc(l.name)} · ${esc(l.line)}</option>`).join("")}</select></label></div><p class="muted">לניהול מנהלים בכל קו, היכנס לכרטיס הקו המתאים.</p><button id="approve">שמירת גישה לקווים</button><h3>חשבונות עם גישה</h3>${clients.length?clients.map(c=>`<div class="client"><b dir="ltr">${esc(c.email)}</b> · ${(c.lines||[]).length} קווים ${c.blocked?'<span class="line-status">גישה מושהית</span>':''}<div class="actions"><button class="secondary" data-block="${esc(c.email)}" data-state="${c.blocked?'off':'on'}">${c.blocked?'החזר גישה':'השהה גישה'}</button><button class="danger" data-revoke="${esc(c.email)}">הסר גישה</button></div></div>`).join(""):'<p class="muted">אין עדיין חשבונות נוספים.</p>'}</section>`}
function ownerPanel(data){return `<section id="owner-management" class="owner-panel"><section class="card"><div class="owner-tools"><div><h2>ניהול השירות</h2><p>כאן נמצאים כל הקווים במערכת. מתוך ניהול כל קו אפשר להוסיף מנהלים והרשאות.</p></div><div class="actions"><a class="btn" href="/07/source/#lines">הוספת קו</a><button class="secondary" id="refreshStats">רענון נתונים</button></div></div><div id="aggregate" class="stats"><div class="stat">טוען נתונים…</div></div></section>${renderClients(data.clients||[],data.lines||[])}</section>`}
async function lineStats(lines){const area=document.querySelector("#aggregate");if(!area)return;try{
  if(!googleCredential)throw Error("יש להתחבר מחדש ל-Google כדי לרענן נתוני קווים.");
  const settled=await Promise.allSettled(lines.filter(l=>l.enabled!==false).map(async line=>{
    const base=LINES_API+encodeURIComponent(line.slug)+"/";
    const session=await request(base+"session",{google:googleCredential});
    const summary=await request(base+"overview?token="+encodeURIComponent(session.token));
    return {line,summary};
  }));
  const results=settled.filter(x=>x.status==="fulfilled").map(x=>x.value),failed=settled.length-results.length;
  const online=results.reduce((n,x)=>n+(x.summary.online||[]).length,0),pending=results.reduce((n,x)=>n+(x.summary.pending||[]).reduce((a,p)=>a+(+p.n||0),0)+(+x.summary.joins||0),0),members=results.reduce((n,x)=>n+(+x.summary.members?.active||0),0);
  area.innerHTML=`<div class="stat"><b>${online}</b>מתקשרים כעת</div><div class="stat"><b>${pending}</b>הודעות ובקשות ממתינות</div><div class="stat"><b>${members}</b>חברים פעילים</div><div class="stat"><b>${results.length}/${settled.length}</b>קווים שנענו</div>`+(results.map(x=>`<div class="stat"><b>${(x.summary.online||[]).length}</b>${esc(x.line.name)} · מתקשרים כעת</div>`).join(""))+(failed?`<p class="error">${failed} קווים לא החזירו נתונים. בדוק שהקו פעיל ושהחשבון מורשה בו.</p>`:'');
 }catch(e){area.innerHTML=`<p class="error">לא ניתן לטעון נתונים מכל הקווים: ${esc(e.message)}</p><p class="muted">התחבר מחדש ל-Google ונסה שוב.</p>`}}
async function load(){try{
  identity=await call();document.body.classList.remove("logged-out");app.classList.remove("card");user.textContent=identity.email;logout.classList.remove("hidden");
  const lines=identity.lines||[];
  app.innerHTML=`<section class="hero"><div class="hero-copy"><span class="eyebrow">${identity.isOwner?'חשבון בעלים':'האזור האישי'}</span><h2>${identity.isOwner?'כל הקווים שלך במקום אחד':'הקווים שלי'}</h2><p>${identity.isOwner?`ניהול וגישה ל־${lines.length} קווים במערכת.`:`${lines.length} קווים שהוקצו לחשבון Google שלך.`}</p></div>${identity.isOwner?'<a class="btn" href="#owner-management">ניהול השירות</a>':''}</section><section class="section"><div class="section-head"><h2>${identity.isOwner?'כל הקווים במערכת':'הקווים שלי'}</h2><span class="count">${lines.length}</span></div><div class="grid">${lines.map(renderLine).join("")||(identity.isOwner?'<p class="muted">עדיין לא נוצרו קווים. אפשר להוסיף קו דרך ניהול השירות.</p>':'<p class="muted">לא הוקצו לחשבון קווים. פנה לבעלים כדי לקבל גישה.</p>')}</div></section>${identity.isOwner?ownerPanel(identity):''}${accountPanel(identity)}`;
  document.querySelectorAll("[data-enter]").forEach(b=>b.onclick=()=>{const l=lines.find(x=>x.slug===b.dataset.enter);if(l)enterLine(l)});
  document.querySelector("#approve")?.addEventListener("click",async()=>{const email=document.querySelector("#email").value.trim().toLowerCase(),selected=[...document.querySelector("#lines").selectedOptions].map(o=>o.value);try{await call("access",{email,approved:true});await call("assign",{email,lines:selected});await load()}catch(e){alert(e.message)}});
  document.querySelectorAll("[data-block]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await call("access",{email:b.dataset.block,blocked:b.dataset.state==="on"});await load()}catch(e){alert(e.message);b.disabled=false}});
  document.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{if(!confirm("להסיר את החשבון ואת שיוכי הקווים שלו?"))return;b.disabled=true;try{await call("access",{email:b.dataset.revoke,approved:false});await load()}catch(e){alert(e.message);b.disabled=false}});
  document.querySelector("#refreshStats")?.addEventListener("click",()=>lineStats(lines));
  document.querySelector("#accountLogout")?.addEventListener("click",()=>logout.click());
  if(identity.isOwner)await lineStats(lines);
 }catch(e){token="";sessionStorage.removeItem("portalToken");if(e.message.includes("הגישה לשירות הושעתה")){user.textContent="";app.innerHTML=`<h2>הגישה לשירות הושעתה</h2><p class="error">פנה לבעל השירות.</p>`}else login(e.message)}}
logout.onclick=async()=>{try{await call("logout",{})}catch{}sessionStorage.removeItem("portalToken");sessionStorage.removeItem("portalGoogle");location.reload()};
if(token)load();else login();
</script>
</html>
