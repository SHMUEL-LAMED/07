<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מרכז הקווים</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{font-family:Heebo,Arial,sans-serif;color:#151923;background:#f6f4ef}*{box-sizing:border-box}body{margin:0}header{height:68px;background:#fffefa;border-bottom:1px solid #e8e4da;display:flex;align-items:center;padding:0 max(20px,calc((100% - 1100px)/2));justify-content:space-between}h1{font-size:20px;margin:0}main{max-width:1000px;margin:38px auto;padding:0 18px}.card{background:#fffefa;border:1px solid #e8e4da;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 8px 24px #00000008}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.line{padding:18px;border:1px solid #e8e4da;border-radius:14px;background:white}button,a.btn{border:0;border-radius:10px;background:#3646c9;color:white;padding:10px 16px;font:600 14px Heebo;text-decoration:none;cursor:pointer;display:inline-block}input{font:inherit;padding:10px;border:1px solid #ddd;border-radius:9px}small,.muted{color:#747987}.error{color:#b42318}
</style><header><h1>מרכז הקווים</h1><span id="user"></span></header><main><div id="app" class="card">מתחבר…</div></main><script src="https://accounts.google.com/gsi/client" async defer></script><script>
const API="https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/admin-netfree/portal";
let tok=sessionStorage.getItem("portalToken")||"", identity;
const app=document.querySelector("#app");
function showLogin(msg="כניסה למערכת ניהול הקווים"){app.innerHTML='<h2>'+msg+'</h2><p>התחברו עם חשבון Google שאושר לשירות.</p><div id="gbtn"></div>';const c=document.createElement("script");c.src=API+"?action=config";/* configured client ID is supplied by the server */fetch("https://yemot-ai.smwlyqswkwt232.workers.dev/admin/api/config").then(r=>r.json()).then(x=>{if(!x.google){app.insertAdjacentHTML("beforeend",'<p class="error">כניסה בגוגל עדיין לא הוגדרה בשרת.</p>');return}const wait=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(wait);google.accounts.id.initialize({client_id:x.google,callback:async r=>{try{const q=await fetch(API+"?action=login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({google:r.credential})});const d=await q.json();if(!q.ok)throw Error(d.error);tok=d.token;sessionStorage.setItem("portalToken",tok);sessionStorage.setItem("portalGoogle",r.credential);load()}catch(e){showLogin(e.message)}}});google.accounts.id.renderButton(document.querySelector("#gbtn"),{theme:"outline",size:"large",locale:"he"})}},200)})}
async function call(action="me",body){const r=await fetch(API+"?action="+action+"&token="+encodeURIComponent(tok),{method:body?"POST":"GET",headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function load(){try{identity=await call();document.querySelector("#user").textContent=identity.email;const lines=identity.lines||[];app.innerHTML='<h2>'+(identity.isOwner?'כל הקווים':'הקווים שלי')+'</h2><div class="grid">'+(lines.map(l=>'<div class="line"><b>'+l.name+'</b><p>'+l.line+'</p><a class="btn" href="'+l.url+'#g="+encodeURIComponent(sessionStorage.getItem("portalGoogle")||"")+'">כניסה לניהול הקו</a></div>').join("")||'<p>לא הוקצו לחשבון קווים.</p>')+'</div>'+(identity.isOwner?ownerPanel(identity):'')+'<p><button id="logout">יציאה</button></p>';document.querySelector("#logout").onclick=()=>{sessionStorage.removeItem("portalToken");location.reload()};if(identity.isOwner)bindOwner()}catch(e){sessionStorage.removeItem("portalToken");showLogin(e.message)}}
function ownerPanel(data){return '<section class="card"><h2>ניהול שירות</h2><p>להוספת קו חדש פתחו את מפעל הקווים.</p><a class="btn" href="https://shmuel-lamed.github.io/07/#lines" target="_blank">הוספת קו חדש</a></section><section class="card"><h2>אישור לקוחות ושיוך קווים</h2><div class="grid"><input id="email" placeholder="כתובת Google של הלקוח"><select id="lines" multiple>'+data.lines.map(l=>'<option value="'+l.slug+'">'+l.name+' · '+l.line+'</option>').join("")+'</select></div><p><button id="approve">אישור ושיוך</button></p><h3>חשבונות שאושרו</h3><ul>'+((data.clients||[]).map(c=>'<li>'+c.email+' — '+c.lines.length+' קווים '+(c.blocked?'(מושהה)':'')+' <button type="button" data-block="'+c.email+'" data-state="'+(c.blocked?'off':'on')+'">'+(c.blocked?'החזר גישה':'השהה')+'</button> <button type="button" data-revoke="'+c.email+'">הסר מהשירות</button></li>').join("")||'<li>אין עדיין חשבונות</li>')+'</ul></section>'}
function bindOwner(){document.querySelectorAll("[data-block]").forEach(b=>b.onclick=async()=>{try{await call("access",{email:b.dataset.block,blocked:b.dataset.state==="on"});load()}catch(e){alert(e.message)}});document.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{try{await call("access",{email:b.dataset.revoke,approved:false});load()}catch(e){alert(e.message)}});document.querySelector("#approve").onclick=async()=>{const email=document.querySelector("#email").value,lines=[...document.querySelector("#lines").selectedOptions].map(o=>o.value);try{await call("access",{email,approved:true});await call("assign",{email,lines});load()}catch(e){alert(e.message)}}}
if(tok)load();else showLogin();
</script></html>
