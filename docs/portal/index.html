// ===== 30-stats.js =====
// לשונית "סטטיסטיקה" (stats) – מספרים ומגמות של 30 יום מתוך היומנים של ימות המשיח. קריאה בלבד.
// נתיב: GET stats.
(() => {
const arr = v => (Array.isArray(v) ? v : []);
const sum = a => arr(a).reduce((s, x) => s + (+x || 0), 0);
const lastOf = a => { a = arr(a); return a.length ? (+a[a.length - 1] || 0) : 0; };
// "YYYY-MM-DD" → "DD/MM"
const dayLbl = x => { x = String(x || ""); return x.length >= 10 ? x.slice(8, 10) + "/" + x.slice(5, 7) : x; };
const HOURS = Array.from({ length: 24 }, (_, i) => (i < 10 ? "0" : "") + i);
const nameOf = r => (r && (r.n || nm(r.p))) || "";
const monthsOf = d => arr(((d && d.system) || {}).months).filter(Boolean);

// ---------- חלקים ----------
// אריחי הסיכום
const tilesHtml = d => {
const quiet = arr(d.quiet);
return h`<div class="tiles">
${tile(lastOf(d.calls), "שיחות היום")}
${tile(lastOf(d.callers), "מתקשרים היום")}
${tile(sum(d.calls), "שיחות ב-30 יום")}
${tile(sum(d.msgs), "הודעות ב-30 יום")}
${tile(sum(d.conv), "שיחות עם העוזר ב-30 יום")}
${tile(quiet.length, "לא נכנסו שבוע", quiet.length ? "warn" : "good")}
</div>`;
};

// ארבעת הגרפים
const chartsHtml = d => {
const dl = arr(d.days).map(dayLbl), months = monthsOf(d);
return h`<div class="cols two">
${card({ title: "שיחות לפי יום", small: "30 הימים האחרונים", body: chart(dl, arr(d.calls), { unit: "שיחות", xName: "יום" }) })}
${card({ title: "שיחות לפי שעה", small: months.join(", "), body: chart(HOURS, HOURS.map((_, i) => +arr(d.byHour)[i] || 0), { unit: "שיחות", xName: "שעה", xEvery: 8 }) })}
${card({ title: "הודעות שעלו לקו לפי יום", body: chart(dl, arr(d.msgs), { unit: "הודעות", xName: "יום" }) })}
${card({ title: "שיחות עם העוזר לפי יום", body: chart(dl, arr(d.conv), { unit: "שיחות", xName: "יום" }) })}
</div>`;
};

// ההודעה החשובה האחרונה – מי שמע ומי לא (בלי השמעה ובלי צינתוק כאן)
const impCard = d => {
const title = "ההודעה החשובה האחרונה";
const li = d.lastImp;
if (!li || typeof li !== "object") return card({ title, body: empty("אין הודעות חשובות") });
const heard = arr(d.heard).filter(Boolean), notHeard = arr(d.notHeard).filter(Boolean);
const small = "הודעה " + String(li.f || "").replace(/\.wav$/i, "") + (li.t ? " · " + fmtD(li.t) : "");
const all = heard.length + notHeard.length, pct = all ? Math.round(100 * heard.length / all) : 0;
return card({
title, small,
body: h`${all ? h`<div class="st-prog"><div class="meter" role="progressbar" aria-label="שמעו" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="${"width:" + pct + "%"}"></i></div><span class="small mut num">${pct}%</span></div>` : ""}
<h3>שמעו (${heard.length})</h3>
${heard.length ? h`<div class="chips">${heard.map(r => chip(nameOf(r), "ok"))}</div>` : h`<p class="mut small">אף אחד עדיין</p>`}
<h3>עוד לא שמעו (${notHeard.length})</h3>
${notHeard.length ? h`<div class="chips">${notHeard.map(r => chip(nameOf(r)))}</div>` : h`<p class="mut small">כולם שמעו 🎉</p>`}`,
});
};

// מי לא נכנס בשבוע האחרון (השם פותח את כרטיס החבר)
const quietCard = d => {
const quiet = arr(d.quiet).filter(Boolean);
const body = quiet.length
? h`<ul class="list">${quiet.map(r => h`<li><span class="grow">${r.p ? h`<button type="button" class="link" data-card="${r.p}" title="כרטיס חבר">${nameOf(r)}</button>` : h`<b>${nameOf(r)}</b>`}</span><span class="small mut">${r.last ? h`אחרון: <span class="num ltr nowrap">${fmtD(r.last)}</span>` : "לא נכנס החודש"}</span></li>`)}</ul>`
: empty("כולם היו בקו השבוע 🎉");
return card({ title: "לא נכנסו לקו בשבוע האחרון", small: String(quiet.length), body });
};

// מצב המערכת
const sysCard = d => {
const s = d.system || {}, months = monthsOf(d);
const row = (label, val) => h`<li><span class="grow">${label}</span>${val}</li>`;
const b = v => h`<b class="num">${+v || 0}</b>`;
return card({
title: "מצב המערכת",
body: h`<ul class="list">
${row("שבת/חג עכשיו", d.holy ? pill("כן", "warn") : pill("לא"))}
${row("צינתוקים שמחכים למוצאי שבת", pill(arr(d.deferred).length))}
${row("הודעות בארכיון / מתומללות", pill((+s.archive || 0) + " / " + (+s.transcribed || 0)))}
${row("פרופילים של חברים", b(s.profiles))}
${row("שיחות עם העוזר ביומן", b(s.conv))}
${row("שיחות ביומני ימות (" + months.join(", ") + ")", b(s.totalCalls))}
</ul>`,
});
};

const render = d => {
d = d || {};
const months = monthsOf(d);
const per = arr(d.perMember).filter(Boolean).map(r => ({ n: nameOf(r), calls: +r.calls || 0 }));
const folders = arr(d.byFolder).map(r => ({ l: (r && r.l) || "", n: +(r && r.n) || 0 }));
return h`<div class="row"><span class="sp"></span><button type="button" class="btn s g" data-go="reports">לדוח החודשי ←</button></div>
${tilesHtml(d)}
${chartsHtml(d)}
<div class="cols">
${card({ title: "הפעילים ביותר", small: "שיחות, " + months.join(" + "), body: hbars(per, "n", "calls") })}
${card({ title: "איפה מבלים בקו", small: "כניסות לשלוחות", body: hbars(folders, "l", "n") })}
${impCard(d)}
${quietCard(d)}
${sysCard(d)}
</div>`;
};

// ---------- הלשונית ----------
Tabs.register({
id: "stats",
label: "סטטיסטיקה",
icon: "stats",
group: "insight",
head: { sub: "מספרים ומגמות מתוך היומנים של ימות המשיח." },
aiSug: ["מתי הקו הכי עמוס?"],
load: () => api("stats"),
render,
css: ".t-stats .card h3{margin-top:10px}.t-stats .st-prog{display:flex;align-items:center;gap:10px}.t-stats .st-prog .meter{flex:1 1 auto}",
});
})();

// ===== 31-live.js =====
// לשונית "בקרה חיה" (live) – מי בקו עכשיו, חדר הוועידה וציר הזמן של יום
(() => {
const CONF = "בחדר הוועידה";
const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
// מחוברים / כניסות בטוחים מהתשובה (שדה חסר / שרת ישן)
const onl = d => ((d && d.online) || []).filter(c => c && c.p);
const ents = d => ((d && d.calls && d.calls.ents) || []).filter(Boolean);
const nameOf = c => c.n || (state.names && state.names[c.p]) || "";
const isToday = () => (state.liveDay || todayIL()) === todayIL();

// רישום הרגע הראשון שהדף ראה כל מחובר; מי שיצא נמחק (כניסה חדשה נמדדת מחדש)
const seen = list => {
const now = Date.now(), fs = state.firstSeen, on = {};
list.forEach(c => { on[c.p] = 1; if (!fs[c.p]) fs[c.p] = now; });
Object.keys(fs).forEach(p => { if (!on[p]) delete fs[p]; });
};
// משך מאז שנראה לראשונה: פחות מדקה "N שנ׳", אחרת M:SS
const dur = p => {
const t = state.firstSeen[p];
if (!t) return "";
const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
return s < 60 ? s + " שנ׳" : Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
// יום בתאריך ISO + n ימים (שעון ירושלים, באמצע היום כדי לא ליפול על מעבר שעון)
const shiftDay = (day, n) => {
const t = Date.parse(day + "T12:00:00Z");
if (isNaN(t)) return todayIL();
return new Date(t + n * 86400000).toISOString().slice(0, 10);
};

// ---------- חלקי התצוגה ----------
// מדדים למעלה
const kpis = d => {
const list = onl(d), conf = list.filter(c => c.w === CONF).length;
const es = ents(d), callers = +(d && d.calls && d.calls.callers) || 0;
const k = (label, v, icon, cls) => h`<div class="kpi${cls ? " " + cls : ""}"><span class="k">${label}</span><span class="v" data-count="${v}">${v}</span><span class="ic" aria-hidden="true">${ico(icon)}</span></div>`;
return h`<div class="kpis" id="lv-kpis">${k("בקו עכשיו", list.length, "live", list.length ? "ok" : "")}${k("בחדר הוועידה", conf, "users", "")}${k(isToday() ? "כניסות היום" : "כניסות ביום הזה", es.length, "phone", "")}${k("מתקשרים", callers, "user", "")}</div>`;
};
// שורת מחובר
const onRow = c => {
const n = nameOf(c);
return h`<li class="li"><button type="button" class="av" data-card="${c.p}" title="כרטיס חבר" aria-label="${"כרטיס חבר " + (n || c.p)}">${n ? String(n).trim().charAt(0) : ico("phone")}</button><div class="li-main"><b>${n || "מספר לא מוכר"}</b><div class="meta">${phone(c.p)}${c.w ? h`<span>${c.w}</span>` : ""}</div></div><span class="li-side num live-d" data-p="${c.p}" title="משך מאז שהדף ראה את השיחה">${dur(c.p)}</span>${c.id ? h`<div class="acts"><button type="button" class="btn s d w-only" data-x="hangup" data-id="${c.id}" data-phone="${c.p}" data-name="${n || c.p}">ניתוק</button></div>` : ""}</li>`;
};
const nowCard = d => {
const list = onl(d);
return card({
title: "בקו עכשיו",
id: "lv-now",
act: pill(list.length, list.length > 0 ? "ok" : ""),
body: list.length ? h`<ul class="list">${list.map(onRow)}</ul>` : empty({ icon: "live", title: "אף אחד לא מחובר" }),
});
};
const confCard = d => {
const conf = onl(d).filter(c => c.w === CONF);
return card({
title: "חדר הוועידה",
id: "lv-conf",
act: pill(conf.length, conf.length ? "ok" : ""),
body: conf.length ? h`<div class="chips">${conf.map(c => chip(nameOf(c) || fmtLine(c.p), "ok"))}</div>` : empty({ icon: "users", title: "החדר ריק" }),
});
};
// שורת ציר הזמן
const tlRow = e => h`<div class="r"><span class="t num">${e.t || ""}</span><span><b>${e.n || (state.names && state.names[e.p]) || fmtLine(e.p)}</b> · ${e.l || e.f || ""}</span><span class="mut small num">${e.x ? "עד " + e.x : ""}</span></div>`;
const tlCard = d => {
const day = state.liveDay || todayIL(), today = todayIL();
const es = ents(d).slice().reverse(), callers = +(d && d.calls && d.calls.callers) || 0;
const pick = h`<div class="row lv-day"><button type="button" class="btn s g icon" data-x="live.shift" data-n="-1" title="היום הקודם" aria-label="היום הקודם">${ico("chevron")}</button><input type="date" value="${day}" max="${today}" data-xc="live.day" aria-label="בחירת יום"><button type="button" class="btn s g icon lv-next" data-x="live.shift" data-n="1" title="היום הבא" aria-label="היום הבא"${day >= today ? raw(" disabled") : ""}>${ico("chevron")}</button>${day !== today ? h`<button type="button" class="btn s" data-x="live.today">היום</button>` : ""}</div>`;
return h`<div class="card" id="lv-tl"><div class="card-h"><h2>${day === today ? "ציר הזמן של היום" : "ציר הזמן של " + fmtD(day + " 00:00").slice(0, 5)}</h2><small>${es.length} כניסות לשלוחות · ${callers} מתקשרים</small><div class="acts">${pick}</div></div>${es.length ? h`<div class="tl">${es.map(tlRow)}</div>` : empty({ icon: "log", title: "אין כניסות ביום הזה" })}</div>`;
};

// עדכון ממוקד אחרי דופק (בלי לצייר את כל הלשונית – שומר על פוקוס בבורר התאריך)
const patch = (root, d) => {
if (!root || state.tab !== "live") return;
const swap = (sel, html) => {
const el = $(sel, root); if (!el) return false;
const box = document.createElement("div"); box.innerHTML = String(html);
const n = box.firstElementChild; if (!n) return false;
el.replaceWith(n); return true;
};
const ok = swap("#lv-kpis", kpis(d)) && swap("#lv-now", nowCard(d)) && swap("#lv-conf", confCard(d));
const ph = $(".page-h", root);
if (ph) swap(".page-h", pageHead("live", d));
if (!ok) Tabs.rerender();
};

// ---------- פעולות ----------
const setDay = v => {
const t = todayIL();
state.liveDay = DAY_RE.test(v || "") && v <= t ? v : t;
return show("live", true);
};
// יום אחר בציר הזמן (קריאה בלבד)
Actions.change("live.day", el => setDay(el.value), { write: false });
Actions.register("live.shift", el => setDay(shiftDay(state.liveDay || todayIL(), +el.dataset.n || 0)), { write: false });
Actions.register("live.today", () => setDay(todayIL()), { write: false });

Tabs.register({
id: "live",
label: "בקרה חיה",
icon: "live",
group: "insight",
head: {
sub: "מי בקו עכשיו, איפה הוא נמצא וכמה זמן הוא שם.",
chips: d => { const n = onl(d).length; return [{ n, label: "בקו עכשיו", cls: n > 0 ? "ok" : "" }]; },
},
aiSug: ["מי בקו עכשיו?", "מי התקשר הכי הרבה היום?"],
load: async () => {
if (!DAY_RE.test(state.liveDay || "")) state.liveDay = todayIL();
const day = state.liveDay, line = Line.cur;
const [calls, o] = await Promise.all([api("calls?day=" + enc(day)), api("online")]);
const d = { calls: (calls && typeof calls === "object") ? calls : {}, online: (o && Array.isArray(o.online)) ? o.online : [], now: o && o.now };
// טעינה מקו קודם לא ממלאת את firstSeen של הקו החדש
if (Line.cur === line) seen(onl(d));
return d;
},
render: d => {
const top = h`<div class="row lv-top"><button type="button" class="btn" data-x="mon">${ico("monitor")} מסך בקרה מלא</button><span class="mut small">מתעדכן כל 15 שניות. משך השיחה נמדד מהרגע שהדף ראה אותה.</span></div>`;
return h`${top}${kpis(d)}<div class="split">${nowCard(d)}${confCard(d)}</div>${tlCard(d)}`;
},
// כל שנייה – עדכון המשכים בלבד

ms: 1000,
fn: root => { $$(".live-d[data-p]", root).forEach(el => { el.textContent = dur(el.dataset.p); }); },
},
// בכל דופק – רק המחוברים מתעדכנים (ציר הזמן לא נטען מחדש)
onPulse: (p, root, d) => {
if (!d || !p || !Array.isArray(p.online)) return;
d.online = p.online;
if (p.now) d.now = p.now;
seen(onl(d));
patch(root, d);
},
css: ".t-live .lv-top{justify-content:space-between}.t-live .li>button.av{border:0;padding:0;cursor:pointer}.t-live .live-d{font-variant-numeric:tabular-nums;min-width:3.5em}.t-live .lv-day{gap:6px;flex-wrap:nowrap}.t-live .lv-day input[type=date]{min-height:34px;padding-block:4px}.t-live .lv-day .btn.icon .ico{transform:rotate(-90deg)}.t-live .lv-day .btn.icon.lv-next .ico{transform:rotate(90deg)}@media(max-width:820px){.t-live .card-h .acts:has(.lv-day){flex-basis:100%;margin-inline-start:0}}@media(max-width:420px){.t-live .lv-day{flex:1 1 100%;flex-wrap:wrap;min-width:0}.t-live .lv-day input[type=date]{flex:1 1 0;width:auto;min-width:0;padding-inline:8px}}",
});

// ===== 32-system.js =====
// לשונית "מערכת" (system): מצב השרת, גישה ושיתוף, גיבוי ושחזור, כלים.
// הכרטיסים הנוספים נטענים בעצלתיים (lazy). שגיאת פעולה בכרטיס מוצגת בתוך הכרטיס, מעל הנתונים הקיימים.
(() => {
// ---------- קבועים ----------
const KEY_TPL = [
{ id: "view", name: "צפייה בלבד", desc: "רואה הכול בדף, לא משנה כלום", sc: ["read"], days: 30 },
{ id: "admin", name: "מנהל", desc: "קריאה וכל פעולות הניהול בדף", sc: ["read", "write"], days: 90 },
{ id: "files", name: "קבצי ימות", desc: "קריאה + קבצים ונתונים בימות המשיח", sc: ["read", "yemot"], days: 30 },
{ id: "ai", name: "AI מלא", desc: "הכול: דף הניהול וקבצי ימות", sc: ["read", "write", "yemot"], days: 30 },
];
const SCOPES = ["read", "write", "yemot"];
const SCOPE_HE = { read: "קריאה", write: "פעולות", yemot: "ימות" };
const AL_HE = { cron: "ריצה תקופתית", ym: "ימות המשיח", ai: "בינה מלאכותית", tz: "צינתוק", backup: "גיבוי" };
const RESTORE_HE = { people: "רשימת החברים", names_over: "השמות", rules: "כללי העוזר", scheduled: "תזמונים", blocked: "חסומים", watch: "השתקות", retort: "רשימת תגובה עוקצנית", strict: "רשימת פיקוח מוגבר", ads: "פרסומות", event: "האירוע", approved: "אישורי הצטרפות", archive: "ארכיון התמלולים", facts: "עובדות", profiles: "פרופילים", dashnotes: "הערות מנהל", joinmap: "בקשות הצטרפות", demap: "מיפוי הודעות" };
const DAYS_OPTS = [[7, "שבוע"], [30, "חודש"], [90, "3 חודשים"], [365, "שנה"], [0, "בלי תוקף"]];
const SHARE_OPTS = [[1, "יום"], [7, "שבוע"], [30, "חודש"]];
const ROLE_OPTS = [["admin", "מנהל"], ["viewer", "צפייה בלבד"]];

// ---------- מצב מקומי (בזיכרון בלבד) ----------
let keyTpl = "ai";        // תבנית המפתח הנבחרת (ברירת מחדל: AI מלא)
let backupFile = null;    // קובץ גיבוי שנקרא ומחכה לבחירה בחלון השחזור
Line.onSwitch(() => { backupFile = null; });

const tplOf = id => KEY_TPL.filter(t => t.id === id)[0] || KEY_TPL[3];
const dateHeShort = ms => { try { return ms ? new Date(ms).toLocaleDateString("he-IL") : ""; } catch { return ""; } };
const dateTimeHe = ms => { try { return ms ? new Date(ms).toLocaleString("he-IL") : ""; } catch { return ""; } };
const arr = v => Array.isArray(v) ? v : [];
const opts = (list, sel) => list.map(o => h`<option value="${o[0]}"${String(o[0]) === String(sel) ? raw(" selected") : ""}>${o[1]}</option>`);
const roleSel = r => r === "viewer" ? "viewer" : "admin";

// הנתונים האחרונים שצוירו בכרטיס עצל (הליבה שומרת אותם לכל קו בנפרד)
const lzData = id => { const d = Core.lz && Core.lz.data ? Core.lz.data[id] : undefined; return d === undefined ? null : d; };
// ציור מחדש של כרטיס עצל עם שגיאת הפעולה מעל הנתונים הקודמים (לא ב-401)
const lzErr = (id, prev, e) => {
if (e && e.status === 401) return;
const base = prev && !prev.__err ? prev : {};
lazyDraw(id, Object.assign({}, base, { __op: (e && e.message) || String(e) }));
};
const opErr = d => d && d.__op ? errBox(d.__op) : "";
// פעולה על כרטיס עצל: POST, ציור התשובה, ושגיאה בתוך הכרטיס. מוגן ממעבר קו באמצע
const lzOp = async (id, route, body) => {
const line = Line.cur, prev = lzData(id);
try {
const r = await api(route, body);
if (Line.cur !== line) return null;
lazyDraw(id, r || {});
return r;
} catch (e) {
if (Line.cur === line) lzErr(id, prev, e);
return null;
}
};

// כרטיסים למנהל בלבד (w:true): לא פונים לשרת לפני whoami ולא בצפייה בלבד.
// state.ro נקבע רק כש-whoami חוזר, ולכן עד אז הטעינה מחזירה סימון המתנה בלי לפנות לשרת.
const W_LZ = ["emails", "keys", "autobak"];
const wLoad = route => () => !state.me ? { wait: true } : state.ro ? { ro: true } : route();
const wHide = d => !d || d.wait || d.ro || state.ro;
// לפני ציור הלשונית: נתונים שמורים שלא מתאימים למצב הנוכחי נזרקים, והכרטיס נטען מחדש
// (המתנה שהסתיימה, או נתוני מנהל שנשמרו לפני שהתברר שזו צפייה בלבד, או להפך)
const wGate = () => {
const L = Core.lz && Core.lz.data; if (!L) return;
W_LZ.forEach(id => {
const d = L[id];
if (!d || d.__err) return;
if (d.wait ? !!state.me : !!d.ro !== !!state.ro) delete L[id];
});
};
const wWait = h`<div class="skel" style="height:64px"></div>`;

// ================= מצב השרת =================
// health שנכשל (רשת / נטפרי חוסם את התוכן) – נתונים ריקים עם סימון blocked; שאר הלשונית עובד
const loadHealth = async () => {
try { return (await api("health")) || {}; }
catch (e) {
if (e && e.status === 401) throw e;
return { blocked: (e && e.message) || "x", errors: [], bg: [], cronAgo: null, lastJob: "", pendingError: 0, deferred: 0, postcheck: 0, aai: 0, retortq: 0, weeklyDone: "", testMode: false };
}
};

const renderHealth = hd => {
const bg = arr(hd.bg), errors = arr(hd.errors);
const hasCron = hd.cronAgo !== null && hd.cronAgo !== undefined;
const cronV = hasCron ? "רצה עכשיו" : hd.lastJob ? fmtD(hd.lastJob) : "—";
return h`<div class="stack">
${hd.blocked ? h`<div class="banner warn" role="status">${ico("alert")}<span>נתוני בריאות המערכת לא הגיעו לדפדפן. הנתונים יצאו מהשרת תקין, ונראה שנטפרי חוסם את התשובה הזו, כנראה בגלל התוכן שלה (שורות מהיומן וטקסטים בתור). שאר הלשונית עובד.</span></div>` : ""}
<div class="tiles">
${tile(cronV, hasCron ? "ריצה קבועה (cron)" : "תזמון אחרון שיצא", "sm good")}
${tile(bg.length, "משימות רקע בתור", bg.length > 20 ? "warn" : "")}
${tile(hd.pendingError || 0, "הודעות שלא נבדקו", hd.pendingError ? "warn" : "good")}
${tile(hd.deferred || 0, "צינתוקים שמחכים")}
${tile(hd.testMode ? "פעיל" : "כבוי", "מצב בדיקות (TEST_MODE)", hd.testMode ? "warn" : "")}
${tile(errors.length, "שגיאות ביומן", errors.length ? "warn" : "good")}
</div>
<div class="split">
${card({
title: h`${ico("system")} תור משימות רקע`,
small: String(bg.length),
act: bg.length ? h`<button type="button" class="btn s d w-only" data-x="system.bgClear">ניקוי התור</button>` : "",
body: h`${bg.length ? h`<ul class="list bgq">${bg.slice(0, 50).map(s => h`<li class="li">${pill(s.k || "")}<div class="li-main"><span class="small">${s.what || ""}</span></div>${s.tries ? pill("ניסיון " + s.tries, "warn") : ""}<div class="acts"><button type="button" class="btn s g d icon w-only" data-x="system.bgDrop" data-f="${s.f || ""}" aria-label="הסרה מהתור" title="הסרה מהתור">${ico("x")}</button></div></li>`)}</ul>` : empty("התור ריק")}
<p class="mut small">בדיקות מאוחרות: ${hd.postcheck || 0} · תמלולים בהמתנה: ${hd.aai || 0} · תגובות בתור: ${hd.retortq || 0} · סיכום שבועי אחרון: ${hd.weeklyDone || "—"}</p>`,
})}
${card({
title: h`${ico("alert")} שגיאות אחרונות ביומן`,
small: String(errors.length),
body: errors.length
? h`<ul class="list log">${errors.map(e => h`<li class="li"><time>${e.t || ""}</time><span class="grow">${e.m || ""}</span></li>`)}</ul>`
: empty("אין שגיאות 👍"),
})}
</div>
${lazy("alerts", {
title: h`${ico("bell")} התראות תקלה`,
small: d => arr(d && d.alerts).length ? arr(d.alerts).length + " אחרונות" : "אין תקלות",
load: () => apiSoft("alerts"),
render: renderAlerts,
})}
</div>`;
};

// קישור הצפייה לפי מצב החיבור

// כמו בדף הישן: רק ?l= של הקו, בלי שאר פרמטרי הכתובת
if (here) return location.origin + location.pathname + (URL_SLUG ? "?l=" + URL_SLUG : "") + "#t=" + token;
if (line && line.url) return location.origin + line.url + "#t=" + token;
return "";   // אין כתובת לקו – מציגים את האסימון בלבד (לא קישור לקו אחר)

if (!me.lineName && !IS_DAAT_COPY && String(me.line || "") === LINE_DEFAULT.replace(/-/g, "")) return PAGES + "source/#t=" + token;
if (!me.lineName && IS_DAAT_COPY) return PAGES + "daattorah/#t=" + token;
return "";
};

</div>
<div class="split">
${card({
title: h`${ico("link")} קישור לצפייה בלבד`, cls: "w-only",
body: h`<p class="mut small">למנהל נוסף שרק צריך לראות: הכול גלוי, אבל אי אפשר לבצע שום פעולה. הקישור פג אחרי מספר הימים שנבחר, או כשמשנים את ADMIN_PASS.</p>

<div id="shareout" class="stack" aria-live="polite"></div>`,

${renderConn()}
</div>
</div>`; };

// ================= גיבוי ושחזור =================
const renderData = () => { wGate(); return h`<div class="stack">

// לשונית "יומן" (log) – יומן השרת (AILog.txt) ויומן הפעולות של הדף (audit)
(() => {
// מסנן "מי ביצע" ביומן הפעולות – בזיכרון בלבד (מתאפס במעבר קו)
let by = "", painted = -1;
Line.onSwitch(() => { by = ""; });
const AUD_SHOW = 300;
const ERR_RE = /שגיאה|error|נכשל|לא הצליח|תקלה/i;
const lines = d => ((d && d.lines) || []).filter(l => l && typeof l === "object");
const items = d => ((d && d.items) || []).filter(x => x && typeof x === "object");

// יומן השרת: חיפוש (תת-מחרוזת, רגיש לאותיות) + "רק שגיאות"
const renderServer = d => {
const all = lines(d), q = String(state.filter.log || "").trim(), only = state.filter.logOnly || "";
let list = q ? all.filter(l => (String(l.t || "") + " " + String(l.m || "")).indexOf(q) > -1) : all;
if (only === "err") list = list.filter(l => ERR_RE.test(String(l.m || "")));
const errs = all.filter(l => ERR_RE.test(String(l.m || ""))).length;
const filtered = !!(q || only);
// "רק שגיאות" מסתיר רשומות שמתאימות לחיפוש (למשל אחרי קפיצה מהחיפוש הכללי)
const byQ = only === "err" && q && !list.length ? all.filter(l => (String(l.t || "") + " " + String(l.m || "")).indexOf(q) > -1).length : 0;
const none = byQ ? { icon: "filter", title: "אין שגיאות שמתאימות לחיפוש", text: byQ + " רשומות מתאימות מוסתרות בגלל \"רק שגיאות\"", act: h`<button type="button" class="btn s" data-x="log.allOnly">הצגת כל הרשומות</button>` }
: filtered ? { icon: "filter", title: "אין רשומות", text: "אפשר לשנות את הסינון" } : { icon: "log", title: "אין רשומות" };
return h`<div class="card">
<div class="card-h"><h2>יומן השרת</h2><small>${all.length} הרשומות האחרונות</small>${filtered ? h`<div class="acts">${pill("מוצגות " + list.length, "info")}</div>` : ""}</div>
<div class="toolbar">${search("log", "סינון")}<select data-filter="logOnly" aria-label="סוג הרשומות"><option value=""${only ? "" : raw(" selected")}>כל הרשומות</option><option value="err"${only === "err" ? raw(" selected") : ""}>רק שגיאות${errs ? " (" + errs + ")" : ""}</option></select></div>
${list.length ? h`<ul class="list log">${list.map(l => {
const bad = ERR_RE.test(String(l.m || ""));
return h`<li class="li${bad ? " bad" : ""}"><time class="num ltr nowrap">${l.t || ""}</time><span class="grow">${l.m || ""}</span></li>`;
})}</ul>` : empty(none)}
</div>`;
};

// יומן פעולות: בורר "מי", ייצוא וטבלה (עד 300 שורות)
const renderAudit = d => {
if (d && d.missing) return card({ title: "יומן פעולות", body: h`<p class="mut">לא זמין בשרת של הקו הזה</p>` });
if (d && d.err) return card({ title: "יומן פעולות", body: errBox(d.err) });
const list = items(d), whoL = ((d && d.who) || []).map(String).filter(Boolean);
if (by && whoL.indexOf(by) < 0) whoL.unshift(by);
const more = list.length > AUD_SHOW;
return h`<div class="card">
<div class="card-h"><h2>יומן פעולות</h2><small>מי ביצע מה בדף הניהול</small>${list.length ? h`<div class="acts">${pill(more ? "מוצגות " + AUD_SHOW + " מתוך " + list.length : list.length + " פעולות", "")}</div>` : ""}</div>
<div class="toolbar"><label class="small mut" for="auditby">מי ביצע</label><select id="auditby" data-xc="log.by"><option value=""${by ? "" : raw(" selected")}>כולם</option>${whoL.map(w => h`<option value="${w}"${w === by ? raw(" selected") : ""}>${w}</option>`)}</select><span class="sp"></span><button type="button" class="btn s" data-x="log.csv"${list.length ? "" : raw(" disabled")}>${ico("download")} ייצוא ל-CSV</button></div>
${list.length ? h`<div class="tw aud"><table class="tbl small"><thead><tr><th>מתי</th><th>מי</th><th>פעולה</th><th>פרטים</th></tr></thead><tbody>${list.slice(0, AUD_SHOW).map(x => h`<tr><td class="num ltr nowrap">${x.d || ""}</td><td><bdi>${x.by || ""}</bdi></td><td class="ltr">${x.r || ""}</td><td>${x.w || ""}</td></tr>`)}</tbody></table></div>${more ? h`<p class="mut small">מוצגות ${AUD_SHOW} הפעולות האחרונות. הייצוא ל-CSV כולל את כל ${list.length}.</p>` : ""}` : empty({ icon: "log", title: "אין פעולות ביומן" })}
</div>`;
};

// שינוי "מי ביצע" → טעינה מחדש מהשרת (הסינון בצד השרת)
Actions.change("log.by", el => {
by = String(el.value || "");
invalidate("log/audit");
return show("log", true, "audit");
}, { write: false });

// ביטול "רק שגיאות"
Actions.register("log.allOnly", () => { state.filter.logOnly = ""; Tabs.rerender(); }, { write: false });

// ייצוא CSV בדפדפן מכל מה שנטען (לפי המסנן הנוכחי, לא רק 300 המוצגות)
Actions.register("log.csv", () => {
const list = items(state.data["log/audit"]);
if (!list.length) { toast("אין מה לייצא", true); return; }
const rows = [["מתי", "מי", "פעולה", "פרטים"]].concat(list.map(x => [x.d || "", x.by || "", x.r || "", x.w || ""]));
downloadBlob(csvBlob(rows), "audit.csv");
}, { write: false });

Tabs.register({
id: "log",
label: "יומן",
icon: "log",
group: "system",
head: {
sub: "כל מה שקרה בקו ובדף, לפי הסדר.",
chips: d => d && d.lines ? [{ n: lines(d).length, label: "רשומות", cls: "" }]
: d && d.items ? [{ n: items(d).length, label: "פעולות", cls: "" }] : [],
},
subs: [{ id: "server", label: "יומן השרת" }, { id: "audit", label: "יומן פעולות" }],
aiSug: ["מה ממתין לטיפול עכשיו?", "מי בקו עכשיו?", "סכם לי את היום בקו"],
load: async ({ sub }) => {
if (sub !== "audit") {
const d = await api("log");
return d && typeof d === "object" ? d : { lines: [] };
}
// שרת ישן בלי audit → "לא זמין"; שגיאה אחרת מוצגת בתוך הכרטיס
try {
const r = await apiSoft("audit" + (by ? "?by=" + enc(by) : ""));
return r === null ? { missing: true } : (r && typeof r === "object" ? r : { items: [] });
} catch (e) {
if (e && e.status === 401) throw e;
return { err: (e && e.message) || String(e) };
}
},
render: (d, { sub }) => sub === "audit" ? renderAudit(d) : renderServer(d),
// ציור מחדש (חיפוש, סינון) – בלי להריץ שוב את אנימציית הכניסה של הדף
after: main => {
const s = show._seq;
if (s === painted) { const pg = main && main.firstElementChild; if (pg && pg.classList.contains("page")) pg.style.animation = "none"; }
painted = s;
},
css: ".t-log .aud>.tbl{min-width:560px}.t-log .aud td:nth-child(2){white-space:nowrap}.t-log .aud{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:var(--r3)}.t-log .list.log time{flex:none;margin-inline-end:10px;color:var(--mut);font-size:.84rem}.t-log .list.log li{align-items:flex-start}.t-log .list.log li.bad .grow{color:var(--bad)}",
});
})();

// ===== 90-boot.js =====
// ===================================================================
// הפעלה: מאזינים (Core.init), מעטפת (Shell.init), העדפות, זהות ראשונית,
// ואז Core.start() – רצף ההפעלה לפי ARCH §3/§5:
//   Worker  → קו מקומי אחד (עוגייה) → Line.select → Shell.startLine
//   מרוחק  → Auth.init (העברת מפתחות ישנים) → #t= / #g= (Auth.handoff)
//            → יש כניסת מרכז: portalApi("me") → Line.list (מיזוג הקווים הוותיקים,
//              לבעלים גם כשלא הוחזרו) → הסרת קווים שדוחים את החשבון + טוסט "waiting"
//              → מרכז (#/hub/<view>) או קו (#/<slug>/<tab>[/<sub>], #line=, #tab ישן)
//            → אחרת אסימון לקו של הכתובת (או גוגל בתוקף) → קו יחיד
//            → אחרת Auth.showLogin()
//   ובסוף Version.start() (ריענון כשעולה גרסה חדשה של הדף).
// סנכרון בין לשוניות (storage) נרשם ב-Core.init.
// ===================================================================
function boot() {
// קריאה שלא תפיל את ההפעלה כולה
const safe = fn => { try { return fn(); } catch (e) { console.error(e); } };
safe(() => Core.init());
safe(() => Shell.init());
safe(() => Prefs.apply());
safe(() => Theme.icon());
// זהות ראשונית עד ש-whoami / המרכז עונים
safe(() => {
if (WORKER) Shell.setLine({ name: LINE_NAME_DEFAULT, label: LINE_DEFAULT });
else if (Line.isCenterPath()) { Shell.setLine({ name: CENTER_NAME, label: "" }); document.title = CENTER_NAME; }
else if (URL_SLUG) Shell.setLine({ name: "טוען…", label: "" });
else { const d = Line.urlDefault(); Shell.setLine({ name: d.name, label: d.label }); }
});
safe(() => Shell.renderNav());
// רצף ההפעלה (אסינכרוני)
let p;
try { p = Core.start(); } catch (e) { p = Promise.reject(e); }
Promise.resolve(p).catch(e => {
console.error(e);
if (REMOTE) safe(() => Auth.showLogin((e && e.message) || "לא ניתן להתחבר"));
else safe(() => toast((e && e.message) || "שגיאה בהפעלה", true));
safe(() => Version.start());
});
}
boot();</script></body></html>
