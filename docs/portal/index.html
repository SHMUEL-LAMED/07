// ---------- ציור ----------
const nav = a => !!a && (a.kind === "navigate" || a.kind === "open_member");
// פעולות שדורשות הקלדת "כן"
const isWide = a => !!a && ((a.kind === "act" && a.a && a.a.type === "broadcast") || (a.kind === "tzintuk" && a.list === "members") || (a.kind === "pm" && a.list === "members") || (a.kind === "event" && a.op === "tz_missing"));
const at = m => m.at ? h`<time class="num ltr">${hhmm(m.at)}</time>` : "";
const actCard = (a, mi, i) => h`<div class="acard${a.done ? " done" : ""}"><span>${a.done ? "✓ " : ""}${a.desc || a.kind || ""}${!a.done && isWide(a) ? h` <small class="pill warn">פעולה רחבה</small>` : ""}</span>${a.done ? "" : h`<button type="button" class="btn s p" data-x="airun" data-i="${mi * 100 + i}">${nav(a) ? "פתיחה" : "ביצוע"}</button>`}</div>`;
const bubble = (m, mi) => {
if (m.role === "user") return h`<div class="ai-msg me"><div class="bub me">${m.text || ""}</div><div class="ai-meta">${at(m)}</div></div>`;
if (m.busy) return h`<div class="ai-msg ai"><div class="bub ai"><span class="typing" role="img" aria-label="חושב…"><i></i><i></i><i></i></span></div></div>`;
if (m.err) return h`<div class="ai-msg ai"><div class="bub err">${m.text || "שגיאה"}</div><div class="ai-meta">${at(m)}<button type="button" data-ui="ai-retry" data-i="${mi}">↻ לנסות שוב</button></div></div>`;
const acts = Array.isArray(m.actions) ? m.actions : [];
return h`<div class="ai-msg ai"><div class="bub ai">${m.text || ""}</div><div class="ai-meta">${at(m)}<button type="button" data-ui="ai-copy" data-i="${mi}">⧉ העתקה</button></div>${acts.map((a, i) => a && typeof a === "object" ? actCard(a, mi, i) : "")}</div>`;
};
const hello = () => h`<div class="ai-hello"><span class="ai-ava" aria-hidden="true">${ico("bot")}</span><b>במה אפשר לעזור?</b><p>שואלים על מה שקורה בקו, או מבקשים פעולה. אני מכין אותה, ואתם מאשרים בלחיצה.</p><div>${SUG.map(q => h`<button type="button" class="aisug" data-x="aisug" data-q="${q}">${q}</button>`)}</div></div>`;
// רשימה, הצעות לפי לשונית, גלילה לסוף, שמירה
const draw = () => {
load();
const p = build(); if (!p) return;
const l = $("#ail", p), c = $("#aictx", p);
l.innerHTML = String(state.ai.length ? h`${state.ai.map(bubble)}` : hello());
const list = CTX[state.tab] || CTX.home;
c.innerHTML = String(h`${list.map(q => h`<button type="button" data-x="aisug" data-q="${q}">${q}</button>`)}`);
l.scrollTop = l.scrollHeight;
save();
};

// ---------- פתיחה וסגירה ----------
const stopMic = () => {
if (rec) { try { rec.onend = null; rec.onerror = null; rec.abort ? rec.abort() : rec.stop(); } catch {} }
rec = null;
const p = panel(), mb = p && $(".ai-mic", p);
if (mb) mb.classList.remove("on");
};
const stopVoice = () => { try { if (voice) voice.pause(); } catch {} voice = null; };
const toggle = on => {
const p = build(); if (!p) return;
const open = on === undefined ? p.hidden : !!on;
if (open && !usable()) { if (state.ro && state.view === "line") toast(RO_MSG, true); return; }
if (open) {
load();
p.hidden = false;
draw();
setTimeout(() => { const q = $("#aiq", p); if (q && !p.hidden) try { q.focus(); } catch {} }, 50);
} else {
const had = p.contains(document.activeElement);
p.hidden = true;
stopMic();
if (had) { const f = fab(); try { if (f && !f.hidden) f.focus(); } catch {} }
}
const f = fab(); if (f) f.setAttribute("aria-expanded", p.hidden ? "false" : "true");
};

// ---------- שליחה ----------
const send = async q => {
q = String(q || "").trim(); if (!q) return;
if (!usable()) { if (state.ro) toast(RO_MSG, true); return; }
load();
if (!isOpen()) toggle(true);
const history = state.ai.filter(m => m && !m.busy && !m.err).slice(-MAX_HIST).map(m => {
let text = m.text || "";
if (m.role === "model" && Array.isArray(m.actions) && m.actions.length) text += "\n[הצעתי: " + m.actions.map(a => (a && (a.desc || a.kind)) || "").join("; ") + "]";
return { role: m.role === "user" ? "user" : "model", text };
});
const um = { role: "user", text: q };
push(um);
const wait = { role: "model", busy: true };
push(wait); draw();
const g = gen, line = Line.cur;
let msg;
pending++;
try {
const r = await api("ai", { q, history });
msg = { role: "model", text: (r && r.answer) || "", actions: r && Array.isArray(r.actions) ? r.actions.filter(a => a && typeof a === "object") : [] };
} catch (e) {
msg = { role: "model", err: true, text: (e && e.message) || "שגיאה" };
} finally { pending--; }
// בינתיים עברו קו או פתחו שיחה חדשה – התשובה לא שייכת לשיחה הזו.
// במעבר קו השאלה נשארת בהיסטוריה של הקו – מסמנים שהתשובה בוטלה (בשיחה חדשה אין התאמה ולא נוסף כלום)
if (g !== gen || Line.cur !== line) { lostAnswer(line, um); return; }
const i = state.ai.indexOf(wait); if (i > -1) state.ai.splice(i, 1);
push(msg); draw();
// פעולה יחידה של ניווט/כרטיס חבר – מבוצעת מיד
if (msg.actions && msg.actions.length === 1 && nav(msg.actions[0])) {
try { if (await exec(msg.actions[0]) !== false) { msg.actions[0].done = true; if (g === gen) draw(); } }
catch (e) { if (!(e && e.status === 401)) toast((e && e.message) || "שגיאה", true); }
}
};

// ---------- ביצוע פעולה מוצעת (מחזיר false אם בוטל או לא תקין) ----------
const exec = async a => {
const line = Line.cur;
const ok = msg => Dlg.confirm(msg || a.desc || "לבצע?");
const wide = msg => Dlg.confirm2(msg || a.desc || "לבצע?");
// אחרי חלון אישור – לוודא שעדיין באותו קו
const same = () => Line.cur === line && state.view === "line";
let r;
switch (a.kind) {
case "navigate":
if (TABS_OK.indexOf(a.tab) < 0) return false;
show(a.tab); return true;
case "open_member":
if (!a.phone) return false;
openMember(String(a.phone)); return true;
case "act": {
const x = a.a || {};
if (!(x.type === "broadcast" ? await wide(describe(x)) : await ok(describe(x)))) return false;
if (!same()) return false;
r = await api("act", { a: x });
toast((r && r.r) || "בוצע");
break;
}
case "tzintuk":
if (!(a.list === "members" ? await wide() : await ok())) return false;
if (!same()) return false;
r = await api("tzintuk", { list: a.list });
if (r && r.deferred) toast("שבת/חג: יישלח במוצאי שבת/חג");
else if (r && r.ok) toast("הצינתוק נשלח");
else toast("ימות לא אישרו", true);
break;
case "tz_phones":
if (!await ok()) return false;
if (!same()) return false;
r = await api("tz_phones", { phones: a.phones || [] });
toast(r && r.deferred ? "יישלח במוצאי שבת/חג" : "נשלח ל-" + ((r && r.count) || 0));
break;
case "pm": {
toast("יוצר את הקול…");
const t = await api("tts", { text: a.text || "" });
if (!same()) return false;
stopVoice();
try { voice = new Audio(previewUrl(t.id)); const pp = voice.play(); if (pp && pp.catch) pp.catch(() => {}); } catch {}
const m = (a.desc || "") + "\n\n(הקול מתנגן עכשיו, " + ((t && t.seconds) || 0) + " שניות) לשלוח?";
if (!(a.list === "members" ? await wide(m) : await ok(m)) || !same()) { stopVoice(); return false; }
r = await api("send_pm", a.list ? { id: t.id, list: a.list } : { id: t.id, phones: a.phones || [] });
toast("ההודעה תגיע ל-" + ((r && r.count) || 0) + " תיבות");
break;
}
case "schedule2": {
if (!await ok()) return false;
if (!same()) return false;
const b = {};
Object.keys(a).forEach(k => { if (k !== "kind" && k !== "desc" && k !== "done" && k.charAt(0) !== "_") b[k] = a[k]; });
await api("schedule2", b);
toast("התזמון נקבע");
break;
}
case "block":
if (!await ok()) return false;
if (!same()) return false;
await api("block", { phone: a.phone, on: a.on });
toast("עודכן");
break;
case "lists":
if (!await ok()) return false;
if (!same()) return false;
await api("lists", { list: a.list, phone: a.phone, on: a.on });
toast("עודכן");
break;
case "event":
if (!(a.op === "tz_missing" ? await wide() : await ok())) return false;
if (!same()) return false;
// השדה details של העוזר נשלח בשם desc
await api("event", { op: a.op, title: a.title, desc: a.details, phone: a.phone, name: a.name });
toast("בוצע");
break;
case "unsched":
if (!await ok()) return false;
if (!same()) return false;
await api("unsched", { id: a.id });
toast("התזמון בוטל");
break;
default:
return false;
}
// אחרי ביצוע: מחיקת המטמון וטעינה מחדש של הלשונית
if (same()) { state.data = {}; show(state.tab, true, state.sub); }
return true;
};
// ביצוע לפי אינדקס (הודעה*100 + פעולה); שגיאות עולות ל-Actions.run (טוסט אדום)
const run = async idx => {
load();
if (!usable() || !(idx >= 0)) return;
const g = gen, line = Line.cur, ai = idx % 100;
const m = state.ai[Math.floor(idx / 100)];
const a = m && Array.isArray(m.actions) ? m.actions[ai] : null;
if (!a || a.done || running.has(a)) return;
running.add(a);
try {
if (await exec(a) !== false) {
a.done = true;
if (g === gen) draw();
// הפעולה בוצעה אבל בינתיים עברו קו – מסמנים "בוצע" בהיסטוריה של הקו, שלא יבצעו פעמיים
else patch(line, arr => {
const x = arr.find(y => sameMsg(y, m));
const xa = x && Array.isArray(x.actions) ? x.actions[ai] : null;
if (!xa || typeof xa !== "object" || xa.done) return false;
xa.done = true;
return true;
});
}
} finally { running.delete(a); }
};

// ---------- הקלדה בקול ----------
const mic = btn => {
if (!SR || !btn) return;
if (rec) { try { rec.stop(); } catch {} return; }
const p = panel(), q = p && $("#aiq", p);
const fail = () => { btn.classList.remove("on"); rec = null; toast("לא הצלחתי לשמוע. אפשר להקליד", true); };
try {
const r = new SR();
rec = r;
r.lang = "he-IL"; r.interimResults = true;
r.onresult = e => {
let s = "";
for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript;
if (q) q.value = s;
};
r.onend = () => {
btn.classList.remove("on");
if (rec === r) rec = null;
const f = p && $("#aif", p);
// שליחה אוטומטית בסוף הדיבור
if (q && q.value.trim() && f && isOpen()) {
if (f.requestSubmit) f.requestSubmit();
else { const v = q.value; q.value = ""; send(v); }
}
};
r.onerror = () => toast("לא הצלחתי לשמוע. אפשר להקליד", true);
btn.classList.add("on");
r.start();
} catch { fail(); }
};

// ---------- פקודות data-ui="ai-*" ----------
const ui = (name, el) => {
load();
const i = el && el.dataset && el.dataset.i !== undefined ? +el.dataset.i : -1;
if (name === "ai-close") toggle(false);
else if (name === "ai-new") {
gen++;
state.ai = []; draw();
const q = $("#aiq"); if (q) try { q.focus(); } catch {}
} else if (name === "ai-wide") {
const p = panel(); if (!p) return;
const on = p.classList.toggle("wide");
if (el && el.setAttribute) el.setAttribute("aria-pressed", on ? "true" : "false");
} else if (name === "ai-mic") mic(el);
else if (name === "ai-copy") {
const m = state.ai[i];
if (m && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(m.text || "").then(() => toast("הועתק"), () => {});
} else if (name === "ai-retry") {
if (state.ro) { toast(RO_MSG, true); return; }
// השאלה שלפני בועת השגיאה (בדרך כלל האחרונה; אחרי מעבר קו אולי נשאלו עוד שאלות אחריה)
let u = -1;
const from = i > -1 && state.ai[i] && state.ai[i].err ? i - 1 : state.ai.length - 1;
for (let k = from; k >= 0; k--) if (state.ai[k] && state.ai[k].role === "user") { u = k; break; }
if (u < 0) return;
const q = state.ai[u].text;
if (i > u && state.ai[i] && state.ai[i].err) state.ai.splice(i, 1);
state.ai.splice(u, 1);
send(q);
}
};

// ---------- מעבר קו / מרכז ----------
// נקרא לפני המעבר (Core.resetLine מאפס את state.ai אחריו)

loadedBase = null;

const q = $("#aiq", p); if (q) q.value = "";
}

if (f) { f.hidden = !next; f.setAttribute("aria-expanded", "false"); }
};

// לא לרענן את הדף אוטומטית בזמן הקלטה או כשתשובה בדרך
const busy = () => !!rec || pending > 0;
return { toggle, send, run, draw, ui, isOpen, reset, sync, exec, busy };

const body = h`<div class="list hm-att">${k.pending.map(x => row(x.name || x.k || "", +x.n || 0))}${row("בקשות הצטרפות", k.joins)}${extra}</div>${k.todo > 0 ? h`<div class="btns hm-cta"><button type="button" class="btn p" data-go="pending">לטיפול בממתינות ←</button></div>` : h`<p class="hm-ok">${ico("check")} הכול טופל – אין כרגע מה לאשר</p>`}`;
return card({ title: "ממתין לטיפול", small: "שלוחה 7", cls: k.todo ? "hl" : "", body });
};

// ---------- פעולות מהירות + קיצורי דרך ----------
const quick = (d, k) => {
const nj = arr(d.jobs).length, mt = +k.mem.total || 0;
const undo = d.undo && typeof d.undo === "object" ? d.undo : null;
const ln = (go, t, s) => h`<button type="button" class="hm-ln" data-go="${go}"><span class="hm-lni" aria-hidden="true">${ico(go)}</span><span class="hm-lnt"><b>${t}</b><small>${s}</small></span></button>`;
const body = h`<div class="btns hm-acts"><button type="button" class="btn w-only" data-x="home.tz" data-list="members">📣 צינתוק לכל החברים</button><button type="button" class="btn w-only" data-x="home.tz" data-list="admins">צינתוק למנהלים</button>${undo
? actBtn({ type: "undo" }, "↶ ביטול: " + (undo.desc || ""), "d")
: h`<span class="mut small">אין פעולה לביטול</span>`}</div><h3>קיצורי דרך</h3><nav class="hm-links" aria-label="קישורים מהירים">${[
ln("pending", "ממתינות", k.todo === 0 ? "הכול טופל" : k.todo === 1 ? "אחת מחכה" : k.todo + " מחכות"),
ln("studio", "אולפן השידור", "מקליטים ומכינים"),
ln("members", "החברים", mt + " בקבוצה"),
ln("sched", "תזמונים", nj ? nj + " בתור" : "אין בתור"),
ln("live", "בקרה חיה", "מי בקו ומה קורה"),
ln("reports", "דוחות", "מבינים את הקו"),
]}</nav>`;
return card({ title: "פעולות מהירות", body });
};

// ---------- מי בקו עכשיו (מתעדכן מהדופק) ----------
const onlineInner = list => {
list = arr(list);
const body = list.length
? h`<ul class="list hm-online">${list.map(c => h`<li><span class="av s" aria-hidden="true">${initial(c.n, c.p)}</span><div class="li-main">${who(c.n, c.p)}${c.w ? h`<span class="meta hm-w">${c.w}</span>` : ""}</div>${c.id ? h`<div class="acts"><button type="button" class="btn s d w-only" data-x="hangup" data-id="${c.id}" data-phone="${c.p || ""}" data-name="${c.n || fmtLine(c.p) || ""}">ניתוק</button></div>` : ""}</li>`)}</ul>`
: empty({ icon: "wave", text: "אף אחד לא מחובר כרגע" });
return h`<div class="card-h"><h2>מי בקו עכשיו</h2>${pill(list.length, list.length ? "ok" : "")}<small>מתעדכן כל 20 שניות</small><div class="acts"><button type="button" class="btn s g" data-go="live">לבקרה החיה</button></div></div>${body}`;
};

// ---------- תזמונים קרובים והאירוע ----------
const upcoming = d => {
const jobs = arr(d.jobs), ev = d.event && typeof d.event === "object" ? d.event : null;
const list = jobs.length
? h`<ul class="list hm-jobs">${jobs.map(j => h`<li><span class="pill info num ltr nowrap">${fmtD(j.at)}</span><span class="li-main hm-jt">${jobText(j)}</span></li>`)}</ul>`
: empty("אין הודעות מתוזמנות");
let evb;
if (ev && ev.title) {
const c = +ev.count || 0, t = +ev.total || 0, pc = t ? Math.min(100, Math.round(100 * c / t)) : 0;
evb = h`<div class="hm-ev"><p><b>${ev.title}</b> ${ev.desc ? h`<span class="mut">${ev.desc}</span>` : ""}</p><span class="meter" role="img" aria-label="${"נרשמו " + c + " מתוך " + t}"><i style="width:${pc}%"></i></span><p class="small">נרשמו ${c} מתוך ${t} חברים</p></div>`;
} else evb = empty("אין אירוע פעיל");
return h`<div class="card"><div class="card-h"><h2>תזמונים קרובים</h2><div class="acts"><button type="button" class="btn s g" data-go="sched">לכל התזמונים</button></div></div>${list}<div class="card-h hm-sec"><h2>האירוע בשלוחה 9</h2><div class="acts"><button type="button" class="btn s g" data-go="event">לאירוע</button></div></div>${evb}</div>`;
};

// ---------- מושתקים ומנהלים ----------
const people = d => {

const ml = muted.length
? h`<ul class="list">${muted.map(m => h`<li><div class="li-main">${who(m.n, m.p)}${m.until ? h`<span class="meta">עד <span class="num ltr">${fmtD(m.until)}</span></span>` : ""}</div><div class="acts">${actBtn({ type: "unmute", phone: m.p }, "ביטול השתקה")}</div></li>`)}</ul>`
: empty("אף אחד לא מושתק");
const al = admins.length
? h`<div class="chips">${admins.map(a => chip(a.n || fmtLine(a.p)))}</div>`
: empty();
return h`<div class="card"><div class="card-h"><h2>מושתקים</h2><small>הודעות שלהם מחכות לאישור</small></div>${ml}<div class="card-h hm-sec"><h2>מנהלים</h2></div>${al}</div>`;

// ===== 21-pending.js =====
// לשונית "ממתינות" (pending) – הודעות ובקשות הצטרפות שמחכות להחלטה (כמו שלוחה 7-4)
(() => {
// מקשים כמו בשלוחה 7-4: 1 חשובה, 2 רגילה, 3 מחיקה
const KIND_ACTS = {
default: [["1", "חשובה + צינתוק", "p"], ["2", "רגילה", ""], ["3", "מחיקה", "d"]],
demoted: [["1", "להעביר לחשובות", "p"], ["2", "להשאיר ברגילות", ""], ["3", "למחוק מהקו", "d"]],
join: [["3", "מחיקת הבקשה", "d"]],
};
// רשימות בטוחות מהתשובה (שרת ישן / שדה חסר)
const lists = d => ((d && Array.isArray(d.lists)) ? d.lists : []).filter(l => l && typeof l === "object").map(l => ({
k: String(l.k || ""), name: l.name || l.k || "", folder: String(l.folder || ""),
files: (Array.isArray(l.files) ? l.files : []).filter(f => f && f.name),
}));
const total = d => lists(d).reduce((s, l) => s + l.files.length, 0);
const anchor = k => "pd-" + String(k || "x").replace(/[^a-z0-9_-]/gi, "");

// שורת קובץ אחת
const fileRow = (l, f) => {
const isJoin = l.k === "join";
const head = isJoin
? h`<b>בקשה ${String(f.name).replace(".wav", "")}</b> ${f.p ? phone(f.p) : h`<span class="mut">מספר לא ידוע</span>`}`
: who(f.n, f.p);
const acts = (KIND_ACTS[l.k] || KIND_ACTS.default).map(([code, label, cls]) =>
h`<button type="button" class="btn s w-only${cls ? " " + cls : ""}" data-x="pending.review" data-kind="${l.k}" data-file="${f.name}" data-code="${code}" data-label="${label}">${label}</button>`);
const join = isJoin
? h`<form class="row pd-join w-only" data-xf="pending.join" data-file="${f.name}"><input name="name" placeholder="שם מלא (אפשר להשאיר ריק – השם יזוהה מההקלטה)" aria-label="שם מלא" autocomplete="off"><button type="submit" class="btn s p">אישור הצטרפות</button></form>`
: "";
return h`<div class="msg pd-item" data-file="${f.name}"><div class="head">${head}${f.date ? h`<span class="mut small num ltr">${fmtD(f.date)}</span>` : ""}${f.dur ? h`<span class="pill num">${fmtDur(f.dur)}</span>` : ""}</div>${audio(l.folder + "/" + f.name)}${transcript(f.t)}${join}<div class="row acts">${acts}</div></div>`;
};

const SWITCHED = "הקו הוחלף בזמן האישור – הפעולה בוטלה";
// אחרי פעולה: הודעת השרת ורענון (רק אם עדיין באותו קו)
const done = (r, line) => {
if (Line.cur !== line) return;
const m = r && r.msg;
if (m) toast(m);
return refreshTabs("pending");
};

}

const r = await api("review", { kind, file, act: code });

});

// הדופק מראה שהמספר השתנה מאז הטעינה – מציעים רענון (בלי לגעת בטפסים)
onPulse: (p, root, d) => {

const now = (+p.pending || 0) + (+p.joins || 0), was = total(d);

`,
});

// ===== 22-msgs.js =====
// לשונית "הודעות" (msgs) – כל ההודעות בקו: חיפוש, סינון, נגן, הערות מנהל, תיקון תמלול, פעולות על כמה הודעות ו-ZIP
(() => {
const BATCH = 5;            // השרת מגביל ל-5 הודעות בבקשה (מגבלת הפניות לימות)
const ZIP_MAX = 40;         // השרת חותך ל-40 נתיבים
const MORE_N = 1000;
const BAD = /לא מצאתי|לא נמצאת|כבר נמצאת/;
const ONLY = [["", "הכול"], ["imp", "רק חשובות"], ["notr", "בלי תמלול"], ["note", "עם הערה"]];
const pathOf = id => "/1/2/" + id + ".wav";
const list = d => ((d && d.list) || []).filter(m => m && m.id !== undefined && m.id !== null && m.id !== "");
const noteOf = id => (state.notes && state.notes.msg && state.notes.msg[id]) || null;
const cached = () => state.data[Core.key("msgs", "")];
// טעינה אחרונה ושמירת הערה אחרונה – טעינה ישנה לא דורסת הערות ובחירה
let loadN = 0, painted = -1;
// מונה שמירות הערות משותף (גם לכרטיס החבר) – טעינה ישנה לא דורסת הערה חדשה
const ngen = () => state.notesGen || 0, nbump = () => { state.notesGen = ngen() + 1; };

// הערות המנהל (soft – שרת ישן או שגיאה → בלי הערות)
const setNotes = n => {
state.notes = (n && n.notes && typeof n.notes === "object") ? n.notes : { msg: {}, member: {} };
if (!state.notes.msg || typeof state.notes.msg !== "object") state.notes.msg = {};
if (!state.notes.member || typeof state.notes.member !== "object") state.notes.member = {};
};

// סינון בצד הלקוח: טקסט חופשי + "רק…"
const hit = (m, q) => { const nt = noteOf(String(m.id)); return !q || [m.id, m.n, m.p, m.t, nt && nt.t].join(" ").includes(q); };
const pass = (m, only) => only === "imp" ? !!m.imp : only === "notr" ? !m.t : only === "note" ? !!noteOf(String(m.id)) : true;
const shown = d => {
const q = String(state.filter.msgs || "").trim(), only = state.filter.msgOnly || "";
return list(d).filter(m => hit(m, q) && pass(m, only));
};
// כמה מההודעות שנבחרו לא מוצגות בסינון הנוכחי
const hiddenSel = () => {
const d = cached();
if (!state.sel.size || d === undefined) return 0;
const vis = new Set(shown(d).map(m => String(m.id)));
return Array.from(state.sel).filter(id => !vis.has(id)).length;
};
const selText = () => { const k = hiddenSel(); return state.sel.size + " נבחרו" + (k ? " (" + k + " מוסתרות)" : ""); };

// עדכון סרגל הבחירה בלי ציור מחדש
const updBatch = () => {
const b = $("#batch"), n = $("#bn");
if (b) b.hidden = !state.sel.size;
if (n) n.textContent = selText();
$$("#main .msg[data-id]").forEach(el => el.classList.toggle("picked", state.sel.has(el.dataset.id)));
};

// הודעה אחת
const msgRow = m => {
const id = String(m.id), nt = noteOf(id), on = state.sel.has(id);
const sender = (m.n || m.p) ? who(m.n, m.p) : h`<b class="mut">הודעה מהמערכת</b>`;
const move = m.imp
? actBtn({ type: "move", id, to: "regular" }, "הוצאה מהחשובות")
: actBtn({ type: "move", id, to: "important" }, "העברה לחשובות + צינתוק");
return h`<article class="msg${on ? " picked" : ""}" data-id="${id}">
<div class="head"><input type="checkbox" class="sel w-only" data-xc="msgs.sel" data-id="${id}" aria-label="${"בחירת הודעה " + id}"${on ? raw(" checked") : ""}>${pill(id, m.imp ? "acc" : "")}<span>${sender}</span><span class="mut small num ltr nowrap">${fmtD(m.date)}</span>${m.dur ? h`<span class="mut small num nowrap">${fmtDur(m.dur)}</span>` : ""}${m.imp ? pill("חשובה", "acc") : ""}</div>
<div class="acts">${playBtn(pathOf(id))}<button type="button" class="btn s icon" data-dl="${"download?p=" + enc(pathOf(id))}" data-fn="${id + ".wav"}" title="הורדה" aria-label="הורדה">${ico("download")}</button>${move}${actBtn({ type: "delete", id }, "מחיקה", "d")}<button type="button" class="btn s g w-only" data-x="msgs.note" data-kind="msg" data-key="${id}">📝 הערה</button><button type="button" class="btn s g w-only" data-x="msgs.fixtr" data-id="${id}">✎ תמלול</button>${m.p ? h`<button type="button" class="btn s g icon" data-card="${m.p}" title="כרטיס חבר" aria-label="כרטיס חבר">${ico("user")}</button>` : ""}</div>
${nt ? h`<div class="note">📝 ${nt.t} (${fmtD(nt.d)})</div>` : ""}
${m.t ? transcript(m.t) : h`<div class="mut small">אין תמלול (עדיין)</div>`}
</article>`;
};

// סרגל הפעולות על ההודעות שנבחרו (צף בתחתית)
const batchBar = () => h`<div class="batch w-only" id="batch" role="toolbar" aria-label="פעולות על ההודעות שנבחרו"${state.sel.size ? "" : raw(" hidden")}><b id="bn">${selText()}</b><button type="button" class="btn s d" data-x="msgs.batch" data-op="delete">מחיקה</button><button type="button" class="btn s" data-x="msgs.batch" data-op="important">לחשובות</button><button type="button" class="btn s" data-x="msgs.batch" data-op="regular">הוצאה מהחשובות</button><button type="button" class="btn s" data-x="msgs.zip">${ico("download")} ZIP</button><button type="button" class="btn s" data-x="msgs.selall">בחירת כל המוצגות</button><button type="button" class="btn s" data-x="msgs.selnone">ניקוי</button></div>`;

// ---------- פעולות ----------
// טעינת עד 1000 ההודעות האחרונות (נשמר עד מעבר קו)
Actions.register("msgs.more", () => { state.msgN = MORE_N; return show("msgs", true); }, { write: false });
// ביטול "רק…" (כשהוא מסתיר את תוצאות החיפוש)
Actions.register("msgs.allOnly", () => { state.filter.msgOnly = ""; Tabs.rerender(); }, { write: false });

// סימון הודעה (בחירה בלבד – לא כתיבה)
Actions.change("msgs.sel", el => {
const id = el.dataset.id; if (!id) return;
if (el.checked) state.sel.add(id); else state.sel.delete(id);
updBatch();
});
// בחירת כל ההודעות המוצגות (אחרי הסינון)
Actions.register("msgs.selall", () => {
$$('#main [data-xc="msgs.sel"]').forEach(c => { c.checked = true; if (c.dataset.id) state.sel.add(c.dataset.id); });
updBatch();
}, { write: false });
Actions.register("msgs.selnone", () => {
state.sel.clear();
$$('#main [data-xc="msgs.sel"]').forEach(c => { c.checked = false; });
updBatch();
}, { write: false });

// פעולה על כמה הודעות – במנות של 5
Actions.register("msgs.batch", async el => {
const op = el.dataset.op, ids = Array.from(state.sel), N = ids.length, line = Line.cur;
if (!N || !line || ["delete", "important", "regular"].indexOf(op) < 0) return;
const k = hiddenSel(), hid = k ? " (" + k + " מהן לא מוצגות בסינון הנוכחי)" : "";
const q = op === "delete" ? "למחוק " + N + " הודעות מהקו" + hid + "? (אפשר לשחזר מסל המחזור)"
: op === "important" ? "להעביר " + N + " הודעות לחשובות" + hid + " ולשלוח צינתוק לכולם?"
: "להוציא " + N + " הודעות מהחשובות" + hid + "?";
const ok = op === "regular" ? await Dlg.confirm(q) : await Dlg.confirm2(q);
// הקו הוחלף בזמן האישור – לא לגעת בקו החדש
if (Line.cur !== line) { if (ok) toast("הקו הוחלף – הפעולה בוטלה", true); return; }
if (!ok) return;
const res = [];
try {
await runChunks(ids, BATCH, async chunk => {
if (Line.cur !== line) throw new Error("הקו הוחלף באמצע הפעולה – הפעולה נעצרה");
const r = await api("batch", { ids: chunk, op });
((r && r.results) || []).forEach(x => res.push(x));
}, done => toast("מבצע… " + Math.min(done + BATCH, N) + " מתוך " + N));
} finally {
if (Line.cur === line) {
const bad = res.filter(x => !x || x.error || BAD.test(String(x.r || ""))).length, good = res.length - bad;
if (res.length) toast("בוצע על " + good + " הודעות" + (bad ? ", " + bad + " לא בוצעו" : ""), bad > 0);
state.sel.clear();
refreshTabs("msgs");
}
}
});

// הורדת ההקלטות שנבחרו כ-ZIP (עד 40)
// zip הוא POST בשרת (נדחה לצפייה בלבד ולמפתח בלי write) – לכן מסומן כפעולת כתיבה
Actions.register("msgs.zip", async () => {
const ids = Array.from(state.sel);
if (!ids.length) return;
if (ids.length > ZIP_MAX) toast("אפשר להוריד עד 40 הקלטות בקובץ אחד – יורדות 40 הראשונות", true);
try { await apiFile("zip", { paths: ids.slice(0, ZIP_MAX).map(pathOf) }, "messages.zip"); }
catch (e) { if (e && e.status === 403) throw new Error("להורדת ZIP צריך הרשאת כתיבה"); throw e; }
});

// הערת מנהל על הודעה (ריק = מחיקה)
Actions.register("msgs.note", async el => {
const kind = el.dataset.kind || "msg", key = el.dataset.key || "";
if (!key) return;
const line = Line.cur;
if (!line) return;
const cur = state.notes && state.notes[kind] && state.notes[kind][key];
const text = await Dlg.prompt("הערת מנהל (ריק = מחיקה)", (cur && cur.t) || "");
if (text === null) return;
if (Line.cur !== line) { toast("הקו הוחלף – ההערה לא נשמרה", true); return; }
nbump();
const r = await api("notes", { kind, key, text });
if (Line.cur !== line) return;
if (r && r.notes) { nbump(); setNotes(r); }
Tabs.rerender();
toast(String(text).trim() ? "ההערה נשמרה" : "ההערה נמחקה");
});

// תיקון תמלול
Actions.register("msgs.fixtr", async el => {
const id = el.dataset.id || "", line = Line.cur;
const m = list(cached()).filter(x => String(x.id) === id)[0];
if (!m || !line) return;
const text = await Dlg.prompt("תיקון התמלול של הודעה " + id, m.t || "");
if (text === null) return;
if (Line.cur !== line) { toast("הקו הוחלף – התמלול לא נשמר", true); return; }
await api("transcript", { id, text });
if (Line.cur !== line) return;
m.t = String(text).trim();
Tabs.rerender();
toast("התמלול עודכן");
});

// ---------- הלשונית ----------
Tabs.register({
id: "msgs",
label: "הודעות",
icon: "msgs",
group: "daily",
head: {
sub: "כל ההודעות בקו, עם תמלול, נגן וחיפוש.",
chips: d => [{ n: list(d).length, label: "הודעות נטענו", cls: "" }],
},
aiSug: ["סכם לי את ההודעות האחרונות", "איזו הודעה נשמעה הכי הרבה השבוע?"],
load: async () => {
const line = Line.cur, my = ++loadN, gen = ngen();
// קפיצה מהחיפוש הכללי להודעה ישנה מ-200 האחרונות → טעינת 1000
const q = String(state.filter.msgs || "").trim();
try {
const sm = (q && (state.msgN || 200) < MORE_N && typeof Search !== "undefined" && Array.isArray(Search._msgs)) ? Search._msgs : null;
if (sm && sm.slice(state.msgN || 200).some(m => m && hit(m, q))) state.msgN = MORE_N;
} catch {}
const [d, n] = await Promise.all([api("messages?n=" + (state.msgN || 200)), apiSoft("notes").catch(() => null)]);
// טעינה ישנה (קו אחר / טעינה חדשה יותר / הערה שנשמרה בינתיים) – בלי לגעת בהערות ובבחירה
if (Line.cur === line && my === loadN) {
if (gen === ngen()) setNotes(n);
// בחירה שנשארה מהודעות שכבר לא ברשימה
const have = new Set(list(d).map(m => String(m.id)));
Array.from(state.sel).forEach(id => { if (!have.has(id)) state.sel.delete(id); });
}
return d || { list: [], total: 0 };
},
// ציור מחדש (חיפוש, סינון, הערה) – בלי להריץ שוב את אנימציית הכניסה של הדף
after: main => {
const s = show._seq;
if (s === painted) { const pg = main && main.firstElementChild; if (pg && pg.classList.contains("page")) pg.style.animation = "none"; }
painted = s;
},
render: d => {
const all = list(d), total = Math.max(+(d && d.total) || 0, all.length), rows = shown(d);
const only = state.filter.msgOnly || "", q = String(state.filter.msgs || "").trim();
const filtered = !!(q || only);
const top = h`<div class="card">
<div class="card-h"><h2>הודעות בקו</h2><small>${all.length} מתוך ${total} · מהחדשה לישנה</small>${filtered ? h`<div class="acts">${pill("מוצגות " + rows.length, "info")}</div>` : ""}</div>
<div class="toolbar">${search("msgs", "חיפוש בשם, במספר, בתמלול או בהערה")}<select data-filter="msgOnly" aria-label="סינון הודעות">${ONLY.map(([v, l]) => h`<option value="${v}"${only === v ? raw(" selected") : ""}>${l}</option>`)}</select>${all.length < total && (state.msgN || 200) < MORE_N ? h`<button type="button" class="btn s" data-x="msgs.more">טעינת ${Math.min(total, MORE_N)} האחרונות</button>` : ""}<span class="sp"></span>${dlBtn("export_transcripts", "⬇ ייצוא תמלולים (CSV)", "g", "transcripts.csv")}<button type="button" class="btn s w-only" data-go="studio">🎙 הקלטה והעלאה</button></div>
</div>`;
// אין תוצאות: אולי "רק…" מסתיר אותן, או שהן בהודעות שעוד לא נטענו
const byQ = only && q ? all.filter(m => hit(m, q)).length : 0;
const more = all.length < total && (state.msgN || 200) < MORE_N;
const lbl = (ONLY.filter(x => x[0] === only)[0] || ["", ""])[1];
const hint = byQ ? byQ + " הודעות מתאימות לחיפוש מוסתרות בגלל \"" + lbl + "\"" : more ? "החיפוש נעשה רק ב-" + all.length + " ההודעות האחרונות" : "אפשר לשנות את החיפוש או את הסינון";
const acts = h`${byQ ? h`<button type="button" class="btn s" data-x="msgs.allOnly">הצגת הכול</button>` : ""}${more ? h`<button type="button" class="btn s" data-x="msgs.more">חיפוש ב-${Math.min(total, MORE_N)} האחרונות</button>` : ""}`;
const body = rows.length
? h`<div class="card msgs-list">${rows.map(msgRow)}</div>`
: card({ body: empty(filtered ? { icon: "filter", title: "לא נמצאו הודעות", text: hint, act: byQ || more ? acts : null } : { icon: "msgs", title: "לא נמצאו הודעות" }) });
return h`${top}${body}${batchBar()}`;
},
css: ".t-msgs .msg.picked{margin-inline:-10px;padding-inline:10px;border-radius:var(--r3);background:var(--accbg)}.t-msgs .msg .head .sel{width:18px;height:18px;accent-color:var(--acc)}.t-msgs .page:has(#batch:not([hidden])){padding-bottom:96px}.t-msgs .batch{animation-name:batchin}@keyframes batchin{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%)}}",
});
})();

// ===== 23-trash.js =====
// לשונית "סל מחזור" (trash) – הקלטות שנמחקו מהקו או הוצאו מהחשובות (/DeletedByAdmin)
(() => {
const DIR = "/DeletedByAdmin/";
const SWITCHED = "הקו הוחלף בזמן האישור – הפעולה בוטלה";
// קבצים בטוחים מהתשובה (שדה חסר / שרת ישן)
const files = d => ((d && Array.isArray(d.files)) ? d.files : []).filter(f => f && f.name);

// שורת קובץ אחת
const fileRow = f => {
const path = DIR + f.name;
return h`<div class="msg tr-item" data-file="${f.name}"><div class="head"><span class="tr-ic" aria-hidden="true">${ico("trash")}</span><b class="ltr">${f.name}</b>${f.imp ? pill("מהחשובות", "acc") : ""}${f.date ? h`<span class="mut small num ltr">${fmtD(f.date)}</span>` : ""}${f.dur ? h`<span class="pill num">${fmtDur(f.dur)}</span>` : ""}</div><div class="row acts">${playBtn(path)}${dlBtn("download?p=" + enc(path), "⬇", "", f.name)}<span class="sp hide-m"></span><button type="button" class="btn s w-only" data-x="trash.restore" data-name="${f.name}" data-to="regular">↶ שחזור לרגילות</button><button type="button" class="btn s w-only" data-x="trash.restore" data-name="${f.name}" data-to="important">↶ שחזור לחשובות</button><button type="button" class="btn s d w-only" data-x="trash.purge" data-name="${f.name}">מחיקה לצמיתות</button></div></div>`;
};

// שחזור קובץ לרגילות או לחשובות
Actions.register("trash.restore", async el => {
const name = el.dataset.name || "", to = el.dataset.to === "important" ? "important" : "regular";
if (!name) return;
const line = Line.cur;
if (!await Dlg.confirm("לשחזר את " + name + " ל" + (to === "important" ? "חשובות" : "רגילות") + "?")) return;
// בזמן חלון האישור עברו קו – לא משחזרים קובץ באותו שם בקו האחר
if (Line.cur !== line) throw new Error(SWITCHED);
const r = await api("restore", { name, to });
if (Line.cur !== line) return;
toast("שוחזר כהודעה " + ((r && r.id) || ""));
await refreshTabs("trash");
});

// מחיקה לצמיתות – קובץ אחד או ריקון הסל (השרת מוחק עד 40 בכל קריאה, עד 30 סבבים)
Actions.register("trash.purge", async el => {
const all = el.dataset.all === "1", name = el.dataset.name || "";
if (!all && !name) return;
const line = Line.cur;
const ok = all
? await Dlg.confirm2("למחוק לצמיתות את כל ההקלטות בסל המחזור? אי אפשר לבטל")
: await Dlg.confirm("למחוק לצמיתות את " + name + "?", { danger: true });
if (!ok) return;
// בזמן חלון האישור עברו קו – לא מוחקים בקו האחר
if (Line.cur !== line) throw new Error(SWITCHED);
let n = 0;
try {
for (let i = 0; i < 30; i++) {
const r = await api("purge", all ? { all: true } : { name });
const got = Number(r && r.n) || 0;
n += got;
if (!all || !(r && r.left) || !got) break;
if (Line.cur !== line) break;
toast("נמחקו " + n + ", ממשיך…");
}
} catch (e) {
// כישלון באמצע – מרעננים כדי להציג את הסל העדכני, והליבה מציגה את השגיאה
if (n && Line.cur === line) refreshTabs("trash");
throw e;
}
if (Line.cur !== line) return;
toast("נמחקו " + n + " הקלטות");
await refreshTabs("trash");
});

Tabs.register({
id: "trash",
label: "סל מחזור",
icon: "trash",
group: "daily",
head: {
sub: "הקלטות שנמחקו מהקו או הוצאו מהחשובות. אפשר להחזיר אותן.",
chips: d => [{ n: files(d).length, label: "בסל", cls: "" }],
},
load: () => api("trash"),
render: d => {
const fs = files(d);
const act = fs.length ? h`<button type="button" class="btn s d w-only" data-x="trash.purge" data-all="1">ריקון הסל</button>` : "";
return card({
title: "סל המחזור",
small: fs.length + " הקלטות שנמחקו מהקו או הוצאו מהחשובות",
act,
body: fs.length ? h`<div class="tr-files">${fs.map(fileRow)}</div>` : empty({ icon: "trash", title: "הסל ריק", text: "הקלטות שיימחקו מהקו או יוצאו מהחשובות יופיעו כאן, ואפשר יהיה להחזיר אותן." }),
});
},
css: `
.t-trash .tr-files{margin-top:14px}
.t-trash .tr-ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:var(--r3);background:var(--bg2);color:var(--mut)}
.t-trash .tr-ic .ico{width:16px;height:16px}
.t-trash .tr-item .acts audio{flex:1 1 220px;max-width:360px}
`,
});
})();

// ===== 24-members.js =====
// לשונית "חברים" (members) – טבלה עם חיפוש, סינון ומיון, בחירה ופעולות על כמה חברים, בקשות הצטרפות,
// הוספה וחסימה, ייבוא מקובץ וייצוא, וכרטיס החבר המלא (Shared "openMember")
(() => {
const arr = v => (Array.isArray(v) ? v : []);
const dg = v => String(v === null || v === undefined ? "" : v).replace(/\D/g, "");
const PH = /^0\d{8,9}$/;
const BAD = /לא מצאתי|לא תקין|לא מוכר|שגיאה/;
const TZ_MAX = 200;          // השרת מגביל tz_phones ל-200 מספרים
const IMP_CHUNK = 8;         // השרת מגביל members_import ל-8 שורות בבקשה
const mutedTxt = (label, m) => label + (m && m !== "ללא הגבלה" ? " עד " + fmtD(m) : "");
const isAdm = (r, owner) => !!(r && (r.admin || (owner && r.p === owner)));
const initial = n => { const s = String(n || "").trim(); return s ? s.charAt(0) : "#"; };
const data = () => state.data[Core.key("members", "")] || null;
const rowsOf = d => arr(d && d.rows).filter(r => r && r.p);
// אותו נוסח כמו בייצוא של השרת (members_csv)
const tzCsv = r => r.tz === "on" ? "פעיל" : r.tz === "off" ? "חסם" : "לא ברשימה";
// אותו קו? (לפי slug – כדי שרענון רשימת הקווים לא ייחשב כמעבר קו)
const same = l => !!l && !!Line.cur && Line.cur.slug === l.slug;
const SWITCHED = "הקו הוחלף באמצע הפעולה – הפעולה נעצרה";
// "dd/mm/yyyy hh:mm" או ISO → מפתח מיון
const tkey = s => {
s = String(s || "");
const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})[ T](\d{2}):(\d{2})/);
if (m) return m[3] + "-" + m[2] + "-" + m[1] + " " + m[4] + ":" + m[5];
return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.replace("T", " ").slice(0, 16) : "";
};

// ---------- מצב מקומי (מתאפס במעבר קו) ----------
const SEL = new Set();       // מספרי הטלפון שנבחרו בטבלה
let cur = null;              // הכרטיס הפתוח: { p, hd, seq }
let dirty = false;           // היה שינוי בכרטיס – לרענן את הטבלה בסגירה
let seq = 0;
let imp = null;              // ייבוא מקובץ שמחכה לאישור: { rows, isNew, line, hd }
let lastRows = null;         // השורות שצוירו לאחרונה (כשהנתונים בדיוק בוטלו לפני טעינה מחדש)
Line.onSwitch(() => { SEL.clear(); cur = null; dirty = false; imp = null; lastRows = null; });
// השורות הידועות לבדיקות לפני פעולה על כמה חברים; null = לא ידוע (אז לא מסננים מראש)
const knownRows = () => { const d = data(); return d ? rowsOf(d) : lastRows; };

// ---------- סינון, חיפוש ומיון ----------
const FLT = [
["", "הכול", () => true],
["tz", "בצינתוקים", r => r.tz === "on"],
["notz", "לא ברשימת הצינתוקים", r => r.tz !== "on" && r.tz !== "off"],
["tzoff", "חסמו צינתוקים", r => r.tz === "off"],
["general", "ברגילות", r => !!r.general],
["rsvp", "נרשמו לאירוע", r => !!r.rsvp],
["admin", "מנהלים", (r, owner) => isAdm(r, owner)],
["muted", "מושתקים", r => !!r.muted],
["blocked", "חסומים", r => !!r.blocked],
["quiet", "לא התקשרו החודש", r => !(+r.calls)],
["noname", "ללא שם", r => !r.n],
];
const SORTS = [["", "מיון לפי שם"], ["last", "לפי כניסה אחרונה"], ["calls", "לפי שיחות החודש"]];
const fltOf = st => FLT.filter(f => f[0] === st)[0] || FLT[0];
// חיפוש: שם, מספר (גם עם מקפים/רווחים) או קוד אישי
const match = (r, q) => {
if (!q) return true;
if (((r.n || "") + " " + r.p + " " + (r.code || "")).toLowerCase().includes(q.toLowerCase())) return true;
let qd = dg(q);
// קידומת בינלאומית: +972 / 00972 → 0
if (/^(00)?972\d/.test(qd)) qd = "0" + qd.replace(/^(00)?972/, "");
return !!qd && /^[\d\s()+-]+$/.test(q) && (r.p.includes(qd) || (qd.charAt(0) !== "0" && r.p.includes("0" + qd)));
};
const shownRows = d => {
const st = state.filter.memSt || "", srt = state.filter.memSort || "", q = String(state.filter.members || "").trim();
const f = fltOf(st)[2], owner = d && d.owner;
const out = rowsOf(d).filter(r => f(r, owner) && match(r, q));
if (srt === "last") out.sort((a, b) => tkey(b.last).localeCompare(tkey(a.last)));
else if (srt === "calls") out.sort((a, b) => (+b.calls || 0) - (+a.calls || 0));
return out;
};
const isFiltered = () => !!(state.filter.memSt || String(state.filter.members || "").trim());

// ---------- סרגל הבחירה (בלי ציור מחדש) ----------
const updBatch = () => {
const b = $("#mbatch"), n = $("#mbn");
if (b) b.hidden = !SEL.size;
if (n) n.textContent = SEL.size + " נבחרו";
$$('#main tr[data-p]').forEach(tr => {
const on = SEL.has(tr.dataset.p);
tr.classList.toggle("sel", on);
const c = $('input[data-xc="members.sel"]', tr); if (c) c.checked = on;
});
const all = $('#main input[data-xc="members.selShown"]');
if (all) {
const shown = $$('#main input[data-xc="members.sel"]');
const k = shown.filter(c => c.checked).length;
all.checked = !!shown.length && k === shown.length;
all.indeterminate = k > 0 && k < shown.length;
}
};

// ---------- הטבלה ----------
const nameBtn = (p, n, cls) => n
? h`<button type="button" class="btn s w-only${cls ? " " + cls : ""}" data-x="members.rename" data-p="${p}" data-name="${n}">${cls ? "שינוי שם" : "שם"}</button>`
: h`<button type="button" class="btn s w-only${cls ? " " + cls : ""}" data-x="members.rename" data-p="${p}" data-name="" title="המספר לא ברשימת החברים – הוספה לקבוצה בשם">הוספה לקבוצה</button>`;
const unmuteBtn = p => h`<button type="button" class="btn s w-only" data-x="members.act" data-a="${JSON.stringify({ type: "unmute", phone: p })}">ביטול השתקה</button>`;
const unblockBtn = p => h`<button type="button" class="btn s w-only" data-x="members.block" data-p="${p}" data-on="0">ביטול חסימה</button>`;
const row = (r, owner) => {
const on = SEL.has(r.p), adm = isAdm(r, owner);
const tz = r.tz === "on" ? pill("פעיל", "ok") : r.tz === "off" ? pill("חסם צינתוקים", "bad") : pill("לא ברשימה");
const acts = h`${nameBtn(r.p, r.n)}${r.muted
? unmuteBtn(r.p)
: h`<button type="button" class="btn s w-only" data-x="members.mute" data-p="${r.p}">השתקה</button>`}${r.blocked ? unblockBtn(r.p) : h`<button type="button" class="btn s w-only d" data-x="members.block" data-p="${r.p}" data-on="1">חסימה</button>`}`;
// בטלפון עמודת הפעולות מוסתרת: ביטול השתקה/חסימה נשאר בשורה עצמה (השאר בכרטיס ובסרגל הבחירה)
const quick = r.muted || r.blocked ? h`<div class="only-m mq">${r.muted ? unmuteBtn(r.p) : ""}${r.blocked ? unblockBtn(r.p) : ""}</div>` : "";
return h`<tr data-p="${r.p}"${on ? raw(' class="sel"') : ""}>
<td class="ck"><input type="checkbox" data-xc="members.sel" data-p="${r.p}" aria-label="${"בחירת " + (r.n || fmtLine(r.p))}"${on ? raw(" checked") : ""}></td>
<td><div class="mrow"><span class="av s" aria-hidden="true">${initial(r.n)}</span><div class="mrow-t"><button type="button" class="name" data-card="${r.p}" title="כרטיס חבר">${r.n || "ללא שם"}</button>${adm ? h` ${pill("מנהל", "acc")}` : ""}${r.muted ? h` ${pill(mutedTxt("מושתק", r.muted), "warn")}` : ""}${r.blocked ? h` ${pill("חסום", "bad")}` : ""}${r.code ? h`<div class="small mut">קוד ${r.code} בהודעות האישיות</div>` : ""}<div class="only-m small">${phone(r.p)}</div>${quick}</div></div></td>
<td class="hide-m">${phone(r.p)}</td><td>${tz}</td><td class="hide-m center">${r.general ? "✓" : ""}</td><td class="hide-m center">${r.rsvp ? "✓" : ""}</td><td class="num hide-m">${+r.calls ? r.calls : ""}</td><td class="num small mut ltr hide-m">${fmtD(r.last)}</td><td class="acts hide-m"><div class="btns">${acts}</div></td></tr>`;
};
const kpis = (d, rows) => {
const st = state.filter.memSt || "", joins = arr(d.joins).length;
const kp = (s, icon, label, n, cls, note) => h`<button type="button" class="kpi${cls ? " " + cls : ""}" data-x="members.st" data-st="${s}" aria-pressed="${st === s ? "true" : "false"}"><span class="ic" aria-hidden="true">${ico(icon)}</span><span class="k">${label}</span><span class="v">${n}</span>${note ? h`<span class="d">${note}</span>` : ""}</button>`;
// חסומים: הספירה כמו הסינון (חברים בלבד); מספרים חסומים שאינם חברים מוצגים כהערה
const kpBlocked = () => {
const inRows = new Set(rows.map(r => r.p));
const others = arr(d.blocked).filter(b => b && b.p && !inRows.has(b.p)).length;
return kp("blocked", "lock", "חברים חסומים", rows.filter(r => r.blocked).length, "", others ? "ועוד " + others + " שאינם חברים" : "");
};
return h`<div class="kpis">${kp("", "members", "חברים", rows.length)}${kp("tz", "bell", "פעילים בצינתוקים", rows.filter(r => r.tz === "on").length)}${kp("muted", "pause", "מושתקים", rows.filter(r => r.muted).length)}${kpBlocked()}<button type="button" class="kpi${joins ? " hl" : ""}" data-go="pending"><span class="ic" aria-hidden="true">${ico("pending")}</span><span class="k">בקשות הצטרפות</span><span class="v">${joins}</span>${joins ? h`<span class="d">לטיפול בממתינות</span>` : ""}</button></div>`;
};
const tableCard = (d, rows) => {
const shown = shownRows(d), st = state.filter.memSt || "", srt = state.filter.memSort || "", owner = d.owner;
const active = rows.filter(r => r.tz === "on").length;
const allOn = shown.length > 0 && shown.every(r => SEL.has(r.p)), someOn = !allOn && shown.some(r => SEL.has(r.p));
const chips = FLT.filter(f => !f[0] || f[0] === st || rows.some(r => f[2](r, owner))).map(f => {
const n = f[0] ? rows.filter(r => f[2](r, owner)).length : rows.length;
return h`<button type="button" class="chip" data-x="members.st" data-st="${f[0]}" aria-pressed="${st === f[0] ? "true" : "false"}">${f[1]} <b class="num">${n}</b></button>`;
});
const acts = h`${dlBtn("members_csv", h`${ico("download")} ייצוא לאקסל (CSV)`, "g", "members-" + todayIL() + ".csv")}<label class="btn s w-only">${ico("upload")} ייבוא מקובץ<input type="file" accept=".csv,.txt,text/csv" data-xfile="members.import" hidden></label>`;
const table = shown.length
? h`<div class="tw"><table class="tbl mtbl"><thead><tr><th class="ck"><input type="checkbox" data-xc="members.selShown" aria-label="בחירת כל המוצגים"${allOn ? raw(" checked") : ""}${someOn ? raw(' data-some="1"') : ""}></th><th>שם</th><th class="hide-m">טלפון</th><th>צינתוקים</th><th class="hide-m">רגילות</th><th class="hide-m">אירוע</th><th class="num hide-m">שיחות החודש</th><th class="hide-m">כניסה אחרונה</th><th class="hide-m"><span class="sr-only">פעולות</span></th></tr></thead><tbody>${shown.map(r => row(r, owner))}</tbody></table></div>`
: rows.length
? empty({ icon: "filter", title: "לא נמצאו חברים", text: "אפשר לשנות את החיפוש או את הסינון", act: h`<button type="button" class="btn s" data-x="members.clr">ניקוי הסינון</button>` })
: empty({ icon: "members", title: "עוד אין חברים", text: "אפשר להוסיף חבר ידנית או לייבא רשימה מקובץ" });
return h`<div class="card pad0 mcard-t">
<div class="mt-h"><div class="card-h"><h2>חברי הקבוצה</h2><small>${rows.length} · פעילים בצינתוקים ${active}</small><div class="acts">${acts}</div></div>
<p class="mut small">לחיצה על שם פותחת את כרטיס החבר המלא. אפשר לסמן כמה חברים ולבצע פעולה על כולם יחד.</p>
<div class="toolbar">${search("members", "חיפוש לפי שם או מספר")}<select data-filter="memSort" aria-label="מיון">${SORTS.map(([v, l]) => h`<option value="${v}"${srt === v ? raw(" selected") : ""}>${l}</option>`)}</select>${isFiltered() ? h`${pill("מוצגים " + shown.length, "info")}<button type="button" class="link" data-x="members.clr">ניקוי</button>` : ""}</div>
<div class="chips mt-f" role="group" aria-label="סינון החברים">${chips}</div></div>
${table}</div>`;
};
const reqCard = d => {
const joins = arr(d.joins), approved = arr(d.approved);
return h`<div class="card"><div class="card-h"><h2>בקשות הצטרפות</h2>${pill(joins.length, joins.length ? "bad" : "")}</div>
${joins.length ? h`<ul class="list">${joins.map(j => h`<li><div class="grow">${j.p ? h`<b>${nm(j.p) !== j.p ? nm(j.p) : "מספר לא מוכר"}</b> ${phone(j.p)}` : h`<span class="mut">מספר לא ידוע</span>`} <span class="mut small num ltr">${fmtD(j.date)}</span></div><button type="button" class="btn s p" data-go="pending">לטיפול</button></li>`)}</ul>` : empty("אין בקשות")}
<h3 class="sec-t">אושרו ומחכים שיתקשרו</h3>
${approved.length ? h`<ul class="list">${approved.map(a => h`<li><div class="grow">${who(a.n, a.p)} <div class="small mut">אושר ${fmtD(a.t)}${a.by ? " על ידי " + nm(a.by) : ""}</div></div>${a.p ? h`<button type="button" class="btn s g icon" data-card="${a.p}" title="כרטיס חבר" aria-label="כרטיס חבר">${ico("user")}</button>` : ""}</li>`)}</ul>` : empty("אין")}</div>`;
};
const addCard = d => {
const blocked = arr(d.blocked).filter(b => b && b.p);
return h`<div class="card"><div class="card-h"><h2>הוספת חבר ידנית</h2></div>
<form class="form w-only" data-xf="members.add"><div class="g2"><label class="fld"><span>מספר טלפון</span><input name="phone" placeholder="05XXXXXXXX" inputmode="tel" required autocomplete="off" class="ltr"></label><label class="fld"><span>שם מלא</span><input name="name" placeholder="שם מלא" required maxlength="40" autocomplete="off"></label></div>
<p class="mut small">החבר נכנס לרשימות של הקו ולתפריט ההודעות האישיות, ובפעם הבאה שיתקשר יצטרף אוטומטית לרשימת הצינתוקים.</p><div class="btns"><button type="submit" class="btn p">${ico("plus")} הוספה</button></div></form>
<p class="mut ro-only small">במצב צפייה אי אפשר להוסיף חברים.</p>
<h3 class="sec-t">חסומים <small class="mut">מנותקים מיד כשמתקשרים</small></h3>
${blocked.length ? h`<div class="chips">${blocked.map(b => h`<span class="chip bad"><span>${b.n || fmtLine(b.p)}</span><button type="button" class="w-only" data-x="members.block" data-p="${b.p}" data-on="0" aria-label="ביטול חסימה" title="ביטול חסימה">${ico("x")}</button></span>`)}</div>` : empty("אין מספרים חסומים")}
<form class="row w-only mt-blk" data-xf="members.blockPhone"><input name="phone" class="grow ltr" placeholder="חסימת מספר שאינו חבר" aria-label="חסימת מספר שאינו חבר" inputmode="tel" required autocomplete="off"><button type="submit" class="btn s d">חסימה</button></form></div>`;
};
// סרגל הפעולות על החברים שנבחרו (צף בתחתית)
const batchBar = () => h`<div class="batch" id="mbatch" role="toolbar" aria-label="פעולות על החברים שנבחרו"${SEL.size ? "" : raw(" hidden")}><b id="mbn">${SEL.size} נבחרו</b>
<button type="button" class="btn s w-only" data-x="members.batch" data-op="tz">📣 צינתוק</button><button type="button" class="btn s w-only" data-x="members.bpm">🔊 הודעה אישית</button><button type="button" class="btn s w-only" data-x="members.batch" data-op="mute">השתקה</button><button type="button" class="btn s w-only" data-x="members.batch" data-op="rsvp_add">רישום לאירוע</button><button type="button" class="btn s w-only d" data-x="members.batch" data-op="block">חסימה</button><button type="button" class="btn s" data-x="members.bmore">עוד…</button><button type="button" class="btn s" data-x="members.selnone">ניקוי</button></div>`;
const render = d => {
d = d || {};
const rows = rowsOf(d);
lastRows = rows;
return h`${kpis(d, rows)}${tableCard(d, rows)}<div class="cols">${reqCard(d)}${addCard(d)}</div>${batchBar()}`;
};

// ---------- אחרי פעולה: כרטיס פתוח → טעינה מחדש שלו; אחרת רענון הלשונית ----------
// line: הקו שבו התחילה הפעולה – אם הוחלף בינתיים, לא נוגעים בכלום
const after = (el, line) => {
if (line && !same(line)) return;
invalidate("home", "members");
if (el && el.closest && el.closest("#mm") && cur && Modal.current() === cur.hd) { dirty = true; return loadCard(cur.p); }
if (state.tab === "members") return refreshTabs("members");
};
const pOf = el => (el.closest("[data-p]") || el).dataset.p || el.dataset.phone || "";

// ---------- בחירה וסינון (לא כתיבה) ----------
Actions.change("members.sel", el => {
const p = el.dataset.p; if (!p) return;
if (el.checked) SEL.add(p); else SEL.delete(p);
updBatch();
});
Actions.change("members.selShown", el => {
$$('#main input[data-xc="members.sel"]').forEach(c => { if (c.dataset.p) { if (el.checked) SEL.add(c.dataset.p); else SEL.delete(c.dataset.p); } });
updBatch();
});
// סוגרים רק את החלון שממנו נלחץ הכפתור (לא כרטיס פתוח כשנלחץ "ניקוי" בסרגל)
const closeOwn = el => { if (el && el.closest && el.closest("#mm")) Modal.close(); };
Actions.register("members.selall", el => {
shownRows(data()).forEach(r => SEL.add(r.p));
closeOwn(el);
updBatch();
}, { write: false });
Actions.register("members.selnone", el => { SEL.clear(); closeOwn(el); updBatch(); }, { write: false });
Actions.register("members.st", el => {
const st = el.dataset.st || "";
state.filter.memSt = state.filter.memSt === st ? "" : st;
Tabs.rerender();
}, { write: false });
Actions.register("members.clr", () => {
state.filter.memSt = ""; state.filter.members = ""; state.filter.memSort = "";
Tabs.rerender();

async function each(line, phones, verb, fn) {
const N = phones.length;
let ok = 0, bad = 0;
for (let i = 0; i < N; i++) {
if (!same(line)) throw new Error(SWITCHED);
if (N > 2) toast(verb + "… " + (i + 1) + " מתוך " + N);
try { (await fn(phones[i])) === false ? bad++ : ok++; }
catch (e) { if (e && e.status === 401) throw e; bad++; }
}
return { ok, bad, line };
}

if (!same(res.line)) return;
toast("בוצע על " + res.ok + " חברים" + (res.bad ? ", " + res.bad + " לא בוצעו" : ""), res.bad > 0);
SEL.clear();
if (hd) hd.close();
updBatch();
invalidate("home", "members", ...(extra || []));
if (state.tab === "members") refreshTabs("members");
};

if (known) known.forEach(r => { byP[r.p] = r; });
const all = Array.from(SEL);
if (!all.length) return;
const pick = fn => known ? all.filter(p => fn(byP[p])) : all;

// ---------- ייבוא מקובץ ----------
const readText = file => new Promise((res, rej) => {
const fr = new FileReader();
fr.onload = () => res(String(fr.result || ""));
fr.onerror = () => rej(new Error("לא ניתן לקרוא את הקובץ"));
fr.readAsText(file);
});
const HEAD = /^(שם|name|טלפון|phone)$/i;
const parseRows = text => {
const out = [], seen = {};
String(text).replace(/^﻿/, "").split(/\r?\n/).forEach(line => {
const cells = line.split(/[,;\t]/).map(c => c.trim().replace(/^["']+|["']+$/g, "").trim());
let p = "", n = "";
cells.forEach(c => {
const d = c.replace(/[\s-]/g, "");
if (!p && PH.test(d)) { p = d; return; }
if (!n && /[֐-׿A-Za-z]/.test(c) && !HEAD.test(c)) n = c.slice(0, 40);
});
if (p && n && !seen[p]) { seen[p] = 1; out.push({ p, n }); }
});
return out;
};
Actions.file("members.import", async file => {
const rows = parseRows(await readText(file));
if (!rows.length) throw new Error("לא נמצאו שורות עם מספר טלפון ושם");
const names = state.names || {};
const st = r => (!names[r.p] ? "new" : names[r.p] !== r.n ? "ren" : "same");
const nNew = rows.filter(r => st(r) === "new").length, nRen = rows.filter(r => st(r) === "ren").length;
const my = imp = { rows, total: rows.length, isNew: new Set(rows.filter(r => st(r) === "new").map(r => r.p)), line: Line.cur, hd: null };
my.hd = Modal.open({

onClose: () => { if (imp === my) imp = null; },
body: h`<div class="stack"><div class="tiles">${tile(nNew, "חדשים – יצטרפו", "good")}${tile(nRen, "שם שונה")}${tile(rows.length - nNew - nRen, "ללא שינוי")}</div>
<div class="tw mcard-imp"><table class="tbl small"><thead><tr><th>שם בקובץ</th><th>טלפון</th><th>מצב</th></tr></thead><tbody>${rows.map(r => {
const s = st(r);
return h`<tr><td>${r.n}</td><td>${phone(r.p)}</td><td>${s === "new" ? pill("חדש", "ok") : s === "ren" ? pill("עכשיו: " + names[r.p], "warn") : pill("קיים")}</td></tr>`;
})}</tbody></table></div></div>`,
foot: h`<label class="chk"><input type="checkbox" id="imp-rename"> לעדכן גם שמות של חברים קיימים</label><span class="sp"></span><button type="button" class="btn g" data-x="close">ביטול</button><button type="button" class="btn p" id="imp-go" data-x="members.importGo">ייבוא</button>`,
});
});
Actions.register("members.importGo", async () => {
const job = imp;
if (!job) return;
if (!same(job.line)) { imp = null; if (job.hd) job.hd.close(); throw new Error("הקו הוחלף – יש לבחור את הקובץ מחדש"); }
const { rows, line } = job, rename = !!($("#imp-rename") || {}).checked;
const nNew = rows.filter(r => job.isNew.has(r.p)).length;
const again = rows.length < job.total;
if (!await Dlg.confirm2((again ? "להמשיך את הייבוא (" + rows.length + " שורות שנשארו)? " : "לייבא? ") + nNew + " חברים חדשים יצטרפו לקבוצה") || !same(line)) return;
let A = 0, R = 0, E = 0, sent = 0;
const sum = () => "נוספו " + A + ", שונו " + R + (E ? ", " + E + " שגיאות" : "");
const reload = () => { invalidate("home", "members"); if (state.tab === "members") refreshTabs("members"); };
try {
await runChunks(rows, IMP_CHUNK, async chunk => {

const r = await api("members_import", { rows: chunk, rename });
A += arr(r && r.added).length; R += arr(r && r.renamed).length; E += arr(r && r.errors).length;
sent += chunk.length;
}, (i, total) => toast("מייבא… " + Math.min(i + IMP_CHUNK, total) + " מתוך " + total));
} catch (e) {
if (!same(line) || (e && e.status === 401)) throw e;

throw new Error(((e && e.message) || "שגיאה") + ". עד העצירה: " + sum() + ". לא נשלחו " + (rows.length - sent) + " מתוך " + rows.length + " שורות – אפשר ללחוץ שוב על הייבוא כדי להמשיך");
}
if (!same(line)) return;
toast(sum(), !!E);
if (imp === job) imp = null;
if (job.hd) job.hd.close();
reload();
});

// טעינת הכרטיס (פתיחה חדשה או רענון במקום)
async function loadCard(p) {
const hd = cur && cur.hd;
if (!hd || Modal.current() !== hd) return;
const my = ++seq; cur.seq = my;
const sc = [hd.el, hd.body].filter(Boolean).map(el => el.scrollTop || 0);
try {
const d = await api("member?p=" + enc(p));
if (Modal.current() !== hd || !cur || cur.seq !== my) return;
state.card = d;
if (d && d.n) state.names[p] = d.n;
const t = $("#mm-title");
if (t) t.innerHTML = String(h`${(d && d.n) || "מספר לא מוכר"} <small class="num ltr">${fmtLine(p)}</small>`);
hd.set(memberHtml(Object.assign({}, d || {}, { p })));
bindTts(hd.body);
try { [hd.el, hd.body].filter(Boolean).forEach((el, i) => { el.scrollTop = sc[i] || 0; }); } catch {}
} catch (e) {
if (Modal.current() !== hd || !cur || cur.seq !== my) return;
if (e && e.status === 401) return;
hd.set(h`<div class="card">${errBox((e && e.message) || "שגיאה")}<div class="btns"><button type="button" class="btn s" data-x="members.cardRetry">${ico("refresh")} ניסיון חוזר</button></div></div>`);
}
}

const hd = Modal.open({

cur = { p, hd, seq: 0 };

});

return card({
title,
small: w.done ? "פורסם לאחרונה ב-" + w.done : "יוצא אוטומטית במוצאי שבת",
cls: "wk",
body: h`<div class="row w-only"><button type="button" class="btn" data-x="studio.weeklyDry">${DRY_BTN}</button><span class="mut small">הטיוטה לא עולה לקו עד שמאשרים</span></div>
${dr ? h`<form class="form w-only" data-xf="studio.weekly"><div class="mut small">טיוטה מ-<span class="num ltr">${fmtD(dr.d)}</span> · ${(Number(dr.count) || 0) + " הודעות"}</div><textarea name="text" maxlength="4000" aria-label="נוסח הסיכום">${dr.summary || ""}</textarea><div class="row"><button class="btn p" type="submit">פרסום בקו (הודעה רגילה)</button></div></form>` : ""}`,
});
};

});

// שליחת הקול לתיבות האישיות
Actions.form("studio.sendpm", async (form, v) => {
const t = state.tts;
if (!t || !t.id) throw new Error("צריך ליצור קול קודם");

// בחירה של "לחברים שאבחר" פותחת את רשימת החברים

// צינתוק לחברים נבחרים (אחרי שליחה מוצלחת – מנקים את הבחירה כדי שלא ישלחו שוב בטעות)

: "לשלוח צינתוק ל-" + rc.length + " חברים?")) return;

toast(r && r.deferred ? "שבת/חג: יישלח במוצאי שבת/חג" : r && r.test ? "מצב בדיקה: צינתוק יוצא רק למנהלים שבין הנבחרים" : r && r.sent === false ? "ימות לא אישרו את שליחת הצינתוק" : "נשלח ל-" + ((r && r.count) || 0), !!(r && !r.deferred && !r.test && r.sent === false));

Actions.form("studio.weekly", async (form, v) => {

// ---------- הלשונית ----------
let keepRec = null;
Tabs.register({
id: "studio",
label: "שידור",
icon: "studio",
group: "line",
head: { sub: "מקליטים, מעלים או מקריאים בקול העוזר, ומשדרים לקו." },
aiSug: ["מה ממתין לטיפול עכשיו?", "מי בקו עכשיו?", "סכם לי את היום בקו"],
// weekly – רך (שרת ישן → null, שגיאה → {__err}); שמות – מהמטמון, ואם ריק – overview פעם אחת
load: async () => {
const needNames = !hasNames();
const [weekly, ov] = await Promise.all([
apiSoft("weekly").catch(e => {
if (e && e.status === 401) throw e;
return { __err: (e && e.message) || "שגיאה" };
}),
needNames ? api("overview").catch(e => { if (e && e.status === 401) throw e; return null; }) : null,
]);
const d = { weekly };
if (ov && ov.names && typeof ov.names === "object") d.names = ov.names;
return d;
},
// ציור מחדש ברקע (פתיחה מהמטמון, רענון אחרי פעולה) מחליף את כל #main.
// הקלטה פעילה או הקלטה שעוד לא הועלתה נשמרות: render (לפני ההחלפה) שומר את הרכיב הקיים, ו-after מחזיר אותו במקום החדש.
render: d => {

keepRec = o && o._line === Line.cur && ($('[data-x="rec"][aria-pressed="true"]', o) || o._wav) ? o : null;
return h`<div class="cols two">${ttsCard()}${recCard()}</div>${tzCard()}${weeklyCard(d && d.weekly)}`;
},
after: main => {
const n = $('[data-rec="line"]', main), k = keepRec;
keepRec = null;
if (!n) return;
if (k && k !== n) { n.replaceWith(k); return; }
n._line = Line.cur;
},
css: ".t-studio #ttsout:empty{display:none}.t-studio #ttsout audio,.t-studio .rpv audio{width:100%;max-width:none}.t-studio .st-out{display:grid;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r3);background:var(--hover)}.t-studio .st-pick>summary{cursor:pointer;padding:4px 0}.t-studio .st-pick[open]>summary{margin-bottom:8px}.t-studio .wk textarea{min-height:180px}.t-studio .picker{max-height:260px;overflow-y:auto}",
});
})();

// ===== 26-sched.js =====
// לשונית "תזמונים" (sched) – תזמון מתקדם, כל התזמונים, שבת וחג וצינתוקים שמחכים למוצאי שבת/חג
(() => {
const NA = "לא זמין בשרת של הקו הזה";
const TYPES = [["post", "הודעה בקו (בקול העוזר)"], ["tz", "צינתוק לרשימה"], ["entry", "החלפת ההודעה בכניסה"], ["pm", "הודעה אישית לחברים נבחרים"], ["remind", "תזכורת לחבר"]];
const EVERY_OPTS = [["", "פעם אחת"], ["day", "כל יום"], ["week", "כל שבוע"]];
const LISTS = [["members", "כל החברים"], ["admins", "מנהלים"], ["general", "רשימת הרגילות"]];
const EVERY = { day: ", כל יום", week: ", כל שבוע" };
const opts = (list, cur) => list.map(([v, l]) => h`<option value="${v}"${v === cur ? raw(" selected") : ""}>${l}</option>`);

// אילו שדות גלויים לכל סוג תזמון (ו"עד" רק בתזמון חוזר)
const SHOW = (t, every) => [["s-text", t !== "tz"], ["s-post", t === "post"], ["s-tz", t === "tz"], ["s-pm", t === "pm"], ["s-remind", t === "remind"], ["s-until", !!every]];
const syncType = form => {
if (!form) return;
const v = n => { const el = form.querySelector('select[name="' + n + '"]'); return el ? el.value : ""; };
SHOW(v("type") || "post", v("every")).forEach(([cls, on]) => { const el = form.querySelector("." + cls); if (el) el.hidden = !on; });
};
const jobsOf = d => ((d && d.jobs) || []).filter(j => j && typeof j === "object");
const pendingOf = d => jobsOf(d).filter(j => !j.done);

// ---------- כרטיסים ----------
// טופס התזמון המתקדם (כולו לכותבים בלבד)
const formCard = d => {
const minAt = d && d.now ? dtInput(d.now) : "";
return card({
title: "⏰ תזמון מתקדם",
cls: "w-only",
body: h`<form class="form" data-xf="sched.add">
<div class="g2 sc-top">
<label class="fld"><span>מה לתזמן</span><select name="type" data-xc="sched.type" aria-label="סוג התזמון">${opts(TYPES, "post")}</select></label>
<label class="fld"><span>מתי</span><input type="datetime-local" name="at" class="ltr"${minAt ? h` min="${minAt}"` : ""} required aria-label="מתי"></label>
<label class="fld"><span>חזרה</span><select name="every" data-xc="sched.type" aria-label="חזרה">${opts(EVERY_OPTS, "")}</select></label>
<label class="fld s-until" hidden><span>עד</span><input type="datetime-local" name="until" class="ltr" aria-label="עד"><small>לא חובה</small></label>
</div>
<div class="fld s-text"><textarea name="text" rows="4" placeholder="הנוסח" maxlength="1500" aria-label="הנוסח"></textarea></div>
<div class="s-post"><label class="chk"><input type="checkbox" name="important"> הודעה חשובה + צינתוק לכולם</label></div>
<label class="fld s-tz" hidden><span>לאיזו רשימה</span><select name="list" aria-label="רשימה">${opts(LISTS, "members")}</select></label>
<div class="fld s-pm" hidden><b>למי</b>${picker("rcpt")}</div>
<label class="fld s-remind" hidden><span>לאיזה חבר</span><select name="phone" aria-label="חבר"><option value="">לאיזה חבר?</option>${memberOpts()}</select></label>
<div class="row"><button class="btn p" type="submit">${ico("sched")} קביעת התזמון</button><span class="mut small">בשבת ובחג שום דבר לא יוצא – התזמון ימתין למוצאי שבת/חג</span></div>
</form>`,
});
};

// טבלת כל התזמונים (מהשרת: מהמאוחר למוקדם, כולל שנשלחו)
const tableCard = d => {
const jobs = jobsOf(d), waiting = pendingOf(d).length;
const row = j => h`<tr${j.done ? raw(' class="off"') : ""}>
<td class="num small ltr nowrap">${j.at || ""}</td>
<td>${jobText(j)}</td>
<td class="small mut">${j.byName || ""}</td>
<td>${j.done ? pill("נשלח " + fmtD(j.done), "ok") : pill("ממתין", "info")}</td>
<td class="acts">${j.done ? "" : h`<button type="button" class="btn s d w-only" data-x="sched.cancel" data-id="${j.id || ""}" data-at="${j.at || ""}" data-text="${j.text || ""}" data-type="${j.type || ""}">ביטול</button>`}</td>
</tr>`;
const body = jobs.length
? h`<div class="tw"><table class="tbl"><thead><tr><th>זמן</th><th>מה</th><th>מי קבע</th><th>מצב</th><th aria-label="ביטול"></th></tr></thead><tbody>${jobs.map(row)}</tbody></table></div>`
: empty({ icon: "sched", title: "אין תזמונים", text: "תזמון חדש נקבע בטופס \"תזמון מתקדם\"" });
return card({ title: "כל התזמונים", small: waiting + " ממתינים", cls: jobs.length ? "pad0" : "", body });
};

// לוח שבת וחג
const holyCard = hl => {
const title = "🕯 שבת וחג";
if (!hl) return card({ title, body: empty("אין נתונים מ-Hebcal") });
const periods = (hl.periods || []).filter(Boolean);
const body = periods.length
? h`<ul class="list">${periods.map(p => h`<li${p.past ? raw(' class="li off"') : ""}><span class="grow num ltr${p.past ? " mut" : ""}">${fmtD(p.from)} ← ${fmtD(p.to)}</span>${p.active ? pill("עכשיו", "warn") : p.past ? pill("עבר") : ""}</li>`)}</ul>`
: empty("אין נתונים מ-Hebcal");
return card({ title, small: hl.holy ? "עכשיו זמן קודש" : "עכשיו חול", cls: hl.holy ? "hl" : "", body });
};

// צינתוקים שנדחו בשבת/חג
const defCard = hl => {
const title = "צינתוקים שמחכים למוצאי שבת/חג";
if (!hl) return card({ title, body: h`<p class="mut">${NA}</p>` });
const def = (hl.deferred || []).filter(Boolean);
const act = def.length ? h`<button type="button" class="btn s d w-only" data-x="sched.def" data-op="cancel_all">ביטול כולם</button>` : "";
const body = def.length
? h`<ul class="list">${def.map(x => h`<li><span class="grow">${x.label || x.phones || ""}</span><span class="acts w-only"><button type="button" class="btn s" data-x="sched.def" data-op="send" data-i="${x.i}" data-phones="${x.phones || ""}">שליחה עכשיו</button><button type="button" class="btn s d" data-x="sched.def" data-op="cancel" data-i="${x.i}" data-phones="${x.phones || ""}">ביטול</button></span></li>`)}</ul>`
: empty("אין");
return card({ title, small: String(def.length), act, body });
};

// ---------- פעולות ----------
// הצגת השדות לפי הסוג והחזרה
Actions.change("sched.type", el => syncType(el.form || el.closest("form")), { write: false });

// קביעת תזמון מתקדם
Actions.form("sched.add", async (form, v) => {
const rc = v.$all("rcpt").map(String).filter(Boolean);
const every = v.every || "";
const until = every && v.until ? dtLocal(v.until) : "";
const body = { type: v.type, at: dtLocal(v.at), text: String(v.text || "").trim(), important: !!v.important, list: v.list, phones: rc, phone: v.phone, every, until };
if (until && until <= body.at) throw new Error("התאריך \"עד\" צריך להיות אחרי זמן התזמון");
const what = {
post: (body.important ? "הודעה חשובה" : "הודעה") + ": " + body.text,
tz: "צינתוק ל" + (LISTN[body.list] || body.list || ""),
entry: "החלפת הודעת הכניסה: " + body.text,
pm: "הודעה אישית ל-" + rc.length + " חברים",
remind: "תזכורת ל" + nm(body.phone),
}[body.type] || "";
if (!await Dlg.confirm("לקבוע ל-" + body.at + (EVERY[body.every] || "") + ":\n" + what)) return;
const line = Line.cur;
await api("schedule2", body);
toast("התזמון נקבע");
if (form.isConnected) { form.reset(); syncType(form); }
if (Line.cur === line) await refreshTabs("sched");
});

// ביטול תזמון ממתין
Actions.register("sched.cancel", async el => {
const d = el.dataset;
if (!await Dlg.confirm("לבטל את התזמון הזה?", { danger: true })) return;
const line = Line.cur;
await api("unsched", { id: d.id, at: d.at, text: d.text, type: d.type });
toast("התזמון בוטל");
if (Line.cur === line) await refreshTabs("sched");
});

// צינתוקים שנדחו: שליחה עכשיו, ביטול, ביטול כולם
Actions.register("sched.def", async el => {
const op = el.dataset.op;
if (["send", "cancel", "cancel_all"].indexOf(op) < 0) return;
const ok = op === "cancel_all"
? await Dlg.confirm2("לבטל את כל הצינתוקים שמחכים?")
: await Dlg.confirm(op === "send" ? "לשלוח עכשיו, למרות שבת/חג?" : "לבטל את הצינתוק הזה?", { danger: op !== "send" });
if (!ok) return;
const line = Line.cur;
const body = { op, i: +el.dataset.i };
if (el.dataset.phones) body.phones = el.dataset.phones;   // השרת מזהה את הצינתוק לפי התוכן – הרשימה יכולה להשתנות בינתיים
await api("deferred", body);
toast("בוצע");
if (Line.cur === line) await refreshTabs("sched");
});

// ---------- הלשונית ----------
Tabs.register({
id: "sched",
label: "תזמונים",
icon: "sched",
group: "line",
head: {
sub: "ההודעה הנכונה בזמן הנכון: צינתוקים, הודעות וחזרות קבועות.",
chips: d => [{ n: pendingOf(d).length, label: "בתור", cls: "" }],
},
aiSug: ["מה מתוזמן להיום?", "תזמן צינתוק לכל החברים מחר ב-20:00"],
// schedule – חובה; holy – רך (שרת ישן או כישלון של Hebcal לא מפילים את הלשונית)
load: async () => {
const [s, hl] = await Promise.all([
api("schedule"),
apiSoft("holy").catch(e => { if (e && e.status === 401) throw e; return null; }),
]);
return Object.assign({}, s, { holy: hl && !hl.error ? hl : null });
},
render: d => h`<div class="cols two">${formCard(d)}<div class="stack">${holyCard(d.holy)}${defCard(d.holy)}</div></div>${tableCard(d)}`,
after: main => syncType($('form[data-xf="sched.add"]', main)),
css: ".t-sched .tw>.tbl{min-width:640px}.t-sched .sc-top{align-items:start}.t-sched .s-pm .picker{max-height:220px;overflow-y:auto}.t-sched .list>li>.acts{display:flex;gap:6px;flex:none}@media (max-width:560px){.t-sched .sc-top{grid-template-columns:minmax(0,1fr)}}",
});
})();

// ===== 27-event.js =====
// לשונית "אירוע" (event) – ההרשמה לאירוע בשלוחה 9: מי נרשם, מי עוד לא, אירוע חדש ועריכה
(() => {
const evOf = d => (d && d.event && typeof d.event === "object") ? d.event : {};
const rsvpOf = d => ((d && d.rsvp) || []).filter(r => r && r.p);
const notRegOf = d => ((d && d.notReg) || []).filter(r => r && r.p);
const trim = v => String(v || "").trim();

// שדות האירוע (שם + מתי ואיפה), ריקים או ממולאים
const fields = (ev = {}) => h`<label class="fld"><span>שם האירוע</span><input name="title" value="${ev.title || ""}" placeholder="שם האירוע" aria-label="שם האירוע" maxlength="80" required></label>
<label class="fld"><span>מתי ואיפה</span><input name="desc" value="${ev.desc || ""}" placeholder="מתי ואיפה" aria-label="מתי ואיפה" maxlength="200"></label>`;

// ---------- כרטיסים ----------
// פרטי האירוע: מונים, הורדה וצינתוק למי שלא נרשם
const infoCard = d => {
const ev = evOf(d), rs = rsvpOf(d), nr = notRegOf(d), all = rs.length + nr.length;
const pct = all ? Math.round(100 * rs.length / all) : 0;
return h`<div class="card hl">
<div class="card-h"><h2>🎉 ${ev.title || "אירוע"}</h2><small>שלוחה 9</small></div>
${ev.desc ? h`<p class="mut">${ev.desc}</p>` : ""}
<div class="tiles">${tile(rs.length, "נרשמו", "good")}${tile(nr.length, "עוד לא נרשמו", nr.length ? "warn" : "")}</div>
${all ? h`<div class="ev-prog"><div class="meter" role="progressbar" aria-label="נרשמו" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="${"width:" + pct + "%"}"></i></div><span class="small mut num">${pct}%</span></div>` : ""}
<div class="row">${dlBtn("rsvp_csv", "⬇ רשימת הנרשמים (CSV)", "", "event-rsvp.csv")}${nr.length ? h`<button type="button" class="btn s w-only" data-x="event.tzMissing">📣 צינתוק למי שלא נרשם</button>` : ""}</div>
</div>`;

// שיחות עם העוזר, עם סינון לפי חבר (בזיכרון בלבד). קישור לכרטיס חבר רק למי שרשום בחברים (state.names)

: empty({ icon: "msgs", text: "אין שיחות" }),
});
};

</div>`;
})}</div>

// ===== 29-reports.js =====
// לשונית "דוחות" (reports) – דוח חודשי, מי שמע את ההודעות החשובות, ועל מה שואלים את העוזר.
// נתיבים: GET report?m=YYYY-MM (חובה), GET convstats ו-GET heard (רכים), POST heard {phones}.
(() => {
const WD = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
const HOURS = Array.from({ length: 24 }, (_, i) => (i < 10 ? "0" : "") + i);
const arr = x => (Array.isArray(x) ? x : []);
const n0 = x => +x || 0;
const okMonth = m => /^\d{4}-\d{2}$/.test(String(m || ""));
const curMonth = () => (okMonth(state.repM) ? state.repM : todayIL().slice(0, 7));
const fname = f => String(f || "").replace(/\.wav$/i, "");
const NA = "לא זמין בשרת של הקו הזה";
// "YYYY-MM" → "נובמבר 2026" (אם הדפדפן תומך)
const monthHe = m => {
if (!okMonth(m)) return "";
try { return new Date(m + "-15T12:00:00Z").toLocaleDateString("he-IL", { month: "long", year: "numeric", timeZone: "UTC" }); } catch { return m; }
};
// שגיאה בחלק משני לא מפילה את הלשונית (401 ממשיך הלאה)
const soft = p => p.catch(e => ((e && e.status === 401) ? Promise.reject(e) : { _err: (e && e.message) || "שגיאה" }));
const naBody = () => h`<p class="mut">${NA}</p>`;
// חודש הדוח שייך לקו: במעבר קו (או למרכז) חוזרים לחודש הנוכחי, כמו בטעינה של דף חדש
Line.onSwitch(() => { state.repM = todayIL().slice(0, 7); });

// כרטיס הראש: בורר חודש, הדפסה וקישור לסטטיסטיקה
const headCard = m => h`<div class="card hl rp-head">
<div class="card-h"><h2>📊 דוח חודשי</h2><small>${monthHe(m) && monthHe(m) !== m ? h`${monthHe(m)} <span class="num ltr rp-m">(${m})</span>` : m}</small>
<div class="acts row">
<input type="month" class="ltr" data-xc="reports.month" value="${m}" max="${todayIL().slice(0, 7)}" aria-label="חודש הדוח">
<button type="button" class="btn s g" data-x="print">🖨 הדפסה / PDF</button>
</div></div>
<div class="row small"><button type="button" class="link" data-go="stats">לסטטיסטיקה של 30 יום ←</button></div>
</div>`;

// אריחים עם השוואה לחודש הקודם
const tilesHtml = r => h`<div class="tiles">
${tileD(n0(r.calls), "שיחות", r.callsPrev)}
${tileD(n0(r.callers), "מתקשרים שונים", r.callersPrev)}
${tileD(n0(r.msgs), "הודעות שעלו", r.msgsPrev)}
${tileD(n0(r.conv), "שיחות עם העוזר", r.convPrev)}
${tile(n0(r.imp), "הודעות חשובות")}
${tile(n0(r.active) + "/" + n0(r.members), "חברים שהתקשרו")}
</div>`;

// גרפים: לפי יום בחודש ולפי שעה
const chartsHtml = r => {
const bd = arr(r.byDay);
return h`<div class="cols two">
${card({ title: "שיחות לפי יום", small: r.month || "", body: bd.length ? chart(bd.map(x => String((x && x.d) || "").slice(8)), bd.map(x => n0(x && x.n)), { unit: "שיחות", xName: "יום" }) : empty("אין נתונים") })}
${card({ title: "שעות השיא", body: chart(HOURS, HOURS.map((_, i) => n0(arr(r.byHour)[i])), { unit: "שיחות", xName: "שעה", xEvery: 8 }) })}
</div>`;
};

// פעילים, ימים בשבוע, מי לא התקשר, לאן נכנסו
const barsHtml = r => {
const silent = arr(r.silent).filter(x => x && x.p);
const wd = WD.map((l, i) => ({ l, n: n0(arr(r.byWeekday)[i]) }));
const bf = (r.byFolder && typeof r.byFolder === "object" && !Array.isArray(r.byFolder)) ? r.byFolder : {};
const folders = Object.keys(bf).map(l => ({ l, n: n0(bf[l]) })).sort((a, b) => b.n - a.n).slice(0, 10);
const top = arr(r.top).map(x => ({ n: (x && (x.n || nm(x.p))) || "", calls: n0(x && x.calls) }));
return h`<div class="cols">
${card({ title: "הכי פעילים", body: hbars(top, "n", "calls") })}
${card({ title: "לפי יום בשבוע", body: wd.some(x => x.n) ? hbars(wd, "l", "n") : empty("אין נתונים") })}
${card({ title: "לא התקשרו החודש", small: String(silent.length), body: silent.length
? h`<div class="chips">${silent.map(x => h`<button type="button" class="chip" data-card="${x.p}" title="כרטיס חבר">${x.n || nm(x.p)}</button>`)}</div>`

${card({ title: "לאן נכנסו", body: hbars(folders, "l", "n") })}
</div>`;
};

const heardHtml = hd => {
const title = "👂 מי שמע את ההודעות החשובות";
if (!hd) return card({ title, body: naBody() });
if (hd._err) return card({ title, body: errBox(hd._err) });
const list = arr(hd.list).filter(x => x && x.f);
if (!list.length) return card({ title, body: empty("אין הודעות חשובות") });
return card({ title, small: String(list.length), cls: "rp-heard", body: list.map(x => {
const heard = arr(x.heard).filter(y => y && y.p), not = arr(x.not).filter(y => y && y.p);
const phones = not.map(y => String(y.p));
return h`<details><summary>${ico("chevron", "rp-chev")}<b>${fname(x.f)}</b> <span class="num small mut ltr">${fmtD(x.t)}</span> ${pill("שמעו " + heard.length, "ok")} ${pill("לא שמעו " + not.length, not.length ? "bad" : "")}</summary>
<div class="row">${playBtn("/1/1/" + x.f)}${not.length ? h`<button type="button" class="btn s w-only" data-x="reports.heardTz" data-ph="${JSON.stringify(phones)}">📣 צינתוק ל-${not.length} שלא שמעו</button>` : ""}</div>
<div class="chips">${heard.map(y => chip(y.n || nm(y.p), "ok"))}${not.map(y => chip(y.n || nm(y.p), "bad"))}</div>
</details>`;
}) });
};

// על מה שואלים את העוזר + שיחות לפי שעה
const convStatsHtml = c => {
const t1 = "🤖 על מה שואלים את העוזר", t2 = "שיחות עם העוזר לפי שעה";
if (!c || c._err) {
const body = c ? errBox(c._err) : naBody();
return h`<div class="cols two">${card({ title: t1, body })}${card({ title: t2, body })}</div>`;
}
const words = arr(c.words).filter(w => w && w.w);
const max = Math.max(1, ...words.map(w => n0(w.n)));
// גודל המילה לפי השכיחות (3 דרגות); המספר מופיע גם בטקסט וגם ב-title
const lvl = n => (n0(n) >= max * 0.66 ? " w3" : n0(n) >= max * 0.33 ? " w2" : "");
const per = arr(c.per).map(x => ({ n: (x && (x.n || nm(x.p))) || "", c: n0(x && x.c) }));
return h`<div class="cols two">
${card({ title: t1, small: n0(c.total) + " שיחות" + (c.first ? " מאז " + fmtD(c.first) : ""), body: h`${words.length
? h`<div class="words">${words.map(w => h`<span class="${"wd" + lvl(w.n)}" title="${w.n}"><b class="num">${n0(w.n)}</b>${w.w}</span>`)}</div>`
: empty("אין מספיק שיחות")}<h3>מי משתמש הכי הרבה</h3>${hbars(per, "n", "c")}` })}
${card({ title: t2, body: chart(HOURS, HOURS.map((_, i) => n0(arr(c.byHour)[i])), { unit: "שיחות", xName: "שעה", xEvery: 8 }) })}
</div>`;
};

// חיפוש בשיחות עם העוזר (המסנן convq; גם מהחיפוש הכללי)
const convSearchHtml = c => {
if (!c || c._err) {
// הגיעו מהחיפוש הכללי אבל אין נתונים – מראים את החיפוש ולמה אין תוצאות
const q = String(state.filter.convq || "").trim();
return q ? card({ title: "חיפוש בשיחות עם העוזר", small: "«" + q + "»", body: c ? errBox(c._err) : naBody() }) : "";
}
const all = arr(c.conv).filter(Boolean);
const cq = String(state.filter.convq || "").trim();
const conv = cq ? all.filter(x => ((x.q || "") + " " + (x.a || "") + " " + (x.n || "")).includes(cq)) : all.slice(0, 40);
return card({
title: "חיפוש בשיחות עם העוזר",
small: cq ? conv.length + " תוצאות" : "",
body: h`<div class="toolbar">${search("convq", "מילה, שם, נושא…")}</div>
${conv.length
? h`<div class="conv">${conv.slice(0, 60).map(x => h`<div class="m"><div class="mut small"><span class="num ltr nowrap">${fmtD(x.d)}</span> · ${x.n || nm(x.p) || ""}</div><div class="q">${x.q || ""}</div><div class="a">${x.a || ""}</div></div>`)}</div>`
: empty("לא נמצא")}`,
});
};

// ---------- פעולות ----------
// בחירת חודש – טעינה מחדש של הדוח

${convStatsHtml(d.c)}

},
css: ".t-reports .rp-head .acts input{min-height:36px;padding-block:5px}.t-reports .rp-heard details{border-top:1px solid var(--line);padding:10px 0}.t-reports .rp-heard details:first-of-type{border-top:0}.t-reports .rp-heard summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:8px;list-style:none}.t-reports .rp-heard summary::-webkit-details-marker{display:none}.t-reports .rp-chev{color:var(--mut);transition:transform .15s}.t-reports .rp-heard details[open]>summary .rp-chev{transform:rotate(180deg)}.t-reports .rp-m{display:none}@media print{.t-reports .rp-m{display:inline}}.t-reports .rp-heard .row{margin:10px 0 8px}.t-reports button.chip{cursor:pointer;font:inherit}.t-reports .words .w2{font-size:.95rem}.t-reports .words .w3{font-size:1.06rem;font-weight:700}.t-reports .words b{font-size:.75rem;font-weight:700}",
