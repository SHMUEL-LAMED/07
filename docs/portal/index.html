if(!await Dlg.confirm(`לבנות קו חדש "${v.name}" (${v.linePhone}) בשם yemot-line-${v.slug}?\nייווצר שרת חדש ב-Cloudflare עם מפתחות ה-AI של קו המקור.`,{ok:"בניית הקו"}))return;
b.disabled=true;toast("בונה את הקו… זה יכול לקחת חצי דקה");
try{S.fx.created=await fxApi(Object.assign({op:"create",ymToken:S.fx.token},v));S.fx.status=null;S.data=null;await load();}
catch(e){fail(e,b);}
},
async fxCopy(){
const v=(S.fx.created&&S.fx.created.adminPass)||"";
try{
if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error("x");
await navigator.clipboard.writeText(v);toast("הועתק");
}catch{await Dlg.prompt("העתיקו:",v);}
},
fxIvr:b=>{const l=(S.fx.created&&S.fx.created.line)||{};ivrStart(l.slug,b,S.fx.token);},
async fxAgain(){if(await Dlg.confirm("לעבור לקו נוסף? הסיסמה של הקו הזה לא תוצג שוב.")){S.fx=newFx();route();}},
async ivrApply(f){
const p=S.fx.plan;if(!p)return;
const paths=$$("[name=p]:checked",f).map(i=>i.value),conf=String(f.confirm.value||"").trim();
if(!paths.length)return toast("לא נבחרו שלוחות",true);
if(!conf){f.confirm.focus();return toast("להקליד את השם הקצר לאישור",true);}
if(!await Dlg.confirm(`לכתוב ${paths.length} קובצי שלוחות למערכת של "${p.slug}"?`,{danger:true,ok:"כתיבה"}))return;
const b=$("[type=submit]",f);b.disabled=true;
try{
const r=await fxApi({op:"ivr_apply",slug:p.slug,ymToken:p.token,paths,confirm:conf});
Modal.close();
const done=(r.done||[]).length,failed=r.failed||[],sk=(r.skipped||[]).length;
toast(r.ok?`נכתבו ${done} שלוחות`:`נכתבו ${done}, נכשלו ${failed.length}${sk?`, ${sk} ממתינות לסבב נוסף`:""}`,!r.ok);
if(failed.length)await Dlg.alert("לא נכתבו:\n"+failed.map(x=>typeof x==="string"?x:JSON.stringify(x)).join("\n"));
}catch(e){fail(e,b);}
},
};
const CHG={
cp:()=>{if(S.cp){S.cp=null;put($("#cpOut"),"");}}, // שינוי בבחירה מבטל את התצוגה המקדימה
accAdd:s=>{const a=accOf(s);if(!a||!s.value)return;busy(s,()=>saveAccess(a.email,(a.c.lines||[]).concat([s.value])));},
};
const run=(fn,el,e)=>{try{const r=fn(el,e);if(r&&r.catch)r.catch(er=>toast(er.message,true));}catch(er){toast(er.message,true);}};
document.addEventListener("click",e=>{
const t=e.target;
if(!t||!t.closest)return;
if(S.pickerOpen&&!t.closest(".picker"))togglePicker(false);
if(t.closest("#modal [data-close]")||t.id==="modal")return Modal.close();
const a=t.closest("[data-act]");
if(a&&a.tagName!=="FORM"&&a.tagName!=="SELECT"&&ACT[a.dataset.act]){
if(a.tagName==="BUTTON"||a.tagName==="DIV")e.preventDefault();
if(a.disabled)return;
return run(ACT[a.dataset.act],a,e);
}
if(t.closest(".side a[href^='#']"))toggleSide(false);
});
document.addEventListener("submit",e=>{
const f=e.target.closest&&e.target.closest("form[data-act]");
if(!f||!ACT[f.dataset.act])return;
e.preventDefault();run(ACT[f.dataset.act],f,e);
});
document.addEventListener("change",e=>{
const s=e.target.closest&&e.target.closest("[data-chg]");
if(s&&CHG[s.dataset.chg])run(CHG[s.dataset.chg],s,e);
});
document.addEventListener("input",e=>{if(e.target&&e.target.id==="pickQ")drawPicker(e.target.value);});
document.addEventListener("keydown",e=>{
if(Dlg.isOpen())return;
if(e.key==="Escape"){
if(Modal._open){Modal.close();return;}
if(S.pickerOpen){togglePicker(false);const b=$("#pickBtn");if(b)b.focus();return;}
toggleSide(false);return;
}
if(Modal._open)return Dlg._trap(e,$("#modal .box"));
});
addEventListener("hashchange",()=>{if(S.me)route();});
// ===== הפעלה =====
if(S.token)load();else showLogin();
})();
</script></body></html>
