const Version = {

start() {

for (let i = 0; i < t.length; i++) x = (x * 31 + t.charCodeAt(i)) | 0;

Version._reload();
} catch {}

_reload() {

return h`<ol class="fx-steps" aria-label="שלבים">${names.map((n, i) => {
const k = i + 1, cls = k < cur ? "ok" : k === cur ? "on" : "";

})}</ol>`;
};

const step1 = () => h`<form class="form" data-xf="lines.check" autocomplete="off">
    <label class="field"><span><b>טוקן של מערכת בימות המשיח</b> (למשל <span class="num ltr">0791234567:1234</span> או טוקן API)</span>
    <div class="row"><input class="grow ltr" type="password" name="t" required autocomplete="off" placeholder="טוקן" value="${fx.token}" aria-label="טוקן"><button class="btn p w-only">בדיקת הטוקן</button></div></label>
    <p class="mut small">הבדיקה רק קוראת מימות (פרטי מערכת ותיקיות). הטוקן לא נשמר בדפדפן.</p></form>`;
// שלב 2 – פרטי הקו
const step2 = d => {

    </div>
    <p class="mut small">ייווצר Worker חדש בשם <span class="num ltr">yemot-line-&lt;שם קצר&gt;</span> עם אחסון משלו, כל ה-AI וכל מפתחות הקול של הקו הזה, ודף ניהול משלו. הקו נוצר <b>במצב בדיקה</b> – צינתוקים רק למנהלים.</p>

// שלב 3 – נבנה
const step3 = () => {
const r = fx.created || {}, ln = r.line || {}, slug = ln.slug || fx.tokenSlug || "";
const st = Array.isArray(r.steps) ? r.steps : [];
return h`<div class="fx-new"><p><b>הקו "${ln.name || slug}" נבנה!</b></p>

const planState = p => [

(Array.isArray(p.warn) ? p.warn : []).map(w => h`<div class="note">${String(w)}</div>`),
];
// כרטיס חיבור השלוחות
const planCard = () => {
const P = fx.plan; if (!P) return "";
const rows = (Array.isArray(P.plan) ? P.plan : []).filter(p => p && p.path);

title: 'חיבור השלוחות של "' + (P.slug || "") + '"',

      <p class="mut small">כל קובץ מועתק מהקו הזה, אחרי החלפת כתובת השרת ומפתח ההרצה בכתובת של הקו החדש. מה שכבר קיים במערכת החדשה נשמר בגיבוי לפני הכתיבה. קבצי שמע והודעות <b>לא</b> מועתקים.</p>

      <div class="row"><input class="ltr grow" name="confirm" placeholder="להקליד את השם הקצר לאישור" required autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="השם הקצר לאישור"><button class="btn p">כתיבת השלוחות שנבחרו</button><button type="button" class="btn" data-x="lines.planx">סגירה</button></div>

// לשונית "בקרה חיה" (live) – מי בקו עכשיו, חדר הוועידה וציר הזמן של יום
(() => {
const CONF = "בחדר הוועידה";
// מחוברים בטוחים מהתשובה (שדה חסר / שרת ישן)
const onl = d => ((d && d.online) || []).filter(c => c && c.p);
const ents = d => ((d && d.calls && d.calls.ents) || []).filter(Boolean);

const seen = list => {
const now = Date.now(), fs = state.firstSeen, on = {};
list.forEach(c => { on[c.p] = 1; if (!fs[c.p]) fs[c.p] = now; });
Object.keys(fs).forEach(p => { if (!on[p]) delete fs[p]; });
};
// משך מאז שנראה לראשונה: פחות מדקה "N שנ׳", אחרת M:SS
const dur = p => {
const t = state.firstSeen[p];
if (!t) return "";
const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
return s < 60 ? s + " שנ׳" : Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
// שורת מחובר
const onRow = c => h`<li class="row"><span class="grow">${who(c.n || state.names[c.p], c.p)} <span class="mut small">${c.w || ""}</span></span><span class="num small live-d" data-p="${c.p}">${dur(c.p)}</span>${c.id ? h`<button type="button" class="btn s d w-only" data-x="hangup" data-id="${c.id}" data-phone="${c.p}" data-name="${c.n || nm(c.p)}">ניתוק</button>` : ""}</li>`;

const tlRow = e => h`<div class="r"><span class="t num small mut">${e.t || ""}</span><span><b>${e.n || nm(e.p) || fmtLine(e.p)}</b> · ${e.l || e.f || ""}</span><span class="mut small num">${e.x ? "עד " + e.x : ""}</span></div>`;
// יום אחר בציר הזמן (קריאה בלבד)
Actions.change("live.day", el => {
state.liveDay = /^\d{4}-\d{2}-\d{2}$/.test(el.value || "") ? el.value : todayIL();
return show("live", true);
}, { write: false });

let imp = null;   // { rows, nNew }
const readText = file => new Promise((res, rej) => {
const fr = new FileReader();
fr.onload = () => res(String(fr.result || ""));
fr.onerror = () => rej(new Error("לא ניתן לקרוא את הקובץ"));
fr.readAsText(file);
});
const HEAD = /^(שם|name|טלפון|phone)$/i;
const parseRows = text => {
const out = [], seen = {};
String(text).replace(/^﻿/, "").split(/\r?\n/).forEach(line => {
const cells = line.split(/[,;\t]/).map(c => c.trim().replace(/^["']+|["']+$/g, "").trim());
let p = "", n = "";
cells.forEach(c => {
const d = c.replace(/[\s-]/g, "");
if (!p && /^0\d{8,9}$/.test(d)) { p = d; return; }
if (!n && /[֐-׿A-Za-z]/.test(c) && !HEAD.test(c)) n = c.slice(0, 40);
});
if (p && n && !seen[p]) { seen[p] = 1; out.push({ p, n }); }
});
return out;
};

async function loadCard(p) {
const hd = cur && cur.hd;
if (!hd || Modal.current() !== hd) return;
const my = ++seq; cur.seq = my;
const box = hd.el, top = box ? box.scrollTop : 0;
try {
const d = await api("member?p=" + encodeURIComponent(p));
if (Modal.current() !== hd || !cur || cur.seq !== my) return;
state.card = d;
if (d && d.n) state.names[p] = d.n;
const t = $("#mm-title");
if (t) t.innerHTML = String(h`${(d && d.n) || "מספר לא מוכר"} <small class="num ltr">${fmtLine(p)}</small>`);
hd.set(memberHtml(Object.assign({ p }, d || {})));
try { if (box) box.scrollTop = top; } catch {}
} catch (e) {
if (Modal.current() !== hd || !cur || cur.seq !== my) return;
if (e && e.status === 401) return;
hd.set(h`<div class="card">${errBox((e && e.message) || "שגיאה")}</div>`);
}
}

// לשונית "סל מחזור" (trash) – הקלטות שנמחקו או הוצאו מהחשובות (/DeletedByAdmin)

if (!name) return;

const r = await api("restore", { name, to });

// מחיקה לצמיתות – קובץ אחד או ריקון הסל (השרת מוחק עד 40 בכל קריאה, עד 30 סבבים)
Actions.register("trash.purge", async el => {
const all = el.dataset.all === "1", name = el.dataset.name || "";
if (!all && !name) return;
const ok = all
? await Dlg.confirm2("למחוק לצמיתות את כל ההקלטות בסל המחזור? אי אפשר לבטל")
: await Dlg.confirm("למחוק לצמיתות את " + name + "?", { danger: true });
if (!ok) return;
let n = 0;
try {
for (let i = 0; i < 30; i++) {
const r = await api("purge", all ? { all: true } : { name });
const got = Number(r && r.n) || 0;
n += got;
if (!all || !(r && r.left) || !got) break;
toast("נמחקו " + n + ", ממשיך…");
}
} catch (e) {
// כישלון באמצע – מרעננים כדי להציג את הסל העדכני, והליבה מציגה את השגיאה

throw e;
}
toast("נמחקו " + n + " הקלטות");
await refreshTabs("trash");
});

// ===== 90-boot.js =====
// ===================================================================
// הפעלה: מאזינים, מעטפת, hash (#t= / #g= / לשונית), כניסה, ריענון גרסה
// ===================================================================
function boot() {
// קריאה שלא תפיל את ההפעלה כולה
const safe = fn => { try { return fn(); } catch (e) { console.error(e); } };
safe(() => Core.init()); safe(() => Shell.init()); safe(() => Shell.renderNav()); safe(() => Prefs.apply());
safe(() => Shell.setLine({ name: LINE_SLUG ? "טוען…" : LINE_NAME_DEFAULT, label: LINE_SLUG ? "" : LINE_DEFAULT }));
const clean = () => { try { history.replaceState(null, "", location.pathname + (LINE_SLUG ? "?l=" + LINE_SLUG : "")); } catch {} };
const hash = location.hash;
let m, gcred = "";
// 1. קישור צפייה בלבד – נשמר ונמחק מהכתובת מיד
if (REMOTE && (m = hash.match(/^#t=([\w.-]+)$/))) { Session.set(m[1]); clean(); state.tab = "home"; }
// 2. העברה מהמרכז – נמחק מיד; ההחלפה לאסימון חדש למטה
else if (REMOTE && (m = hash.match(/^#g=([A-Za-z0-9._-]+)$/))) { gcred = m[1]; clean(); }
// 3. לשונית התחלתית: #tab[/sub] → העדפת "עמוד הפתיחה" → home
if (!m) {
const hs = hash.replace(/^#/, "");
if (hs && !/^[tg]=/.test(hs)) {
const p = hs.split("/");
try { state.tab = decodeURIComponent(p[0]); state.sub = p[1] ? decodeURIComponent(p[1]) : ""; } catch { state.tab = "home"; }
state.startTab = state.tab;
} else if (!hs) {
const st = Prefs.get("start");
if (st && st !== "home") { state.tab = st; state.startTab = st; }
}
} else if (gcred) {
const st = Prefs.get("start");
if (st && st !== "home") { state.tab = st; state.startTab = st; }
}
(async () => {
// 4. #g=: תמיד מחליפים לאסימון חדש; בכישלון – רק אסימון גוגל שמור של אותו מייל
if (gcred) {
const prev = Session.token;
try { await Session.create("", gcred); }
catch (e) {
const em = Session.emailOfToken(prev);
if (!(em && em === Session.emailOfJwt(gcred))) { Session.drop(e.message); safe(() => Version.start()); return; }
}
}
// 5. כניסה או הפעלה
if (!REMOTE || Session.token) { Session.hideLogin(); safe(() => startApp()); }
else Session.showLogin();
// 6. ריענון כשעולה גרסה חדשה של הדף
safe(() => Version.start());
})();
}
boot();</script></body></html>
